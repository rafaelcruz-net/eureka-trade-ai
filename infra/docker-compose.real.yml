# Overlay of the REAL walking skeleton of 261113-trading-real-bot (U1 u1-bot-wallet, infrastructure-specification.md
# Q1), used ONLY by scripts/verify.sh for the bot wallet spec, ON TOP of docker-compose.yml and
# infra/docker-compose.test.yml:
#   docker compose -f docker-compose.yml -f infra/docker-compose.test.yml -f infra/docker-compose.real.yml up
# It adds the TxSigner (own process, own schema and logins), its migration, the TEST-ONLY kms-sim (AWS KMS JSON
# protocol) and the local Solana validator, and turns the REAL on for this run only. The TxSigner publishes NO port
# (private network, NFR1.2); only the validator RPC is published on loopback, for the e2e test code that funds the
# test main wallet. Nothing here is a secret of production: the AWS keys are the fixed "test" values the kms-sim
# ignores, and the service token and the database passwords come from the run (scripts/verify.sh generates them).
# Kept out of the two files checked by ComposeFilesTest so the PAPER smoke stays exactly as it is.
services:
  db-bootstrap:
    environment:
      TXSIGNER_DB_OWNER_USER: ${TXSIGNER_DB_OWNER_USER:-txsigner_owner}
      TXSIGNER_DB_OWNER_PASSWORD: ${TXSIGNER_DB_OWNER_PASSWORD:?generated by scripts/verify.sh}
      TXSIGNER_DB_USER: ${TXSIGNER_DB_USER:-txsigner_app}
      TXSIGNER_DB_PASSWORD: ${TXSIGNER_DB_PASSWORD:?generated by scripts/verify.sh}

  txsigner-migrate:
    image: memetrade-txsigner:${IMAGE_TAG:-local}
    environment:
      SPRING_PROFILES_ACTIVE: migrate
      TXSIGNER_DB_HOST: postgres
      TXSIGNER_DB_NAME: ${POSTGRES_DB:-memetrade}
      TXSIGNER_DB_OWNER_USER: ${TXSIGNER_DB_OWNER_USER:-txsigner_owner}
      TXSIGNER_DB_OWNER_PASSWORD: ${TXSIGNER_DB_OWNER_PASSWORD:?generated by scripts/verify.sh}
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    restart: 'no'

  kms-sim:
    # TEST ONLY (NFR1.6): never in a production composition; the production profile of the TxSigner refuses it.
    build: ./infra/kms-sim
    image: memetrade-kms-sim:${IMAGE_TAG:-local}
    environment:
      # U4 (infrastructure-specification.md): a fixed seed makes the bot wallet of the test user the same address on
      # every run, the one the swap fixtures were recorded for. Accepted by the kms-sim only with the test profile;
      # the production profile of the TxSigner refuses a seed. Not a secret: it derives test keys only.
      KMS_SIM_SEED: eureka-local-swap-fixtures-v1
      KMS_SIM_PROFILE: test
    mem_limit: 192m
    restart: unless-stopped

  solana-validator:
    # Local validator (team.md "Determinismo": no devnet, mainnet nor real key in the CI); reset on every start.
    # U4: infra/solana-fixtures/validator.sh adds --bpf-program and --account for every program and account recorded
    # once by infra/solana-fixtures/record.sh (mounted read-only); with none recorded it starts as before.
    image: anzaxyz/agave:v2.2.20@sha256:2c4180eed846414c32941b2488ba6759a6ff9725e70d285f1f3dd4a2a2356396
    entrypoint: ['sh', '/fixtures/validator.sh']
    volumes:
      - ./infra/solana-fixtures:/fixtures:ro
    ports:
      - '127.0.0.1:8899:8899'
    healthcheck:
      test: ['CMD-SHELL', 'solana --url http://127.0.0.1:8899 cluster-version >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    mem_limit: 2g
    restart: unless-stopped

  jupiter-stub:
    # U4 (infrastructure-specification.md "Jupiter simulada"): WireMock pinned by digest, serving the answers recorded
    # once by infra/solana-fixtures/record.sh (quote and swap instructions); never the real Jupiter. No published port.
    image: wiremock/wiremock:3.9.1@sha256:8fe02bc3f9b63deb1454d41750dbaf081adf4b3e8c74fd8e31f790bee5647b88
    command: ['--port', '8080', '--disable-banner', '--no-request-journal']
    volumes:
      - ./infra/solana-fixtures/jupiter:/home/wiremock:ro
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8080/__stub/health >/dev/null']
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    mem_limit: 256m
    restart: unless-stopped

  txsigner:
    image: memetrade-txsigner:${IMAGE_TAG:-local}
    environment:
      SPRING_PROFILES_ACTIVE: kms-sim
      TXSIGNER_REAL_ENABLED: 'true'
      TXSIGNER_NETWORK: LOCALNET
      TXSIGNER_DB_HOST: postgres
      TXSIGNER_DB_NAME: ${POSTGRES_DB:-memetrade}
      TXSIGNER_DB_USER: ${TXSIGNER_DB_USER:-txsigner_app}
      TXSIGNER_DB_PASSWORD: ${TXSIGNER_DB_PASSWORD:?generated by scripts/verify.sh}
      TXSIGNER_SERVICE_TOKEN: ${TXSIGNER_SERVICE_TOKEN:?generated by scripts/verify.sh}
      TXSIGNER_KMS_ENDPOINT: http://kms-sim:4599
      TXSIGNER_KMS_HMAC_KEY_ID: hmac-anchor-key
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      txsigner-migrate:
        condition: service_completed_successfully
      kms-sim:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped

  api:
    # U4 (infrastructure-specification.md "Decisão do bot"): RECORDED_MINT, RECORDED_DECIMALS, RECORDED_BUY_LAMPORTS and
    # RECORDED_SELL_UNITS of the swap recorded once by infra/solana-fixtures/record.sh. Optional: without the file the
    # variables do not exist, application-test.yml reads them as empty and nothing changes (no pinned token, no test
    # strategy). Read only by the test profile; the api pins the recorded mint and the wrapped SOL in sim-a.
    env_file:
      - path: ./infra/solana-fixtures/recorded.env
        required: false
    environment:
      MEMETRADE_REAL_ENABLED: 'true'
      MEMETRADE_REAL_SEED_TEST_RELEASE: 'true'
      MEMETRADE_TXSIGNER_URL: http://txsigner:8443
      MEMETRADE_TXSIGNER_TOKEN: ${TXSIGNER_SERVICE_TOKEN:?generated by scripts/verify.sh}
    depends_on:
      txsigner:
        condition: service_healthy

  worker:
    # U4: the same optional recordings; the worker runs the test strategy (one buy of exactly RECORDED_BUY_LAMPORTS of
    # RECORDED_MINT) and lets the REAL barrier read the source as REAL for that mint only. Empty without the file.
    env_file:
      - path: ./infra/solana-fixtures/recorded.env
        required: false
    environment:
      MEMETRADE_REAL_ENABLED: 'true'
      MEMETRADE_TXSIGNER_URL: http://txsigner:8443
      MEMETRADE_TXSIGNER_TOKEN: ${TXSIGNER_SERVICE_TOKEN:?generated by scripts/verify.sh}
      # One local validator plays both providers; the two-provider FAILED rule still needs both answers.
      MEMETRADE_RPC_PRIMARY_URL: http://solana-validator:8899
      MEMETRADE_RPC_SECONDARY_URL: http://solana-validator:8899
      # U4: the recorded Jupiter (http is accepted only in the test and local profiles).
      MEMETRADE_JUPITER_BASE_URL: http://jupiter-stub:8080
      # U5 (infrastructure-specification.md "Ponta a ponta"): the reconciliation every 15 s, so the divergence spec
      # sees its divergence and its resolution in seconds, and the CI gate fixed GREEN (accepted on LOCALNET only;
      # the start-up checks refuse a fixed CI result on MAINNET). Nothing calls GitHub in this run.
      MEMETRADE_REAL_OPS_RECONCILIATION_INTERVAL: PT15S
      MEMETRADE_REAL_OPS_CI: GREEN
    depends_on:
      solana-validator:
        condition: service_healthy
      jupiter-stub:
        condition: service_healthy
      txsigner:
        condition: service_healthy
