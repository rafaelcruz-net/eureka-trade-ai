# Overlay used ONLY by scripts/verify.sh, the smoke, the e2e run, the load test and scripts/perf-audit.sh:
#   docker compose -f docker-compose.yml -f infra/docker-compose.test.yml up
# It activates the "test" profile, which seeds the BETA_USER account of the generated smoke wallet (public address
# only). The raised login limit applies only when the load-test workflow sets SPRING_PROFILES_ACTIVE=test,loadtest.
# Same rules as docker-compose.yml (ComposeFilesTest checks the merged result): it changes only the api, never gives
# it the owner or superuser credential, and keeps postgres -> db-bootstrap -> db-migrate -> api as the start order.
services:
  api:
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-test}
      SMOKE_BETA_WALLET_ADDRESS: ${SMOKE_BETA_WALLET_ADDRESS:?generated by scripts/verify.sh}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-1000}
