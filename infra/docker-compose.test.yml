# Overlay used ONLY by scripts/verify.sh, the smoke, the e2e run, the load test and scripts/perf-audit.sh:
#   docker compose -f docker-compose.yml -f infra/docker-compose.test.yml up
# It activates the "test" profile, which seeds the BETA_USER account of the generated smoke wallet (public address
# only). The raised login limit applies only when the load-test workflow sets SPRING_PROFILES_ACTIVE=test,loadtest.
# Same rules as docker-compose.yml (ComposeFilesTest checks the merged result): it changes only the api, never gives
# it the owner or superuser credential, and keeps postgres -> db-bootstrap -> db-migrate -> api as the start order.
# U3: SMOKE_INVITE_CODE (smoke) and SMOKE_INVITE_CODES (load scenario u3) become PENDING invitations in the test
# profile only; both default to empty, so the daily smoke needs neither. INVITE_LOOKUP_RATE_LIMIT_PER_MINUTE is read
# only by the loadtest profile and defaults to the shipped 10 (Infrastructure Design review finding).
# U7: the LOADTEST_* values size the load cycle driver of the loadtest profile (scenarios u7 and u7-jobs); they are
# read only by application-loadtest.yml and default to 0, so the driver does nothing in the smoke and the e2e run.
# U6: the LOADTEST_U6_* values switch on and size the load risk driver of the loadtest profile (scenario u6); it is off
# unless LOADTEST_U6_ENABLED is true, so the smoke and the e2e run never seed nor evaluate anything.
# U5: LOADTEST_U5_ENABLED switches on the bot seed of the api and the cycle stopwatch of the worker (scenario u5);
# LOADTEST_U5_DECISIONS_PER_BOT sizes the decisions seeded in one bot per person and LOADTEST_U5_PEOPLE the people
# (the ledger load of U7 stays at 0 in u5). MARKET_SIMULATED_SCENARIO=FREQUENT_SIGNALS (u5 only) is read by the test
# profile alone. Off and STANDARD by default.
# u1-legal-documents: the api reads the test catalog of the legal documents mounted from apps/api/src/test/resources.
services:
  api:
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-test}
      SMOKE_BETA_WALLET_ADDRESS: ${SMOKE_BETA_WALLET_ADDRESS:?generated by scripts/verify.sh}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-1000}
      SMOKE_INVITE_CODE: ${SMOKE_INVITE_CODE:-}
      SMOKE_INVITE_CODES: ${SMOKE_INVITE_CODES:-}
      # u5-anonymization: the invitation of the throw-away account of e2e/anonymization; empty by default.
      SMOKE_ANONYMIZATION_INVITE_CODE: ${SMOKE_ANONYMIZATION_INVITE_CODE:-}
      INVITE_LOOKUP_RATE_LIMIT_PER_MINUTE: ${INVITE_LOOKUP_RATE_LIMIT_PER_MINUTE:-10}
      LOADTEST_LEDGER_PEOPLE: ${LOADTEST_LEDGER_PEOPLE:-0}
      LOADTEST_FILLS_PER_PERSON: ${LOADTEST_FILLS_PER_PERSON:-0}
      LOADTEST_CYCLE_BOTS: ${LOADTEST_CYCLE_BOTS:-0}
      LOADTEST_TOKENS_PER_BOT: ${LOADTEST_TOKENS_PER_BOT:-5}
      LOADTEST_CLOSE_BOTS: ${LOADTEST_CLOSE_BOTS:-0}
      LOADTEST_U6_ENABLED: ${LOADTEST_U6_ENABLED:-false}
      LOADTEST_U6_REJECTIONS_PER_BOT: ${LOADTEST_U6_REJECTIONS_PER_BOT:-10000}
      LOADTEST_U6_HEAVY_BOT_REJECTIONS: ${LOADTEST_U6_HEAVY_BOT_REJECTIONS:-80000}
      LOADTEST_U6_OLD_APPROVED: ${LOADTEST_U6_OLD_APPROVED:-200000}
      LOADTEST_U6_PURGE_AT: ${LOADTEST_U6_PURGE_AT:-300s}
      LOADTEST_U5_ENABLED: ${LOADTEST_U5_ENABLED:-false}
      LOADTEST_U5_DECISIONS_PER_BOT: ${LOADTEST_U5_DECISIONS_PER_BOT:-20000}
      LOADTEST_U5_PEOPLE: ${LOADTEST_U5_PEOPLE:-20}
      # u4-data-requests: the synthetic requests of the load scenario data-requests, read only by the loadtest profile.
      LOADTEST_DATA_REQUESTS_SEED: ${LOADTEST_DATA_REQUESTS_SEED:-0}
      MARKET_SIMULATED_SCENARIO: ${MARKET_SIMULATED_SCENARIO:-STANDARD}
      # U8 (cicd-pipeline.md): the public address of the throw-away administrator wallet of the smoke, exported by
      # scripts/verify.sh before the `up`; empty by default, so no administrator exists outside that run.
      ADMIN_WALLET_ADDRESSES: ${ADMIN_WALLET_ADDRESSES:-}
      # u1-legal-documents (functional-spec.md "Texto da v2"): the smoke, the e2e run and the load test read the TEST
      # catalog "reviewed" (legacy v1 and a v2 reviewed FOR TESTS), mounted read-only from the test resources; the image
      # keeps only the real catalog, where the draft v2 is never activated without its legal review.
      MEMETRADE_TERMS_LOCATION: file:/app/terms-test/
    volumes:
      - ./apps/api/src/test/resources/terms-test/reviewed:/app/terms-test:ro
  # U5: the worker with the same test profile plus its own; the seeds of the test profile never run here
  # (@ProcessRole(API)). ONLY this overlay publishes the worker actuator, on loopback 8082, for the load scenario u5
  # (botCycles, Hikari metrics); the base file publishes no worker port (ComposeFilesTest).
  worker:
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-test},worker
      LOADTEST_U5_ENABLED: ${LOADTEST_U5_ENABLED:-false}
    ports:
      - '127.0.0.1:8082:8081'
