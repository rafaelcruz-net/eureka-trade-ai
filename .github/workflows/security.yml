# Secrets, SAST and dependency scanning (NFR6.7, NFR6.8). Critical/High blocks the merge; Medium only warns.
# Exceptions live in security/exceptions.yml (justification, approval, expiry <= 90 days); an expired one blocks again.
name: security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Gitleaks (pinned version, checksum verified)
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .gitleaks-version)"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -fsSLO "${base}/gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSLO "${base}/gitleaks_${version}_checksums.txt"
          grep "gitleaks_${version}_linux_x64.tar.gz" "gitleaks_${version}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${version}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --verbose .
          ./gitleaks dir --config .gitleaks.toml --redact .

  sast:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    strategy:
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # javascript-typescript analyses the whole repository without a build: apps/web and, since U8, apps/admin.
      - uses: github/codeql-action/init@51f77329afa6477de8c49fc9c7046c15b9a4e79d # v3.29.5
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}
      - if: matrix.language == 'java-kotlin'
        run: sh apps/api/mvnw -B -ntp -f apps/api/pom.xml -DskipTests -Djacoco.skip=true -Dspotless.check.skip=true package
      # Results stay as a run artifact (no code-scanning upload, so no write permission is needed).
      - uses: github/codeql-action/analyze@51f77329afa6477de8c49fc9c7046c15b9a4e79d # v3.29.5
        with:
          upload: never
          output: codeql-results
      - name: Block on error-level (Critical/High) findings
        run: |
          set -euo pipefail
          errors="$(jq '[.runs[].results[] | select(.level == "error")] | length' codeql-results/*.sarif)"
          warnings="$(jq '[.runs[].results[] | select(.level == "warning")] | length' codeql-results/*.sarif)"
          echo "::warning::CodeQL medium findings: ${warnings}"
          test "${errors}" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: codeql-${{ matrix.language }}
          path: codeql-results
          retention-days: 30

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Cache the NVD database
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-
      - name: Expired security exceptions block again
        run: sh apps/api/mvnw -B -ntp -f apps/api/pom.xml -Dtest=SecurityExceptionsTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Active exceptions become Dependency-Check suppressions
        run: |
          set -euo pipefail
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<suppressions xmlns="https://jeremylong.github.io/DependencyCheck/dependency-suppression.1.3.xsd">'
            yq -r '.exceptions[] | select(.tool == "dependency-check") | "  <suppress until=\"" + .expires + "Z\"><notes>" + .id + "</notes><vulnerabilityName>" + .finding + "</vulnerabilityName></suppress>"' security/exceptions.yml
            echo '</suppressions>'
          } > dependency-check-suppressions.xml
      - name: OWASP Dependency-Check (CVSS >= 7 blocks)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >-
          sh apps/api/mvnw -B -ntp -f apps/api/pom.xml
          org.owasp:dependency-check-maven:12.1.0:check
          -DfailBuildOnCVSS=7
          -DsuppressionFiles="${GITHUB_WORKSPACE}/dependency-check-suppressions.xml"
          -DossindexAnalyzerEnabled=false
          -DnvdApiKey="${NVD_API_KEY}"
          -Dformats=HTML,JSON
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Frontend dependency audit (High/Critical blocks)
        run: pnpm --dir apps/web audit --audit-level high
      # U8 (R-03 of the Infrastructure Design): the administrator app has its own lockfile.
      - name: Administrator app dependency audit (High/Critical blocks)
        run: pnpm --dir apps/admin audit --audit-level high
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dependency-check
          path: apps/api/target/dependency-check-report.*
          retention-days: 30
