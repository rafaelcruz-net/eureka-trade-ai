# CI of every pull request and push to main (cicd-pipeline.md). Third-party actions are pinned by commit SHA;
# permissions are read-only; no secret is used. A red job blocks the merge.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Manual run (gh workflow run ci), for when a push did not start the CI.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # U2: both compositions must parse and resolve (base file, and base + test overlay); placeholder values only,
      # nothing is started and no secret is used.
      - name: Compose config
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-placeholder
          DB_OWNER_PASSWORD: ci-placeholder
          DB_PASSWORD: ci-placeholder
          DB_RETENTION_PASSWORD: ci-placeholder
          ACCESS_TOKEN_SIGNING_KEY: ci-placeholder
          SMOKE_BETA_WALLET_ADDRESS: ci-placeholder
          MEMETRADE_AUDIT_WALLET_HMAC_KEY: ci-placeholder
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f infra/docker-compose.test.yml config --quiet
      # Spotless, unit + integration tests (Testcontainers, PostgreSQL 17), JaCoCo check >= 80% lines,
      # enforcer ban of the Solana SDK outside test scope, ArchUnit, default limit = 10, docker-compose.yml checks.
      - name: Verify backend
        run: sh apps/api/mvnw -B -ntp -f apps/api/pom.xml verify
      - name: Alert rules (promtool)
        run: |
          for rules in real-alerts marketdata-alerts real-risk-alerts real-execution-alerts real-ops-alerts real-exits-alerts; do
            docker run --rm -v "$PWD/infra/observability:/rules" --entrypoint promtool \
              prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 \
              check rules "/rules/${rules}.yml"
          done
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-coverage
          path: apps/api/target/site/jacoco
          retention-days: 7

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web format:check
      - run: pnpm --dir apps/web typecheck
      - name: Jest with the 80% line floor
        run: pnpm --dir apps/web exec jest --coverage

  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Generated OpenAPI equals apps/api/openapi/openapi-guest.yaml and openapi-admin.yaml
        run: sh apps/api/mvnw -B -ntp -f apps/api/pom.xml -Dtest=GuestOpenApiContractTest,AdminOpenApiContractTest -Dsurefire.failIfNoSpecifiedTests=false test
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm --dir apps/web install --frozen-lockfile
      - name: Generated frontend types equal schema.d.ts
        run: pnpm --dir apps/web check:api

  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      # Images tagged with the commit SHA; .env is absent, so verify.sh generates ephemeral secrets per run.
      - name: Walking-skeleton verification
        env:
          IMAGE_TAG: ${{ github.sha }}
          BUILD_SHA: ${{ github.sha }}
        run: bash scripts/verify.sh
      - name: Keep the Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-report
          path: apps/web/playwright-report
          retention-days: 7
  admin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          package_json_file: apps/admin/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/admin/pnpm-lock.yaml
      - run: pnpm --dir apps/admin install --frozen-lockfile
      - run: pnpm --dir apps/admin lint
      - run: pnpm --dir apps/admin format:check
      - run: pnpm --dir apps/admin typecheck
      - name: Jest with the 80% line floor
        run: pnpm --dir apps/admin exec jest --coverage
      - name: Generated administrator types equal schema.d.ts
        run: pnpm --dir apps/admin check:api
  txsigner:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: TxSigner verify (testes, JaCoCo 80%, Spotless)
        run: sh apps/txsigner/mvnw -B -ntp -f apps/txsigner/pom.xml verify

  e2e:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, admin, contract, smoke, txsigner]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Full Playwright run on the smoke environment
        env:
          IMAGE_TAG: ${{ github.sha }}
          BUILD_SHA: ${{ github.sha }}
        run: bash scripts/verify.sh
