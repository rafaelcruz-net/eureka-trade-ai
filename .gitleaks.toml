title = "MemeTrade gitleaks configuration"

# Start from the upstream default ruleset and only add narrow allowlists.
[extend]
useDefault = true

[allowlist]
description = "Generated or third-party files that cannot contain project secrets"
paths = [
  '''(^|/)pnpm-lock\.yaml$''',
  '''(^|/)\.mvn/wrapper/maven-wrapper\.properties$''',
  '''(^|/)PRD_MemeTrade_Analytics_v1\.3_SaaS\.pdf$''',
  # Local build output ignored by git (never committed); "gitleaks dir" would otherwise scan it.
  '''(^|/)\.next/''',
  '''(^|/)node_modules/''',
  '''(^|/)target/''',
  '''(^|/)\.tools/''',
]
# Exception (team.md "Segurança na CI"): the AWS KMS key spec name of the bot-wallet key is a public constant, not a
# secret; the generic-api-key rule matches it in the KMS policy, the TxSigner KMS adapter and the KMS test server.
# Only this exact value is allowed. Approved by the project owner on 2026-11-15; valid until 2027-02-13.
regexes = [
  '''^ECC_NIST_EDWARDS25519$''',
]
