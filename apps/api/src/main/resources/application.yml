spring:
  application:
    name: memetrade-api
  main:
    banner-mode: off
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:memetrade}
    username: ${DB_USER:memetrade_app}
    password: ${DB_PASSWORD:}
    hikari:
      # U4 infrastructure-specification.md (Q1): 20 connections (10 in U1), 2 s wait for a connection; the wait counts
      # in the NFR3.1 budget. RuntimeSettingsGuard refuses a value outside 10..50 naming DB_POOL_MAX_SIZE.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      # Fixed-size pool (HikariCP's recommendation): with 5 idle connections, a burst of guests opened up to 15 new ones
      # and paid that inside the reacceptance lock check (u3-reacceptance NFR3.2, p95 8 to 17 ms against 5 ms in the
      # Build and Test of 261109-termos-lgpd). The 20 connections are already in the budget of docker-compose.yml.
      minimum-idle: ${DB_POOL_MAX_SIZE:20}
      connection-timeout: 2000
      pool-name: memetrade-pool
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # NFR6.3: the API never migrates. The db-migrate service (profile "migrate", MigrationRunner) applies the
    # changelog with the owner login before the API starts; the owner credential never reaches this profile.
    enabled: false
  task:
    scheduling:
      # One thread per @Scheduled method (counted by U6): U1 to U3 relay, idempotency cleanup, the two daily audit jobs
      # and the login limiter eviction (5); U4 collection dispatcher, history cleanup and scanner limiter eviction (3);
      # U7 marking, pending close, reconciliation and the "check now" limiter eviction (4); U6 purge of the old approved
      # evaluations (1); U5 the live channel mark poller of the api (1); U8 the kill switch reconciliation and the
      # feedback purge (2); u2-retention the login challenge purge and the session purge (2); u4-data-requests the
      # timers of the data subject requests, their purge and the refresher of their counts (3). RuntimeSettingsGuard
      # refuses less than 21 in the api (SCHEDULER_POOL_SIZE); the worker (application-worker.yml) has its own 4.
      pool:
        size: ${SCHEDULER_POOL_SIZE:21}
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
    deserialization:
      # NFR6.1 / BR1.8: undeclared fields are rejected with VALIDATION_FAILED.
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false
  threads:
    virtual:
      enabled: false

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    whitelabel:
      enabled: false

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,db,migrations
      status:
        order: DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN
        http-mapping:
          DEGRADED: 200
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        # u3-reacceptance (Passo 16 of the Build and Test loop-back): the wait for a connection of the pool, read by the
        # load scenario "reacceptance" next to the lock check (acquireP95Ms, informative only; no limit changes).
        hikaricp.connections.acquire: true
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  override-with-generic-response: false
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  writer-with-order-by-keys: true
  api-docs:
    version: openapi_3_1
  group-configs:
    - group: guest
      paths-to-match: /api/v1/**
      paths-to-exclude: /api/v1/admin/**
    # Administrative operations provided by the modules (C8); versioned in apps/api/openapi/openapi-admin.yaml.
    # u1-legal-documents: the public legal documents (L1) are read by the administrator app too.
    - group: admin
      paths-to-match:
        - /api/v1/admin/**
        - /api/v1/legal/**

memetrade:
  # U5 (C20, NFR10.9): api (default) or worker; @ProcessRole beans exist only in their process.
  process: ${MEMETRADE_PROCESS:api}
  real:
    # 261113-trading-real-bot (BR1.1, team.md "REAL desligado por padrão"): off by default in the api and the worker.
    # Off, the routes that open risk answer 403 REAL_DISABLED, no bot wallet is created and nothing is signed; reading
    # and withdrawing stay available for wallets created before (FR3.3). Fixed here, never a default from the
    # environment: only an explicit MEMETRADE_REAL_ENABLED=true in a deployment turns it on.
    enabled: false
    # BR1.2: the activation needs the acceptance of this version of the terms (the REAL text; final text in the U6).
    required-terms-version: v3
    network: ${MEMETRADE_REAL_NETWORK:LOCALNET}
    # BR2.1: absolute cap of the profile; BR3.4 fee reserve (0.03 SOL); BR5.1 f fee ceiling of a withdrawal.
    max-cap-lamports: 10000000000
    fee-reserve-lamports: 30000000
    max-withdrawal-fee-lamports: 100000
    # BR4.5: rent-exempt minimum of a system account (890,880 lamports on every Solana cluster today).
    rent-exempt-minimum-lamports: 890880
    # NFR4.3: the fee is known before signing: base fee per signature plus ceil(price x limit / 10^6).
    base-fee-lamports: 5000
    compute-unit-limit: 450
    compute-unit-price: 0
    # BR7.1: only the test profile seeds the release of the test founder; never in production.
    seed-test-release: false
    txsigner:
      url: ${MEMETRADE_TXSIGNER_URL:http://txsigner:8443}
      token: ${MEMETRADE_TXSIGNER_TOKEN:}
      timeout: 2s
    rpc:
      # Two providers per environment (NFR3.7); only the worker calls them. Empty = no RPC (the worker waits).
      primary-url: ${MEMETRADE_RPC_PRIMARY_URL:}
      secondary-url: ${MEMETRADE_RPC_SECONDARY_URL:}
      max-rps: 10
      timeout: 3s
    jobs:
      deposit-scan-interval: 15s
      withdrawal-interval: 1s
      withdrawal-batch-size: 20
      withdrawal-lease: 60s
      stuck-challenge-interval: 10s
    # 261113-trading-real-bot U3 (U3-NFR8.3): limits of the REAL risk barrier. Fixed here; outside the profiles test
    # and local a looser value (higher percentage, more buys, longer age or reservation) refuses the start of the api
    # and of the worker, and a value out of range refuses it in every profile. Stricter values are accepted.
    risk:
      order-max-bps: 1000
      daily-loss-max-bps: 2000
      daily-buys-max: 20
      signal-max-age: 60s
      reservation-ttl: 5m
    # 261113-trading-real-bot U4 (U4-NFR3.3, U4-NFR1.5, BR3.2, BR4.2, BR5.1, BR9.1): the REAL execution. Fixed here;
    # only the Jupiter base URL comes from the environment, and outside the profiles test and local it must be one of
    # the fixed hosts of the Jupiter (RealExecutionSettings). The worker calls the Jupiter; the api never does.
    execution:
      jupiter:
        base-url: ${MEMETRADE_JUPITER_BASE_URL:https://lite-api.jup.ag/swap/v1}
        timeout: 2s
        # U4-NFR1.5: the route is asked with at most 40 accounts so the message fits 1232 bytes with static keys only;
        # one retry with 24 before ROUTE_TOO_LARGE.
        max-accounts: 40
        retry-max-accounts: 24
      # BR3.2: a quote older than 10 s is never signed; BR4.2: 8 s for the main wallet to sign; a claimed session
      # still QUOTED 15 s later is repeated with the same signingRequestId.
      quote-max-age: 10s
      signing-window: 8s
      claim-stuck-after: 15s
      # BR5.1: SENT without a final answer for 60 s becomes AMBIGUOUS.
      confirmation-timeout: 60s
      # reliability-design.md: the lease of an order step; no step lasts 10 s.
      lease: 10s
      # BR4.3: highest priority fee of a swap (0.001 SOL), also checked by the TxSigner.
      max-priority-fee-lamports: 1000000
      decision-batch-size: 20
      order-batch-size: 20
      # BR9.1: the third failure in a row of one provider for one person pauses the REAL of that person (UPSTREAM); the
      # pause leaves when every provider is healthy for 5 minutes and the person has no AMBIGUOUS order.
      upstream-failures-to-pause: 3
      upstream-healthy-for: 5m
      jobs:
        queue-interval: 200ms
        driver-interval: 200ms
        confirmation-interval: 2s
        ambiguous-interval: 15s
        signing-deadline-interval: 1s
        health-interval: 30s
        liquidation-interval: 1s
  scheduling:
    enabled: true
  bots:
    # U5 (infrastructure-specification.md "Configuração"): fixed values, never read from the environment; risk and
    # cycle rules never change by variable. The scheduler of the cycle is on only in the worker profile.
    scheduler:
      enabled: false
    # BR3.1: start of each 5-minute UTC slot plus 60 s, after the U4 collection of the bucket that closed.
    slot-cron: '0 1/5 * * * *'
    cycle-threads: 4
    # BR3.3, NFR10.7: the cycle and the commands wait at most 2 s for a lock; a statement runs at most 5 s.
    lock-timeout: 2s
    statement-timeout: 5s
    # BR1.4 (A4): virtual balance floor and cap of the beta, USDC with 6 places.
    virtual-balance:
      min: '100.000000'
      cap: '10000.000000'
      default-value: '1000.000000'
    # BR9.1: HOLD and NO_TRADE decisions older than this are purged daily, in batches.
    decision-retention: 30d
    decision-purge-cron: '0 15 4 * * *'
    decision-purge-batch-size: 1000
    # BR7.1: bots per batch of the system pause.
    system-pause-batch-size: 100
    # BR8.2, NFR3.3: the live channel compares the marks every 2 s and sends a heartbeat every 15 s.
    stream:
      poll-interval: 2s
      heartbeat-interval: 15s
      timeout: 30m
      # U9 (NFR2.1): open live channels per person; the next one gets 429 RATE_LIMITED with Retry-After: 30.
      max-channels-per-person: 5
  auth:
    access-token-signing-key: ${ACCESS_TOKEN_SIGNING_KEY:}
    guest-app-origin: ${GUEST_APP_ORIGIN:http://localhost:3000}
    admin-wallet-addresses: ${ADMIN_WALLET_ADDRESSES:}
    chain: solana:mainnet
    challenge-ttl: 5m
    access-token-ttl: 15m
    refresh-ttl: 8h
    session-max-age: 12h
    # BR1.11 / NFR6.5: fixed at 10 in the default profile; raised only by the loadtest profile.
    login-rate-limit-per-minute: 10
    # U3 (BR2.2, NFR6.6): lookups of an invitation without a session, per IP and minute, with a counter separate from
    # the login one. Fixed at 10 here, like the login limit; raised only by the loadtest profile.
    invite-lookup-rate-limit-per-minute: 10
    trusted-proxies: ${TRUSTED_PROXIES:}
  terms:
    # U3 (BR3.1, NFR10.3): versioned terms and risk notice, read once at start-up; the api does not start without
    # exactly one current version with non-empty texts.
    location: classpath:terms/
    reacceptance:
      # u3-reacceptance (BR3.2, L3): a guest without an acceptance of the effective current version still reaches only
      # these prefixes; every other guest route answers 403 TERMS_REACCEPTANCE_REQUIRED. u4-data-requests (BR4.20) adds
      # /api/v1/privacy/: a person may exercise the rights of a data subject without accepting the new terms. This list
      # is configuration of the code, never an environment variable.
      allowed-prefixes:
        - /api/v1/legal/
        - /api/v1/terms/acceptances
        - /api/v1/account
        - /api/v1/auth/logout
        - /api/v1/auth/refresh
        - /api/v1/privacy/
  privacy:
    # u4-data-requests (infrastructure-specification.md "Configuração nova"): data subject requests of the Privacy
    # module. A request is due 15 days after its reception (BR4.1); a person creates at most requests-per-hour of them
    # (NFR2.4, raised only by the loadtest profile); a verification message is valid 24 hours (BR4.11). Every 15 minutes
    # the timers refuse the expired verifications and notify the overdue requests once (BR4.13, BR4.14; ShedLock
    # dataRequestTimers 5/1 min); at 04:00 UTC the purge deletes the requests closed 12 months ago in batches of 1000
    # (BR4.15; ShedLock dataSubjectRequestPurge 35/5 min). The gauges and the health read counts refreshed every 60 s.
    timers-cron: '0 */15 * * * *'
    purge-cron: '0 0 4 * * *'
    requests-per-hour: 10
    response-time: 15d
    verification-ttl: 24h
    retention-months: 12
    batch-size: 1000
    timers-batch-size: 500
    timers-lock-at-most-for: 5m
    timers-lock-at-least-for: 1m
    purge-lock-at-most-for: 35m
    purge-lock-at-least-for: 5m
    recover-after: 24h
    degraded-after: 48h
    counts-refresh-interval: 60s
    due-soon: 3d
    admin-page-size: 50
    admin-page-max: 100
  legal:
    # u1-legal-documents (infrastructure-specification.md): deployment fields of the privacy policy, empty = "a definir"
    # and the current version not publishable (BR1.6); the publishing requirement is on only in production (BR1.1).
    storage-location: ${MEMETRADE_LEGAL_STORAGE_LOCATION:}
    international-transfer: ${MEMETRADE_LEGAL_INTERNATIONAL_TRANSFER:}
    dpo-email: ${MEMETRADE_LEGAL_DPO_EMAIL:}
    require-publishable: ${MEMETRADE_LEGAL_REQUIRE_PUBLISHABLE:false}
    # NFR6.3: requests per client IP and minute on /api/v1/legal/**; raised only by the loadtest profile. The variable
    # MEMETRADE_LEGAL_RATE_LIMIT_PER_MINUTE binds directly (cloud); docker-compose.yml does not pass it, so the value of
    # application-loadtest.yml is never hidden by an environment variable.
    rate-limit-per-minute: 60
    rate-limit:
      # CIDR list compared ONLY with the direct peer of the connection (never X-Forwarded-For): locally the sub-range of
      # the web and admin containers; never the bridge gateway, a load balancer or a proxy.
      internal-networks: ${MEMETRADE_LEGAL_RATE_LIMIT_INTERNAL_NETWORKS:}
  identity:
    purge:
      # u2-retention (BR2.5 to BR2.8, BR2.16, reliability-design.md): daily purges of the api process, evaluated in UTC,
      # once across instances (ShedLock loginChallengePurge and sessionPurge), in batches of at most 1000 rows. A
      # challenge leaves 24 hours after it expired; a session and its used refresh digests leave 30 days after its end.
      # A purge without a success for more than recover-after runs when the api is ready; its health is DEGRADED after
      # degraded-after without a success (and more than that since the start).
      challenges-cron: '0 20 3 * * *'
      sessions-cron: '0 40 3 * * *'
      challenge-retention: 24h
      session-retention: 30d
      batch-size: 1000
      lock-at-most-for: 35m
      lock-at-least-for: 5m
      recover-after: 24h
      degraded-after: 48h
  idempotency:
    default-retention: 24h
    cleanup-interval: 1h
    cleanup-batch-size: 1000
  market:
    # U4 (infrastructure-specification.md): only simulated adapters exist in the beta (C-06). Each value is checked at
    # start-up; a value out of range stops the api with a message naming the variable.
    sources: ${MARKET_SOURCES:sim-a,sim-b}
    collect-interval: ${MARKET_COLLECTION_INTERVAL:30s}
    divergence-tolerance-percent: ${MARKET_DIVERGENCE_TOLERANCE_PERCENT:5.0000}
    simulated:
      # Fixed seed: the smoke and the CI are deterministic (NFR12.3); never random by default.
      seed: ${MARKET_SIMULATED_SEED:42}
      token-count: ${MARKET_SIMULATED_TOKENS_PER_SOURCE:200}
    # 261113-trading-real-bot U2: the real source coingecko (MARKET_SOURCES=coingecko), collected only by the worker.
    # The other limits keep the values of the design in CoinGeckoProperties. The API key is never a property: only the
    # worker reads COINGECKO_API_KEY from its environment.
    coingecko:
      base-url: ${COINGECKO_BASE_URL:https://pro-api.coingecko.com/api/v3}
      attribution-text: "Dados: CoinGecko"
      attribution-url: https://www.coingecko.com/
  ledger:
    # U7 (infrastructure-specification.md): fixed values, never read from the environment, so daily use cannot change
    # integrity rules by variable. Fallback round of the marking and the pending close (BR5.3), reconciliation (BR8.1),
    # "check now" limit per person and minute (NFR6.5) and the lock and statement timeouts (NFR10.8).
    marking-fallback-interval: 60s
    reconciliation-interval: 5m
    reconciliation-run-limit-per-minute: 6
    lock-timeout: 2s
    statement-timeout: 5s
    job-lock-timeout: 1s
  riskcontrol:
    # U6 (infrastructure-specification.md): fixed values, never read from the environment; risk rules never change by
    # variable. freshness-max-age is the platform freshness limit of the barrier (BR2.6). The purge of the approved
    # evaluations runs daily at 03:30 UTC, after the trail purge of 03:00, through its own retention pool; it selects
    # rows older than selection-age (31 days), one day more than the trigger-age the database trigger enforces
    # (30 days), in batches of batch-size per transaction, for at most max-run (ShedLock held at most lock-at-most-for).
    freshness-max-age: 60s
    purge:
      cron: '0 30 3 * * *'
      batch-size: 1000
      max-run: 30m
      lock-at-most-for: 45m
      selection-age: 31d
      trigger-age: 30d
  scanner:
    # Per person and route, sliding window of 60 s (NFR6.3).
    rate-limit-per-minute: ${SCANNER_RATE_LIMIT_PER_MINUTE:60}
  admin:
    # U8 (infrastructure-specification.md): origin of the administrator app, the only origin of the administrative CORS
    # policy (RuntimeSettingsGuard refuses a wildcard). Everything else is fixed here, never read from the environment.
    app-origin: ${ADMIN_APP_ORIGIN:http://localhost:3001}
    kill-switch:
      # NFR10.1 / reliability-design.md: the reconciliation runs every 30 s and once when the api is ready; the apply
      # lock waits at most 10 s in total (JVM lock, connection of the lock pool and pg_try_advisory_lock every 200 ms);
      # 3 attempts per call of U5 (BR2.3) and 3 re-reads while the version keeps changing.
      reconcile-interval: 30s
      apply-lock-wait: 10s
      apply-lock-poll: 200ms
      apply-attempts: 3
      reconcile-stale-after: 60s
      pending-stale-after: 2m
      lock-at-most-for: 5m
    login:
      # Q4 of the NFR Design: 5 challenge and verify requests per minute per IP, and 5 per (address, IP) pair.
      per-ip-per-minute: 5
      per-address-per-minute: 5
      # Q1 of the functional design: access token of 15 minutes, session of 8 hours without extension.
      access-token-ttl: 15m
      session-max-age: 8h
    feedback:
      # BR6.3, BR6.7, NFR2.5, NFR2.6: 10 per person and hour, kept 180 days, purged daily at 03:00 UTC in batches of
      # 1000; the health indicator is DOWN when the last success is older than 48 hours.
      max-per-hour: 10
      retention: 180d
      purge-cron: '0 0 3 * * *'
      purge-batch-size: 1000
      purge-lock-at-most-for: 30m
      purge-stale-after: 48h
      page-max: 100
  audit:
    # u2-retention (BR2.1, BR2.4, NFR6.1): key of the HMAC-SHA-256 of the wallet addresses in the trail, at least 32
    # bytes in UTF-8, only from the environment (.env locally, the secrets manager in the cloud). Without it the api
    # and the worker do not start; the value is never logged or shown by the actuator.
    wallet-hmac-key: ${MEMETRADE_AUDIT_WALLET_HMAC_KEY:}
    relay-interval: 1s
    relay-batch-size: 100
    max-delivery-lag: 60s
    jobs:
      # BR3.1: never below 12; the API refuses to start with a smaller value.
      retention-months: ${AUDIT_RETENTION_MONTHS:12}
      outbox-delivered-retention: 7d
      # Six-field Spring cron, evaluated in UTC (zone fixed in the schedules).
      retention-cron: '0 0 3 * * *'
      outbox-cleanup-cron: '0 30 3 * * *'
      time-limit: 30m
      batch-size: 1000
      lock-at-most-for: 35m
      lock-at-least-for: 5m
      recover-after: 24h
      degraded-after: 26h
    retention-db:
      # Member of the group role audit_retention (read and delete audit_event only); pool of 1 connection.
      username: ${DB_RETENTION_USER:memetrade_retention}
      password: ${DB_RETENTION_PASSWORD:}

logging:
  level:
    root: INFO
