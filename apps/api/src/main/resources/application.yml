spring:
  application:
    name: memetrade-api
  main:
    banner-mode: off
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:memetrade}
    username: ${DB_USER:memetrade_app}
    password: ${DB_PASSWORD:}
    hikari:
      # U4 infrastructure-specification.md (Q1): 20 connections (10 in U1), 2 s wait for a connection; the wait counts
      # in the NFR3.1 budget. RuntimeSettingsGuard refuses a value outside 10..50 naming DB_POOL_MAX_SIZE.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: 5
      connection-timeout: 2000
      pool-name: memetrade-pool
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # NFR6.3: the API never migrates. The db-migrate service (profile "migrate", MigrationRunner) applies the
    # changelog with the owner login before the API starts; the owner credential never reaches this profile.
    enabled: false
  task:
    scheduling:
      # One thread per @Scheduled method (counted by U6): U1 to U3 relay, idempotency cleanup, the two daily audit jobs
      # and the login limiter eviction (5); U4 collection dispatcher, history cleanup and scanner limiter eviction (3);
      # U7 marking, pending close, reconciliation and the "check now" limiter eviction (4); U6 purge of the old approved
      # evaluations (1); U5 the live channel mark poller of the api (1); U8 the kill switch reconciliation and the
      # feedback purge (2). RuntimeSettingsGuard refuses less than 16 in the api (SCHEDULER_POOL_SIZE); the worker
      # (application-worker.yml) has its own 4.
      pool:
        size: ${SCHEDULER_POOL_SIZE:16}
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
    deserialization:
      # NFR6.1 / BR1.8: undeclared fields are rejected with VALIDATION_FAILED.
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false
  threads:
    virtual:
      enabled: false

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    whitelabel:
      enabled: false

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,db,migrations
      status:
        order: DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN
        http-mapping:
          DEGRADED: 200
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  override-with-generic-response: false
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  writer-with-order-by-keys: true
  api-docs:
    version: openapi_3_1
  group-configs:
    - group: guest
      paths-to-match: /api/v1/**
      paths-to-exclude: /api/v1/admin/**
    # Administrative operations provided by the modules (C8); versioned in apps/api/openapi/openapi-admin.yaml.
    # u1-legal-documents: the public legal documents (L1) are read by the administrator app too.
    - group: admin
      paths-to-match:
        - /api/v1/admin/**
        - /api/v1/legal/**

memetrade:
  # U5 (C20, NFR10.9): api (default) or worker; @ProcessRole beans exist only in their process.
  process: ${MEMETRADE_PROCESS:api}
  scheduling:
    enabled: true
  bots:
    # U5 (infrastructure-specification.md "Configuração"): fixed values, never read from the environment; risk and
    # cycle rules never change by variable. The scheduler of the cycle is on only in the worker profile.
    scheduler:
      enabled: false
    # BR3.1: start of each 5-minute UTC slot plus 60 s, after the U4 collection of the bucket that closed.
    slot-cron: '0 1/5 * * * *'
    cycle-threads: 4
    # BR3.3, NFR10.7: the cycle and the commands wait at most 2 s for a lock; a statement runs at most 5 s.
    lock-timeout: 2s
    statement-timeout: 5s
    # BR1.4 (A4): virtual balance floor and cap of the beta, USDC with 6 places.
    virtual-balance:
      min: '100.000000'
      cap: '10000.000000'
      default-value: '1000.000000'
    # BR9.1: HOLD and NO_TRADE decisions older than this are purged daily, in batches.
    decision-retention: 30d
    decision-purge-cron: '0 15 4 * * *'
    decision-purge-batch-size: 1000
    # BR7.1: bots per batch of the system pause.
    system-pause-batch-size: 100
    # BR8.2, NFR3.3: the live channel compares the marks every 2 s and sends a heartbeat every 15 s.
    stream:
      poll-interval: 2s
      heartbeat-interval: 15s
      timeout: 30m
      # U9 (NFR2.1): open live channels per person; the next one gets 429 RATE_LIMITED with Retry-After: 30.
      max-channels-per-person: 5
  auth:
    access-token-signing-key: ${ACCESS_TOKEN_SIGNING_KEY:}
    guest-app-origin: ${GUEST_APP_ORIGIN:http://localhost:3000}
    admin-wallet-addresses: ${ADMIN_WALLET_ADDRESSES:}
    chain: solana:mainnet
    challenge-ttl: 5m
    access-token-ttl: 15m
    refresh-ttl: 8h
    session-max-age: 12h
    # BR1.11 / NFR6.5: fixed at 10 in the default profile; raised only by the loadtest profile.
    login-rate-limit-per-minute: 10
    # U3 (BR2.2, NFR6.6): lookups of an invitation without a session, per IP and minute, with a counter separate from
    # the login one. Fixed at 10 here, like the login limit; raised only by the loadtest profile.
    invite-lookup-rate-limit-per-minute: 10
    trusted-proxies: ${TRUSTED_PROXIES:}
  terms:
    # U3 (BR3.1, NFR10.3): versioned terms and risk notice, read once at start-up; the api does not start without
    # exactly one current version with non-empty texts.
    location: classpath:terms/
  legal:
    # u1-legal-documents (infrastructure-specification.md): deployment fields of the privacy policy, empty = "a definir"
    # and the current version not publishable (BR1.6); the publishing requirement is on only in production (BR1.1).
    storage-location: ${MEMETRADE_LEGAL_STORAGE_LOCATION:}
    international-transfer: ${MEMETRADE_LEGAL_INTERNATIONAL_TRANSFER:}
    dpo-email: ${MEMETRADE_LEGAL_DPO_EMAIL:}
    require-publishable: ${MEMETRADE_LEGAL_REQUIRE_PUBLISHABLE:false}
    # NFR6.3: requests per client IP and minute on /api/v1/legal/**; raised only by the loadtest profile. The variable
    # MEMETRADE_LEGAL_RATE_LIMIT_PER_MINUTE binds directly (cloud); docker-compose.yml does not pass it, so the value of
    # application-loadtest.yml is never hidden by an environment variable.
    rate-limit-per-minute: 60
    rate-limit:
      # CIDR list compared ONLY with the direct peer of the connection (never X-Forwarded-For): locally the sub-range of
      # the web and admin containers; never the bridge gateway, a load balancer or a proxy.
      internal-networks: ${MEMETRADE_LEGAL_RATE_LIMIT_INTERNAL_NETWORKS:}
  idempotency:
    default-retention: 24h
    cleanup-interval: 1h
    cleanup-batch-size: 1000
  market:
    # U4 (infrastructure-specification.md): only simulated adapters exist in the beta (C-06). Each value is checked at
    # start-up; a value out of range stops the api with a message naming the variable.
    sources: ${MARKET_SOURCES:sim-a,sim-b}
    collect-interval: ${MARKET_COLLECTION_INTERVAL:30s}
    divergence-tolerance-percent: ${MARKET_DIVERGENCE_TOLERANCE_PERCENT:5.0000}
    simulated:
      # Fixed seed: the smoke and the CI are deterministic (NFR12.3); never random by default.
      seed: ${MARKET_SIMULATED_SEED:42}
      token-count: ${MARKET_SIMULATED_TOKENS_PER_SOURCE:200}
  ledger:
    # U7 (infrastructure-specification.md): fixed values, never read from the environment, so daily use cannot change
    # integrity rules by variable. Fallback round of the marking and the pending close (BR5.3), reconciliation (BR8.1),
    # "check now" limit per person and minute (NFR6.5) and the lock and statement timeouts (NFR10.8).
    marking-fallback-interval: 60s
    reconciliation-interval: 5m
    reconciliation-run-limit-per-minute: 6
    lock-timeout: 2s
    statement-timeout: 5s
    job-lock-timeout: 1s
  riskcontrol:
    # U6 (infrastructure-specification.md): fixed values, never read from the environment; risk rules never change by
    # variable. freshness-max-age is the platform freshness limit of the barrier (BR2.6). The purge of the approved
    # evaluations runs daily at 03:30 UTC, after the trail purge of 03:00, through its own retention pool; it selects
    # rows older than selection-age (31 days), one day more than the trigger-age the database trigger enforces
    # (30 days), in batches of batch-size per transaction, for at most max-run (ShedLock held at most lock-at-most-for).
    freshness-max-age: 60s
    purge:
      cron: '0 30 3 * * *'
      batch-size: 1000
      max-run: 30m
      lock-at-most-for: 45m
      selection-age: 31d
      trigger-age: 30d
  scanner:
    # Per person and route, sliding window of 60 s (NFR6.3).
    rate-limit-per-minute: ${SCANNER_RATE_LIMIT_PER_MINUTE:60}
  admin:
    # U8 (infrastructure-specification.md): origin of the administrator app, the only origin of the administrative CORS
    # policy (RuntimeSettingsGuard refuses a wildcard). Everything else is fixed here, never read from the environment.
    app-origin: ${ADMIN_APP_ORIGIN:http://localhost:3001}
    kill-switch:
      # NFR10.1 / reliability-design.md: the reconciliation runs every 30 s and once when the api is ready; the apply
      # lock waits at most 10 s in total (JVM lock, connection of the lock pool and pg_try_advisory_lock every 200 ms);
      # 3 attempts per call of U5 (BR2.3) and 3 re-reads while the version keeps changing.
      reconcile-interval: 30s
      apply-lock-wait: 10s
      apply-lock-poll: 200ms
      apply-attempts: 3
      reconcile-stale-after: 60s
      pending-stale-after: 2m
      lock-at-most-for: 5m
    login:
      # Q4 of the NFR Design: 5 challenge and verify requests per minute per IP, and 5 per (address, IP) pair.
      per-ip-per-minute: 5
      per-address-per-minute: 5
      # Q1 of the functional design: access token of 15 minutes, session of 8 hours without extension.
      access-token-ttl: 15m
      session-max-age: 8h
    feedback:
      # BR6.3, BR6.7, NFR2.5, NFR2.6: 10 per person and hour, kept 180 days, purged daily at 03:00 UTC in batches of
      # 1000; the health indicator is DOWN when the last success is older than 48 hours.
      max-per-hour: 10
      retention: 180d
      purge-cron: '0 0 3 * * *'
      purge-batch-size: 1000
      purge-lock-at-most-for: 30m
      purge-stale-after: 48h
      page-max: 100
  audit:
    relay-interval: 1s
    relay-batch-size: 100
    max-delivery-lag: 60s
    jobs:
      # BR3.1: never below 12; the API refuses to start with a smaller value.
      retention-months: ${AUDIT_RETENTION_MONTHS:12}
      outbox-delivered-retention: 7d
      # Six-field Spring cron, evaluated in UTC (zone fixed in the schedules).
      retention-cron: '0 0 3 * * *'
      outbox-cleanup-cron: '0 30 3 * * *'
      time-limit: 30m
      batch-size: 1000
      lock-at-most-for: 35m
      lock-at-least-for: 5m
      recover-after: 24h
      degraded-after: 26h
    retention-db:
      # Member of the group role audit_retention (read and delete audit_event only); pool of 1 connection.
      username: ${DB_RETENTION_USER:memetrade_retention}
      password: ${DB_RETENTION_PASSWORD:}

logging:
  level:
    root: INFO
