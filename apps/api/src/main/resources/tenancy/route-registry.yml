# Registry of routes and background jobs by data scope (BR2.3, NFR5.2).
#   CLIENT  - reads or writes customer data of a tenant: REQUIRES a cross-tenant negative test
#             (negativeTest: <fully.qualified.TestClass>#<method>), otherwise the build fails.
#   SESSION - acts only on the caller's own session (identity from the access token).
#   GLOBAL  - no customer data (for example market data shared by everybody).
#   ADMIN   - administrative route (/api/v1/admin/**, C8): only Role.ADMIN, reads across tenants by design (BR2.4);
#             REQUIRES a negative test proving a guest token gets 403 (negativeTest), otherwise the build fails.
# Every route of the guest and admin OpenAPI and every scheduled job must be listed here.
routes:
  - { method: GET, path: /api/v1/admin/audit-events, scope: ADMIN, negativeTest: com.memetrade.audit.AdminAuditRouteIT#aGuestTokenIsRefusedWith403AndOneRequestForbiddenEvent }
  # U3 (C8): invitation routes of the administrator. The issuance is the ONLY route that receives a tenant from the
  # client (ADR-002, NFR5.2): tenantFromClient marks that named exception, accepted only in ADMIN entries.
  - { method: GET, path: /api/v1/admin/invites, scope: ADMIN, negativeTest: com.memetrade.identity.AdminInviteRouteIT#aGuestTokenIsRefusedWith403AndOneRequestForbiddenEvent }
  - { method: POST, path: /api/v1/admin/invites, scope: ADMIN, tenantFromClient: true, negativeTest: com.memetrade.identity.AdminInviteRouteIT#aGuestTokenIsRefusedWith403AndOneRequestForbiddenEvent }
  - { method: POST, path: '/api/v1/admin/invites/{inviteId}/revoke', scope: ADMIN, negativeTest: com.memetrade.identity.AdminInviteRouteIT#aGuestTokenIsRefusedWith403AndOneRequestForbiddenEvent }
  # U8 (C8): the administrator entry. challenge, verify and refresh read no access token (public by the normalised path);
  # their negative tests prove that a wallet outside the list, a guest wallet and a guest cookie never get an
  # administrator session. Every other administrative route of U8 refuses a guest token (one REQUEST_FORBIDDEN).
  - { method: POST, path: /api/v1/admin/auth/challenge, scope: ADMIN, negativeTest: com.memetrade.identity.AdminAuthIT#aWalletOutsideTheListIsRefusedGenerically }
  - { method: POST, path: /api/v1/admin/auth/verify, scope: ADMIN, negativeTest: com.memetrade.identity.AdminAuthIT#aGuestWalletIsRefusedWithTheSameAnswerAndStaysAGuest }
  - { method: POST, path: /api/v1/admin/auth/refresh, scope: ADMIN, negativeTest: com.memetrade.identity.AdminAuthIT#aGuestCookieNeverRenewsAnAdministratorSession }
  - { method: POST, path: /api/v1/admin/auth/logout, scope: ADMIN, negativeTest: com.memetrade.identity.AdminGuestRoutesIT#aGuestTokenOnEveryAdministrativeRouteIsForbiddenAndAuditedOnce }
  - { method: GET, path: /api/v1/admin/kill-switch, scope: ADMIN, negativeTest: com.memetrade.identity.AdminGuestRoutesIT#aGuestTokenOnEveryAdministrativeRouteIsForbiddenAndAuditedOnce }
  - { method: PUT, path: /api/v1/admin/kill-switch, scope: ADMIN, negativeTest: com.memetrade.identity.AdminGuestRoutesIT#aGuestTokenOnEveryAdministrativeRouteIsForbiddenAndAuditedOnce }
  - { method: GET, path: /api/v1/admin/system-status, scope: ADMIN, negativeTest: com.memetrade.identity.AdminGuestRoutesIT#aGuestTokenOnEveryAdministrativeRouteIsForbiddenAndAuditedOnce }
  - { method: GET, path: /api/v1/admin/tenants, scope: ADMIN, negativeTest: com.memetrade.identity.AdminGuestRoutesIT#aGuestTokenOnEveryAdministrativeRouteIsForbiddenAndAuditedOnce }
  - { method: GET, path: /api/v1/admin/feedback, scope: ADMIN, negativeTest: com.memetrade.feedback.AdminFeedbackListIT#aGuestCannotReadTheFeedback }
  # u4-data-requests (P2, BR4.7): the data subject requests of the administrator, across tenants by design; a guest
  # token is 403 FORBIDDEN_ROLE with one REQUEST_FORBIDDEN on every one of them, the anonymization of u5-anonymization included.
  - { method: GET, path: /api/v1/admin/privacy/requests, scope: ADMIN, negativeTest: com.memetrade.identity.AdminGuestRoutesIT#aGuestTokenOnEveryAdministrativeRouteIsForbiddenAndAuditedOnce }
  - { method: POST, path: /api/v1/admin/privacy/requests, scope: ADMIN, negativeTest: com.memetrade.identity.AdminGuestRoutesIT#aGuestTokenOnEveryAdministrativeRouteIsForbiddenAndAuditedOnce }
  - { method: GET, path: '/api/v1/admin/privacy/requests/{requestId}', scope: ADMIN, negativeTest: com.memetrade.identity.AdminGuestRoutesIT#aGuestTokenOnEveryAdministrativeRouteIsForbiddenAndAuditedOnce }
  - { method: POST, path: '/api/v1/admin/privacy/requests/{requestId}/transitions', scope: ADMIN, negativeTest: com.memetrade.identity.AdminGuestRoutesIT#aGuestTokenOnEveryAdministrativeRouteIsForbiddenAndAuditedOnce }
  - { method: POST, path: '/api/v1/admin/privacy/requests/{requestId}/verification', scope: ADMIN, negativeTest: com.memetrade.identity.AdminGuestRoutesIT#aGuestTokenOnEveryAdministrativeRouteIsForbiddenAndAuditedOnce }
  - { method: POST, path: '/api/v1/admin/privacy/requests/{requestId}/verification/confirm', scope: ADMIN, negativeTest: com.memetrade.identity.AdminGuestRoutesIT#aGuestTokenOnEveryAdministrativeRouteIsForbiddenAndAuditedOnce }
  - { method: POST, path: '/api/v1/admin/privacy/requests/{requestId}/reply-sent', scope: ADMIN, negativeTest: com.memetrade.identity.AdminGuestRoutesIT#aGuestTokenOnEveryAdministrativeRouteIsForbiddenAndAuditedOnce }
  - { method: POST, path: '/api/v1/admin/privacy/requests/{requestId}/anonymization', scope: ADMIN, negativeTest: com.memetrade.identity.AdminGuestRoutesIT#aGuestTokenOnEveryAdministrativeRouteIsForbiddenAndAuditedOnce }
  # u4-data-requests (P1, BR4.4, NFR2.1): the data subject requests of the caller; tenant and person from the token
  # only, every query filters by both, and a request of another person or tenant is the same 404 as an unknown one.
  - { method: GET, path: /api/v1/privacy/requests, scope: CLIENT, negativeTest: com.memetrade.privacy.DataRequestIT#anotherPersonsRequestIsNotFoundOnEveryRoute }
  - { method: POST, path: /api/v1/privacy/requests, scope: CLIENT, negativeTest: com.memetrade.privacy.DataRequestIT#anotherPersonsRequestIsNotFoundOnEveryRoute }
  - { method: GET, path: '/api/v1/privacy/requests/{requestId}', scope: CLIENT, negativeTest: com.memetrade.privacy.DataRequestIT#anotherPersonsRequestIsNotFoundOnEveryRoute }
  # U8 (C6, BR6.2): a comment of the caller; tenant and person from the token only, a tenant in the body is refused.
  - { method: POST, path: /api/v1/feedback, scope: CLIENT, negativeTest: com.memetrade.feedback.FeedbackDedupIT#theTenantComesFromTheTokenNeverFromTheBody }
  - { method: POST, path: /api/v1/auth/challenge, scope: GLOBAL }
  - { method: POST, path: /api/v1/auth/verify, scope: GLOBAL }
  - { method: POST, path: /api/v1/auth/refresh, scope: SESSION }
  - { method: POST, path: /api/v1/auth/logout, scope: SESSION }
  - { method: GET, path: /api/v1/scanner/tokens, scope: GLOBAL }
  # U4: assessment of a token, global market data (no tenant in the tables of U4).
  - { method: GET, path: '/api/v1/tokens/{chain}/{mint}/assessment', scope: GLOBAL }
  # U3: invitation lookup without a session; returns no customer data (no tenant, no inviteId, no person), only the
  # derived state, the validity and the public terms (BR2.1).
  - { method: GET, path: '/api/v1/invites/{code}', scope: GLOBAL }
  # u1-legal-documents (L1): the public legal documents, read only and without a session; no customer data (BR1.7).
  - { method: GET, path: /api/v1/legal/current, scope: GLOBAL }
  - { method: GET, path: /api/v1/legal/versions, scope: GLOBAL }
  - { method: GET, path: '/api/v1/legal/versions/{version}', scope: GLOBAL }
  # U3: personal data of the caller's own account (wallet, acceptance); person and tenant from the token only.
  - { method: GET, path: /api/v1/account, scope: CLIENT, negativeTest: com.memetrade.identity.AccountRouteIT#anotherTenantsSessionNeverSeesThisAccount }
  # u3-reacceptance (L2, BR3.4): acceptance of the current terms by the caller; person and tenant from the token only,
  # a tenant or person in the body is an unknown field. The table stays without UPDATE or DELETE for the application.
  - { method: POST, path: /api/v1/terms/acceptances, scope: CLIENT, negativeTest: com.memetrade.identity.TermsAcceptanceIT#theAcceptanceOfOneTenantNeverReachesAnotherTenant }
  # U7 (C5, BR9.1): PAPER ledger and P&L of the caller; tenant and person from the token, every query filters by
  # tenant, person and PAPER. A bot of another person is 404 (negative test), a bot not yet activated is empty.
  - { method: GET, path: '/api/v1/bots/{botId}/trades', scope: CLIENT, negativeTest: com.memetrade.ledger.LedgerRoutesIT#anotherPersonsBotIsNotFound }
  - { method: GET, path: '/api/v1/bots/{botId}/day-usage', scope: CLIENT, negativeTest: com.memetrade.ledger.LedgerRoutesIT#anotherPersonsBotIsNotFound }
  - { method: GET, path: /api/v1/ledger, scope: CLIENT, negativeTest: com.memetrade.ledger.LedgerRoutesIT#anotherPersonsBotIsNotFound }
  - { method: GET, path: /api/v1/pnl, scope: CLIENT, negativeTest: com.memetrade.ledger.LedgerRoutesIT#anotherPersonsBotIsNotFound }
  - { method: GET, path: /api/v1/reconciliation, scope: CLIENT, negativeTest: com.memetrade.ledger.LedgerRoutesIT#anotherPersonsBotIsNotFound }
  - { method: POST, path: /api/v1/reconciliation/run, scope: CLIENT, negativeTest: com.memetrade.ledger.LedgerRoutesIT#twoTenantsNeverSeeEachOthersLedger }
  # U6 (C21, BR4.1): refused orders of a bot of the caller; tenant, person and PAPER from the token in every query.
  # Every bot without an evaluation of the caller (another person's, another tenant's, unknown, never evaluated or
  # purged) is the same 404 (negative test).
  - { method: GET, path: '/api/v1/bots/{botId}/rejections', scope: CLIENT, negativeTest: com.memetrade.riskcontrol.RejectionRoutesIT#anotherPersonsEvaluatedBotIsNotFound }
  # U5 (C4, BR2.10, NFR5.1): the bots of the caller; tenant and person from the token in every query and command. A
  # bot of another person, of the same or another tenant, is 404 on every route (negative test). The templates are
  # the same for everybody (no customer data).
  - { method: GET, path: /api/v1/strategy-templates, scope: GLOBAL }
  - { method: GET, path: /api/v1/bots, scope: CLIENT, negativeTest: com.memetrade.bots.web.BotRoutesIT#anotherPersonsBotIsNotFoundOnEveryRoute }
  - { method: POST, path: /api/v1/bots, scope: CLIENT, negativeTest: com.memetrade.bots.web.BotRoutesIT#anotherPersonsBotIsNotFoundOnEveryRoute }
  - { method: GET, path: '/api/v1/bots/{botId}', scope: CLIENT, negativeTest: com.memetrade.bots.web.BotRoutesIT#anotherPersonsBotIsNotFoundOnEveryRoute }
  - { method: PUT, path: '/api/v1/bots/{botId}/draft', scope: CLIENT, negativeTest: com.memetrade.bots.web.BotRoutesIT#anotherPersonsBotIsNotFoundOnEveryRoute }
  - { method: POST, path: '/api/v1/bots/{botId}/commands/{command}', scope: CLIENT, negativeTest: com.memetrade.bots.web.BotRoutesIT#anotherPersonsBotIsNotFoundOnEveryRoute }
  - { method: POST, path: '/api/v1/bots/{botId}/limits', scope: CLIENT, negativeTest: com.memetrade.bots.web.BotRoutesIT#anotherPersonsBotIsNotFoundOnEveryRoute }
  - { method: GET, path: '/api/v1/bots/{botId}/decisions', scope: CLIENT, negativeTest: com.memetrade.bots.web.BotRoutesIT#anotherPersonsBotIsNotFoundOnEveryRoute }
  # U5 (C7, BR8.2): the live channel of the caller; every event is read with the scope of the channel's own person.
  - { method: GET, path: /api/v1/stream/dashboard, scope: CLIENT, negativeTest: com.memetrade.bots.web.DashboardStreamIT#aChannelNeverReceivesAnEventOfAnotherPerson }
  # 261113-trading-real-bot U1 (R2, BR6.4): the bot wallet of the guest; tenant and person only from the access token,
  # a withdrawal of another account answers 404 (BotWalletRoutesIT).
  - { method: POST, path: /api/v1/real/consents/challenge, scope: CLIENT, negativeTest: com.memetrade.botwallet.BotWalletRoutesIT#aWithdrawalOfAnotherAccountIsNotFound }
  - { method: GET, path: /api/v1/real/bot-wallet, scope: CLIENT, negativeTest: com.memetrade.botwallet.BotWalletRoutesIT#aWithdrawalOfAnotherAccountIsNotFound }
  - { method: POST, path: /api/v1/real/bot-wallet, scope: CLIENT, negativeTest: com.memetrade.botwallet.BotWalletRoutesIT#aWithdrawalOfAnotherAccountIsNotFound }
  - { method: PATCH, path: /api/v1/real/bot-wallet/preferences, scope: CLIENT, negativeTest: com.memetrade.botwallet.BotWalletRoutesIT#aWithdrawalOfAnotherAccountIsNotFound }
  - { method: POST, path: /api/v1/real/bot-wallet/resume, scope: CLIENT, negativeTest: com.memetrade.botwallet.BotWalletRoutesIT#aWithdrawalOfAnotherAccountIsNotFound }
  - { method: GET, path: /api/v1/real/bot-wallet/deposits, scope: CLIENT, negativeTest: com.memetrade.botwallet.BotWalletRoutesIT#aWithdrawalOfAnotherAccountIsNotFound }
  - { method: GET, path: /api/v1/real/bot-wallet/withdrawals, scope: CLIENT, negativeTest: com.memetrade.botwallet.BotWalletRoutesIT#aWithdrawalOfAnotherAccountIsNotFound }
  - { method: POST, path: /api/v1/real/bot-wallet/withdrawals, scope: CLIENT, negativeTest: com.memetrade.botwallet.BotWalletRoutesIT#aWithdrawalOfAnotherAccountIsNotFound }
  - { method: GET, path: '/api/v1/real/bot-wallet/withdrawals/{withdrawalId}', scope: CLIENT, negativeTest: com.memetrade.botwallet.BotWalletRoutesIT#aWithdrawalOfAnotherAccountIsNotFound }
  # 261113-trading-real-bot U4 (R3, BR10.2): the REAL orders, the signing session, the mode, the liquidation and the
  # P&L REAL of the guest; tenant and person only from the access token, an order of another person is 404, and every
  # one needs the acceptance of the terms v3 (no exception).
  - { method: GET, path: /api/v1/real/orders, scope: CLIENT, negativeTest: com.memetrade.realexecution.web.RealRoutesIT#anOrderOfAnotherPersonIsNotFoundOnEveryRoute }
  - { method: GET, path: '/api/v1/real/orders/{realOrderId}', scope: CLIENT, negativeTest: com.memetrade.realexecution.web.RealRoutesIT#anOrderOfAnotherPersonIsNotFoundOnEveryRoute }
  - { method: GET, path: '/api/v1/real/orders/{realOrderId}/signing-session', scope: CLIENT, negativeTest: com.memetrade.realexecution.web.RealRoutesIT#anOrderOfAnotherPersonIsNotFoundOnEveryRoute }
  - { method: POST, path: '/api/v1/real/orders/{realOrderId}/signing-session', scope: CLIENT, negativeTest: com.memetrade.realexecution.web.RealRoutesIT#anOrderOfAnotherPersonIsNotFoundOnEveryRoute }
  - { method: POST, path: '/api/v1/real/orders/{realOrderId}/reject', scope: CLIENT, negativeTest: com.memetrade.realexecution.web.RealRoutesIT#anOrderOfAnotherPersonIsNotFoundOnEveryRoute }
  - { method: PUT, path: /api/v1/real/mode, scope: CLIENT, negativeTest: com.memetrade.realexecution.web.RealRoutesIT#anOrderOfAnotherPersonIsNotFoundOnEveryRoute }
  - { method: POST, path: /api/v1/real/liquidations, scope: CLIENT, negativeTest: com.memetrade.realexecution.web.RealRoutesIT#anOrderOfAnotherPersonIsNotFoundOnEveryRoute }
  - { method: GET, path: /api/v1/real/pnl, scope: CLIENT, negativeTest: com.memetrade.realexecution.web.RealRoutesIT#theListAndThePnlShowOnlyThePersonOfTheToken }
jobs:
  - { name: AuditRelayJob, scope: GLOBAL }
  # U2 retention purge and outbox cleanup: system jobs over the whole trail, no tenant input (BR3.1 to BR3.4).
  - { name: AuditJobSchedule, scope: GLOBAL }
  - { name: MarketCollectorJob, scope: GLOBAL }
  # U4: market history cleanup over global market data, no tenant input (F6, BR1.8).
  - { name: MarketHistoryCleanup, scope: GLOBAL }
  # U4: drops idle keys of the per-person scanner limiter; no customer data.
  - { name: ScannerRateLimitEvictionJob, scope: GLOBAL }
  - { name: IdempotencyCleanupJob, scope: GLOBAL }
  - { name: LoginLimiterEvictionJob, scope: GLOBAL }
  # U7: system jobs over every PAPER account; each one reads tenant and person FROM THE ROW it handles and passes them
  # to every query of the round, never mixing people in a query without that filter (BR9.1).
  - { name: PendingCloseJob, scope: GLOBAL }
  - { name: EquityMarkingJob, scope: GLOBAL }
  - { name: ReconciliationJob, scope: GLOBAL }
  # U7: drops idle keys of the "check now" limiter; no customer data.
  - { name: ReconciliationRunLimiterEvictionJob, scope: GLOBAL }
  # U6: daily purge of approved evaluations older than 30 days without a rejection citing them, through the retention
  # pool; the only U6 task across tenants: it reads no tenant input, returns nothing per person and logs only totals.
  - { name: RiskEvaluationPurgeJob, scope: GLOBAL }
  # U5 (C20, BR2.10): the worker schedules (slot dispatch with the closing check, UTC midnight, decision purge). Each
  # cycle and change reads tenant and person FROM THE BOT ROW, binds that owner as the principal before U6 and U7 and
  # never mixes people in a query (two-tenant test below).
  - { name: BotSchedules, scope: CLIENT, negativeTest: com.memetrade.bots.worker.CycleIT#twoTenantsInTheSameSlotNeverMix }
  # U5 (C7, performance-design.md): the single mark reader of the api; one query of marks for the explicit pairs of the
  # open channels, then the details of each channel's own person only.
  - { name: DashboardMarkPoller, scope: CLIENT, negativeTest: com.memetrade.bots.web.DashboardStreamIT#aChannelNeverReceivesAnEventOfAnotherPerson }
  # U8 (BR2.5): the kill switch reconciliation applies the global state of the kill switch through C16; it reads no
  # tenant input and returns nothing per person (only counts in the logs).
  - { name: KillSwitchReconciler, scope: GLOBAL }
  # U8 (BR6.7): daily purge of the comments older than 180 days, through the retention pool; logs only totals.
  - { name: FeedbackPurgeJob, scope: GLOBAL }
  # u2-retention (BR2.5 to BR2.7): daily purges of the expired login challenges and of the ended sessions with their used
  # digests, across tenants by the instant of each row only; no tenant input, an event by system with counts only (two
  # tenants are purged and neither is exposed, IdentityJobRunnerIT), logs with totals only.
  - { name: IdentityJobSchedule, scope: GLOBAL }
  # u4-data-requests (BR4.13 to BR4.15): the timers of the data subject requests (expired verifications, overdue
  # notices) and their purge, across tenants by the state and the instants of each row only; no tenant input, events
  # carry the tenant of each row and nothing else of the person, logs carry totals only (DataRequestTimersIT,
  # DataSubjectRequestPurgeIT).
  - { name: PrivacyJobSchedule, scope: GLOBAL }
  # u4-data-requests (NFR8.1): one aggregate count by type of the open requests for the gauges and the health; returns
  # no row of a person.
  - { name: DataRequestCountsRefresher, scope: GLOBAL }
  # The worker jobs of the bot wallet (deposit scan, withdrawal follow-up, stuck challenges) read every ACTIVE wallet
  # and write with the tenant recorded on each wallet row, never a tenant from input (BR6.4, WorkerStoresIT).
  - { name: BotWalletJobs, scope: GLOBAL }
  # 261113-trading-real-bot U3 (F3, F4, F5): the worker jobs of the REAL barrier go through the wallets in force and the
  # wallets paused for DAILY_LOSS; each wallet is handled in its own transaction with the tenant and the person read FROM
  # THE WALLET ROW (M1), never from input, and every query of the barrier filters by that tenant (BR6.3, RealRiskJobsIT).
  - { name: RealRiskSchedule, scope: GLOBAL }
  # U3 (U3-NFR5.4): one aggregate count of the reservations by state for the gauge; returns no row of a person.
  - { name: RealRiskReservationGauge, scope: GLOBAL }
  # U3 (U3-NFR3.7): daily purge of the REAL evaluations, closed reservations and photos older than 13 months, through
  # the retention pool; reads no tenant input, returns nothing per person and logs only totals.
  - { name: RealRiskPurgeJob, scope: GLOBAL }
  # 261113-trading-real-bot U4 (logical-components.md): the seven jobs of the REAL execution in the worker. Each order,
  # decision and liquidation is handled with the tenant and the person read FROM ITS ROW, every write filters by them,
  # and the queue checks the ownership of the bot again before creating an order (DecisionConsumerIT).
  - { name: RealExecutionSchedule, scope: GLOBAL }
  # U4 (U4-NFR3.9): daily purge of the REAL orders, sends and liquidations older than 5 years and of the closed decisions
  # older than 13 months, through the retention pool; reads no tenant input and logs only totals.
  - { name: RealExecutionPurgeJob, scope: GLOBAL }
