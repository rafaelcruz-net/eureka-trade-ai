# Registry of routes and background jobs by data scope (BR2.3, NFR5.2).
#   CLIENT  - reads or writes customer data of a tenant: REQUIRES a cross-tenant negative test
#             (negativeTest: <fully.qualified.TestClass>#<method>), otherwise the build fails.
#   SESSION - acts only on the caller's own session (identity from the access token).
#   GLOBAL  - no customer data (for example market data shared by everybody).
#   ADMIN   - administrative route (/api/v1/admin/**, C8): only Role.ADMIN, reads across tenants by design (BR2.4);
#             REQUIRES a negative test proving a guest token gets 403 (negativeTest), otherwise the build fails.
# Every route of the guest and admin OpenAPI and every scheduled job must be listed here.
routes:
  - { method: GET, path: /api/v1/admin/audit-events, scope: ADMIN, negativeTest: com.memetrade.audit.AdminAuditRouteIT#aGuestTokenIsRefusedWith403AndOneRequestForbiddenEvent }
  # U3 (C8): invitation routes of the administrator. The issuance is the ONLY route that receives a tenant from the
  # client (ADR-002, NFR5.2): tenantFromClient marks that named exception, accepted only in ADMIN entries.
  - { method: GET, path: /api/v1/admin/invites, scope: ADMIN, negativeTest: com.memetrade.identity.AdminInviteRouteIT#aGuestTokenIsRefusedWith403AndOneRequestForbiddenEvent }
  - { method: POST, path: /api/v1/admin/invites, scope: ADMIN, tenantFromClient: true, negativeTest: com.memetrade.identity.AdminInviteRouteIT#aGuestTokenIsRefusedWith403AndOneRequestForbiddenEvent }
  - { method: POST, path: '/api/v1/admin/invites/{inviteId}/revoke', scope: ADMIN, negativeTest: com.memetrade.identity.AdminInviteRouteIT#aGuestTokenIsRefusedWith403AndOneRequestForbiddenEvent }
  - { method: POST, path: /api/v1/auth/challenge, scope: GLOBAL }
  - { method: POST, path: /api/v1/auth/verify, scope: GLOBAL }
  - { method: POST, path: /api/v1/auth/refresh, scope: SESSION }
  - { method: POST, path: /api/v1/auth/logout, scope: SESSION }
  - { method: GET, path: /api/v1/scanner/tokens, scope: GLOBAL }
  # U4: assessment of a token, global market data (no tenant in the tables of U4).
  - { method: GET, path: '/api/v1/tokens/{chain}/{mint}/assessment', scope: GLOBAL }
  # U3: invitation lookup without a session; returns no customer data (no tenant, no inviteId, no person), only the
  # derived state, the validity and the public terms (BR2.1).
  - { method: GET, path: '/api/v1/invites/{code}', scope: GLOBAL }
  # U3: personal data of the caller's own account (wallet, acceptance); person and tenant from the token only.
  - { method: GET, path: /api/v1/account, scope: CLIENT, negativeTest: com.memetrade.identity.AccountRouteIT#anotherTenantsSessionNeverSeesThisAccount }
  # U7 (C5, BR9.1): PAPER ledger and P&L of the caller; tenant and person from the token, every query filters by
  # tenant, person and PAPER. A bot of another person is 404 (negative test), a bot not yet activated is empty.
  - { method: GET, path: '/api/v1/bots/{botId}/trades', scope: CLIENT, negativeTest: com.memetrade.ledger.LedgerRoutesIT#anotherPersonsBotIsNotFound }
  - { method: GET, path: '/api/v1/bots/{botId}/day-usage', scope: CLIENT, negativeTest: com.memetrade.ledger.LedgerRoutesIT#anotherPersonsBotIsNotFound }
  - { method: GET, path: /api/v1/ledger, scope: CLIENT, negativeTest: com.memetrade.ledger.LedgerRoutesIT#anotherPersonsBotIsNotFound }
  - { method: GET, path: /api/v1/pnl, scope: CLIENT, negativeTest: com.memetrade.ledger.LedgerRoutesIT#anotherPersonsBotIsNotFound }
  - { method: GET, path: /api/v1/reconciliation, scope: CLIENT, negativeTest: com.memetrade.ledger.LedgerRoutesIT#anotherPersonsBotIsNotFound }
  - { method: POST, path: /api/v1/reconciliation/run, scope: CLIENT, negativeTest: com.memetrade.ledger.LedgerRoutesIT#twoTenantsNeverSeeEachOthersLedger }
  # U6 (C21, BR4.1): refused orders of a bot of the caller; tenant, person and PAPER from the token in every query.
  # Every bot without an evaluation of the caller (another person's, another tenant's, unknown, never evaluated or
  # purged) is the same 404 (negative test).
  - { method: GET, path: '/api/v1/bots/{botId}/rejections', scope: CLIENT, negativeTest: com.memetrade.riskcontrol.RejectionRoutesIT#anotherPersonsEvaluatedBotIsNotFound }
  # U5 (C4, BR2.10, NFR5.1): the bots of the caller; tenant and person from the token in every query and command. A
  # bot of another person, of the same or another tenant, is 404 on every route (negative test). The templates are
  # the same for everybody (no customer data).
  - { method: GET, path: /api/v1/strategy-templates, scope: GLOBAL }
  - { method: GET, path: /api/v1/bots, scope: CLIENT, negativeTest: com.memetrade.bots.web.BotRoutesIT#anotherPersonsBotIsNotFoundOnEveryRoute }
  - { method: POST, path: /api/v1/bots, scope: CLIENT, negativeTest: com.memetrade.bots.web.BotRoutesIT#anotherPersonsBotIsNotFoundOnEveryRoute }
  - { method: GET, path: '/api/v1/bots/{botId}', scope: CLIENT, negativeTest: com.memetrade.bots.web.BotRoutesIT#anotherPersonsBotIsNotFoundOnEveryRoute }
  - { method: PUT, path: '/api/v1/bots/{botId}/draft', scope: CLIENT, negativeTest: com.memetrade.bots.web.BotRoutesIT#anotherPersonsBotIsNotFoundOnEveryRoute }
  - { method: POST, path: '/api/v1/bots/{botId}/commands/{command}', scope: CLIENT, negativeTest: com.memetrade.bots.web.BotRoutesIT#anotherPersonsBotIsNotFoundOnEveryRoute }
  - { method: POST, path: '/api/v1/bots/{botId}/limits', scope: CLIENT, negativeTest: com.memetrade.bots.web.BotRoutesIT#anotherPersonsBotIsNotFoundOnEveryRoute }
  - { method: GET, path: '/api/v1/bots/{botId}/decisions', scope: CLIENT, negativeTest: com.memetrade.bots.web.BotRoutesIT#anotherPersonsBotIsNotFoundOnEveryRoute }
  # U5 (C7, BR8.2): the live channel of the caller; every event is read with the scope of the channel's own person.
  - { method: GET, path: /api/v1/stream/dashboard, scope: CLIENT, negativeTest: com.memetrade.bots.web.DashboardStreamIT#aChannelNeverReceivesAnEventOfAnotherPerson }
jobs:
  - { name: AuditRelayJob, scope: GLOBAL }
  # U2 retention purge and outbox cleanup: system jobs over the whole trail, no tenant input (BR3.1 to BR3.4).
  - { name: AuditJobSchedule, scope: GLOBAL }
  - { name: MarketCollectorJob, scope: GLOBAL }
  # U4: market history cleanup over global market data, no tenant input (F6, BR1.8).
  - { name: MarketHistoryCleanup, scope: GLOBAL }
  # U4: drops idle keys of the per-person scanner limiter; no customer data.
  - { name: ScannerRateLimitEvictionJob, scope: GLOBAL }
  - { name: IdempotencyCleanupJob, scope: GLOBAL }
  - { name: LoginLimiterEvictionJob, scope: GLOBAL }
  # U7: system jobs over every PAPER account; each one reads tenant and person FROM THE ROW it handles and passes them
  # to every query of the round, never mixing people in a query without that filter (BR9.1).
  - { name: PendingCloseJob, scope: GLOBAL }
  - { name: EquityMarkingJob, scope: GLOBAL }
  - { name: ReconciliationJob, scope: GLOBAL }
  # U7: drops idle keys of the "check now" limiter; no customer data.
  - { name: ReconciliationRunLimiterEvictionJob, scope: GLOBAL }
  # U6: daily purge of approved evaluations older than 30 days without a rejection citing them, through the retention
  # pool; the only U6 task across tenants: it reads no tenant input, returns nothing per person and logs only totals.
  - { name: RiskEvaluationPurgeJob, scope: GLOBAL }
  # U5 (C20, BR2.10): the worker schedules (slot dispatch with the closing check, UTC midnight, decision purge). Each
  # cycle and change reads tenant and person FROM THE BOT ROW, binds that owner as the principal before U6 and U7 and
  # never mixes people in a query (two-tenant test below).
  - { name: BotSchedules, scope: CLIENT, negativeTest: com.memetrade.bots.worker.CycleIT#twoTenantsInTheSameSlotNeverMix }
  # U5 (C7, performance-design.md): the single mark reader of the api; one query of marks for the explicit pairs of the
  # open channels, then the details of each channel's own person only.
  - { name: DashboardMarkPoller, scope: CLIENT, negativeTest: com.memetrade.bots.web.DashboardStreamIT#aChannelNeverReceivesAnEventOfAnotherPerson }
