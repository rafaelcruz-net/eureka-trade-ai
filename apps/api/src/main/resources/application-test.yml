# Active only through infra/docker-compose.test.yml (scripts/verify.sh, smoke, e2e, load test).
memetrade:
  smoke:
    # Public address of the wallet generated by scripts/verify.sh; seeded as a BETA_USER account (OQ-8).
    beta-wallet-address: ${SMOKE_BETA_WALLET_ADDRESS:}
    # U3 (Q1 of the Infrastructure Design): invitation code of the U3 smoke, generated per run by scripts/verify.sh;
    # empty creates no invitation. Only the digest and the last 4 characters are stored or logged.
    invite-code: ${SMOKE_INVITE_CODE:}
    # U3 load scenario: codes separated by commas (one per simulated user); empty creates nothing.
    invite-codes: ${SMOKE_INVITE_CODES:}
  market:
    simulated:
      # U5 (cicd-pipeline.md): STANDARD by default; FREQUENT_SIGNALS only for the load scenario u5, and only here
      # (MarketDataConfig refuses it outside the test profile).
      scenario: ${MARKET_SIMULATED_SCENARIO:STANDARD}
