# Used only together with the test profile (LoadtestProfileGuard refuses loadtest alone).
memetrade:
  auth:
    login-rate-limit-per-minute: ${LOGIN_RATE_LIMIT_PER_MINUTE:1000}
    # U3 (performance-design.md): the invitation lookup is measured for real, so its per-IP limit is raised here only.
    invite-lookup-rate-limit-per-minute: ${INVITE_LOOKUP_RATE_LIMIT_PER_MINUTE:1000}
  # u1-legal-documents (infrastructure-specification.md): the scenario "legal" measures the public routes for real from
  # the host, so their per-IP limit is raised here only (never by a variable of the test overlay).
  legal:
    rate-limit-per-minute: 100000
  # u4-data-requests (infrastructure-specification.md): the scenario data-requests measures the creation for real, so the
  # limit per person and hour is raised here only (never by a variable of the test overlay).
  privacy:
    requests-per-hour: 100000
  # U7 (cicd-pipeline.md, Passo 23): the load cycle driver of com.memetrade.ledger.loadtest. With people at 0 (the
  # default, every scenario but u7 and u7-jobs) it does nothing; scripts/load-test.sh sets the values of u7 and u7-jobs.
  loadtest:
    # u4-data-requests (Passo 11): 1000 synthetic requests of 250 accounts of one load tenant, seeded at start by
    # com.memetrade.privacy.loadtest.DataRequestLoadSeed; 0 (the default, every scenario but data-requests) seeds
    # nothing.
    data-requests:
      seed: ${LOADTEST_DATA_REQUESTS_SEED:0}
    ledger:
      people: ${LOADTEST_LEDGER_PEOPLE:0}
      fills-per-person: ${LOADTEST_FILLS_PER_PERSON:0}
      cycle-bots: ${LOADTEST_CYCLE_BOTS:0}
      tokens-per-bot: ${LOADTEST_TOKENS_PER_BOT:5}
      # Review repair R-04 (NFR3.1): bots closed during the run, one per cycle interval from close-start on (u7 only).
      close-bots: ${LOADTEST_CLOSE_BOTS:0}
      close-start: 120s
      cycle-interval: 30s
      # Seed workers (one person each) and cycle workers; well below the 20 connections of the pool.
      threads: 6
    # U6 (cicd-pipeline.md, Passo 16): the load cycle driver of com.memetrade.riskcontrol.loadtest. Disabled by default
    # (every scenario but u6); scripts/load-test.sh enables it for u6, on the 60 PAPER accounts of the ledger load.
    risk:
      enabled: ${LOADTEST_U6_ENABLED:false}
      rejections-per-bot: ${LOADTEST_U6_REJECTIONS_PER_BOT:10000}
      heavy-bot-rejections: ${LOADTEST_U6_HEAVY_BOT_REJECTIONS:80000}
      old-approved: ${LOADTEST_U6_OLD_APPROVED:200000}
      purge-at: ${LOADTEST_U6_PURGE_AT:300s}
      # Volta 2 (F10, NFR2.5): the seed waits at most this long for autovacuum to analyze the seeded tables before the
      # cycles (and the purge) start; the application login cannot run ANALYZE itself.
      statistics-timeout: 5m
      cycle-interval: 30s
      threads: 6
    # U5 (cicd-pipeline.md, Passo 20): the bot seed of the api (people, 3 ACTIVE bots each through the real commands,
    # decisions on one bot per person) and the cycle stopwatch of the worker. Off by default (every scenario but u5).
    bots:
      enabled: ${LOADTEST_U5_ENABLED:false}
      people: ${LOADTEST_U5_PEOPLE:20}
      bots-per-person: 3
      decisions-per-bot: ${LOADTEST_U5_DECISIONS_PER_BOT:20000}
# The limits of the load scenarios (300 ms, 500 ms, 1 s) become exact histogram buckets, so a p95 read from the
# buckets is never rounded up past a limit it actually meets. Precision of the measurement only; no limit changes.
management:
  metrics:
    distribution:
      slo:
        http.server.requests: 250ms,300ms,500ms,1s
      # 261113-trading-real-bot (operation/performance-validation, scenario real): the jobs of the REAL operations and of
      # the REAL barrier publish only count, sum and max in production; here they also publish buckets, so the report
      # shows p50, p95 and p99 of U5-NFR3.2, U5-NFR3.3 and U3-NFR3.4 next to the maximum the targets are judged by.
      # The brackets keep the "_" of the meter names (a plain map key would drop it). Precision only; no limit changes.
      percentiles-histogram:
        "[real_ops_job]": true
        "[real_risk_job]": true
