openapi: 3.1.0
info:
  title: MemeTrade admin API
  version: 1.0.0
paths:
  /api/v1/admin/audit-events:
    get:
      operationId: listAuditEvents
      parameters:
      - description: Início inclusivo (UTC)
        in: query
        name: from
        required: true
        schema:
          type: string
          format: date-time
      - description: Fim exclusivo (UTC); no máximo 31 dias depois de from
        in: query
        name: to
        required: true
        schema:
          type: string
          format: date-time
      - description: Igualdade exata; maiúsculas com sublinhado
        in: query
        name: action
        schema:
          type: string
          maxLength: 64
          pattern: "^[A-Z][A-Z0-9_]{0,63}$"
      - description: Cursor opaco devolvido em nextCursor
        in: query
        name: cursor
        schema:
          type: string
      - description: Itens por página
        in: query
        name: limit
        schema:
          type: integer
          default: 50
          maximum: 100
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
          description: Página com items e nextCursor; Cache-Control no-store
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: VALIDATION_FAILED com a lista de campos
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: UNAUTHENTICATED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "FORBIDDEN_ROLE para token de convidado, auditado como REQUEST_FORBIDDEN"
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: INTERNAL_ERROR sem dados quando AUDIT_QUERIED não pôde ser
            gravado
      security:
      - accessToken: []
      summary: "Eventos da trilha por período e ação, mais recentes primeiro (US7.3,\
        \ NFR7)"
      tags:
      - admin-audit-controller
  /api/v1/admin/auth/challenge:
    post:
      operationId: issueAdminChallenge
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminChallengeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeResponse"
          description: Desafio com o domínio do app do administrador
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "VALIDATION_FAILED: endereço que não é Base58 ou Idempotency-Key\
            \ ausente"
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "RATE_LIMITED: mais de 5 pedidos por minuto do IP ou do par\
            \ (endereço, IP)"
      summary: "Emite o desafio de entrada do administrador para qualquer endereç\
        o válido, sem revelar a lista"
      tags:
      - admin-auth-controller
  /api/v1/admin/auth/logout:
    post:
      operationId: adminLogout
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Sessão encerrada
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: UNAUTHENTICATED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: FORBIDDEN_ROLE para token de convidado
      security:
      - accessToken: []
      summary: Encerra a sessão do administrador e apaga o cookie; repetir não tem
        efeito
      tags:
      - admin-auth-controller
  /api/v1/admin/auth/refresh:
    post:
      operationId: refreshAdminSession
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
          description: Novo token de acesso; o cookie é trocado; a sessão não é prorrogada
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "UNAUTHENTICATED: cookie ausente, reutilizado, sessão vencida\
            \ ou carteira retirada da lista"
      summary: Troca o cookie de renovação do administrador por um novo token; sem
        Idempotency-Key
      tags:
      - admin-auth-controller
  /api/v1/admin/auth/verify:
    post:
      operationId: verifyAdminLogin
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminVerifyRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
          description: Sessão de administrador aberta
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: VALIDATION_FAILED
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "UNAUTHENTICATED: nonce reutilizado, vencido ou de outro escopo,\
            \ ou assinatura inválida"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "FORBIDDEN_ROLE genérico: carteira fora da lista ou de convidado\
            \ (motivo só na auditoria)"
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: RATE_LIMITED
      summary: Verifica a assinatura e abre a sessão do administrador (15 min / 8
        h); cookie em Set-Cookie
      tags:
      - admin-auth-controller
  /api/v1/admin/feedback:
    get:
      operationId: listFeedback
      parameters:
      - description: Cursor opaco devolvido em nextCursor
        in: query
        name: cursor
        schema:
          type: string
      - description: Itens por página
        in: query
        name: limit
        schema:
          type: integer
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackPage"
          description: Uma página
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: VALIDATION_FAILED em limit ou cursor
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: UNAUTHENTICATED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "FORBIDDEN_ROLE para token de convidado, auditado como REQUEST_FORBIDDEN"
      security:
      - accessToken: []
      summary: "Comentários do mais novo para o mais antigo, como texto puro (AC6.1.4);\
        \ sem pessoa nem carteira"
      tags:
      - admin-feedback-controller
  /api/v1/admin/invites:
    get:
      operationId: listInvites
      parameters:
      - description: Cursor opaco devolvido em nextCursor
        in: query
        name: cursor
        schema:
          type: string
      - description: Itens por página
        in: query
        name: limit
        schema:
          type: integer
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePage"
          description: Página sem o código e sem quem emitiu
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: VALIDATION_FAILED em limit ou cursor
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: UNAUTHENTICATED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "FORBIDDEN_ROLE para token de convidado, auditado como REQUEST_FORBIDDEN"
      security:
      - accessToken: []
      summary: "Convites com estado em texto, validade e final do código, mais recentes\
        \ primeiro (AC7.1.2)"
      tags:
      - admin-invite-controller
    post:
      operationId: issueInvite
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueInviteRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
          description: Convite emitido com o código completo; repetir com a mesma
            chave devolve o mesmo convite sem o código
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "VALIDATION_FAILED: Idempotency-Key ausente ou corpo inválido"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: UNAUTHENTICATED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "FORBIDDEN_ROLE para token de convidado, auditado como REQUEST_FORBIDDEN"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "IDEMPOTENCY_CONFLICT: mesma chave com outro corpo"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: VALIDATION_FAILED nos campos tenantId (tenant inexistente ou
            não ativo) ou expiresAt (fora de 1 hora a 30 dias)
      security:
      - accessToken: []
      summary: Emite convite de uso único para um tenant ativo (AC7.1.1); o código
        só vem nesta resposta
      tags:
      - admin-invite-controller
  /api/v1/admin/invites/{inviteId}/revoke:
    post:
      operationId: revokeInvite
      parameters:
      - in: path
        name: inviteId
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
          description: Convite revogado (sem o código)
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "VALIDATION_FAILED: Idempotency-Key ausente ou inviteId invá\
            lido"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: UNAUTHENTICATED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "FORBIDDEN_ROLE para token de convidado, auditado como REQUEST_FORBIDDEN"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "NOT_FOUND: convite inexistente"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: INVITE_NOT_REVOCABLE com reason USED ou EXPIRED; ou IDEMPOTENCY_CONFLICT
      security:
      - accessToken: []
      summary: Revoga um convite pendente; revogar de novo devolve o mesmo convite
        (BR1.4)
      tags:
      - admin-invite-controller
  /api/v1/admin/kill-switch:
    get:
      operationId: getKillSwitch
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KillSwitch"
          description: Estado atual
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: UNAUTHENTICATED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "FORBIDDEN_ROLE para token de convidado, auditado como REQUEST_FORBIDDEN"
      security:
      - accessToken: []
      summary: "Estado do kill switch, quem, quando, motivo, pendências e bots ativos\
        \ a pausar (AC7.2.1)"
      tags:
      - admin-kill-switch-controller
    put:
      operationId: changeKillSwitch
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KillSwitchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KillSwitch"
          description: "Estado confirmado, com pendingBots e reconcileNeeded depois\
            \ da aplicação"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "VALIDATION_FAILED: Idempotency-Key ausente, state fora de\
            \ ON/OFF ou reason vazio ou com mais de 500 caracteres"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: UNAUTHENTICATED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "FORBIDDEN_ROLE para token de convidado, auditado como REQUEST_FORBIDDEN"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "IDEMPOTENCY_CONFLICT: mesma chave com outro corpo"
      security:
      - accessToken: []
      summary: Aciona ou desliga o kill switch (FR3.2); a mesma Idempotency-Key devolve
        a mesma resposta
      tags:
      - admin-kill-switch-controller
  /api/v1/admin/system-status:
    get:
      operationId: getSystemStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
          description: Estado do sistema; uma parte que falha não derruba as outras
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: UNAUTHENTICATED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "FORBIDDEN_ROLE para token de convidado, auditado como REQUEST_FORBIDDEN"
      security:
      - accessToken: []
      summary: Só contagens e estado das fontes (AC7.4.1); cada parte é OK com value
        ou UNKNOWN com reason
      tags:
      - admin-system-controller
  /api/v1/admin/tenants:
    get:
      operationId: listActiveTenants
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TenantOption"
          description: "Tenants ativos, por nome"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: UNAUTHENTICATED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "FORBIDDEN_ROLE para token de convidado, auditado como REQUEST_FORBIDDEN"
      security:
      - accessToken: []
      summary: "Tenants ativos para o formulário de convite (acréscimo da U8, BR5.1)"
      tags:
      - admin-system-controller
components:
  schemas:
    AdminChallengeRequest:
      type: object
      additionalProperties: false
      properties:
        walletAddress:
          type: string
          description: Endereço público Solana
          minLength: 1
      required:
      - walletAddress
    AdminSession:
      type: object
      additionalProperties: false
      properties:
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        role:
          type: string
          enum:
          - ADMIN
        sessionExpiresAt:
          type: string
          format: date-time
        walletMasked:
          type: string
          description: "Carteira mascarada (4 + 4) do administrador, para o cabeç\
            alho do app"
      required:
      - accessToken
      - accessTokenExpiresAt
      - role
      - sessionExpiresAt
    AdminVerifyRequest:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
          minLength: 1
        provider:
          type: string
          enum:
          - PHANTOM
          - SOLFLARE
        signature:
          type: string
          description: Assinatura em base58
          minLength: 1
        walletAddress:
          type: string
          minLength: 1
      required:
      - message
      - provider
      - signature
      - walletAddress
    AuditEventPage:
      type: object
      additionalProperties: false
      description: "Página da trilha, mais recentes primeiro (BR2.3)"
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEventView"
        nextCursor:
          type:
          - string
          - "null"
          description: null na última página
      required:
      - items
      - nextCursor
    AuditEventView:
      type: object
      additionalProperties: false
      description: Evento da trilha como gravado (BR2.4)
      properties:
        action:
          type: string
          maxLength: 64
        actor:
          type: string
          description: "userId, adminId, system ou endereço mascarado antes do login"
        actorType:
          type: string
          enum:
          - PERSON
          - ADMIN
          - SYSTEM
          - ANONYMOUS
        correlationId:
          type: string
        details:
          type: object
          additionalProperties:
            type: string
          description: Mapa texto para texto; pode conter o endereço de carteira completo
        eventId:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        recordedAt:
          type:
          - string
          - "null"
          format: date-time
          description: Instante em que o relay gravou o evento na trilha
        targetRef:
          type:
          - string
          - "null"
        tenantId:
          type:
          - string
          - "null"
          format: uuid
          description: null antes do login e em ações globais do administrador ou
            do sistema
      required:
      - action
      - actor
      - actorType
      - correlationId
      - details
      - eventId
      - occurredAt
      - recordedAt
      - targetRef
      - tenantId
    ChallengeResponse:
      type: object
      additionalProperties: false
      properties:
        chain:
          type: string
        domain:
          type: string
        expiresAt:
          type: string
          format: date-time
        issuedAt:
          type: string
          format: date-time
        message:
          type: string
          description: Texto exato a assinar
        nonce:
          type: string
      required:
      - chain
      - domain
      - expiresAt
      - issuedAt
      - message
      - nonce
    CountMapPart:
      type: object
      additionalProperties: false
      description: "OK com value, ou UNKNOWN com reason (nunca zero no lugar de um\
        \ valor ausente)"
      properties:
        reason:
          type: string
          enum:
          - TIMEOUT
          - UNAVAILABLE
        status:
          type: string
          enum:
          - OK
          - UNKNOWN
        value:
          type: object
          additionalProperties:
            type: integer
            format: int64
      required:
      - status
    CountPart:
      type: object
      additionalProperties: false
      description: "OK com value, ou UNKNOWN com reason (nunca zero no lugar de um\
        \ valor ausente)"
      properties:
        reason:
          type: string
          enum:
          - TIMEOUT
          - UNAVAILABLE
        status:
          type: string
          enum:
          - OK
          - UNKNOWN
        value:
          type: integer
          format: int64
      required:
      - status
    FeedbackItem:
      type: object
      additionalProperties: false
      properties:
        createdAt:
          type: string
          format: date-time
        feedbackId:
          type: string
          format: uuid
        screen:
          type: string
          enum:
          - S1
          - S2
          - S3
          - S4
          - S5
          - S6
          - S7
          - S8
          - S9
        tenantId:
          type: string
          format: uuid
        tenantName:
          type: string
          description: Nome do tenant (acréscimo da U8)
        text:
          type: string
          description: "Texto puro, como foi enviado"
      required:
      - createdAt
      - feedbackId
      - screen
      - tenantId
      - tenantName
      - text
    FeedbackPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FeedbackItem"
        nextCursor:
          type: string
          description: Cursor da próxima página; ausente na última
      required:
      - items
    FieldViolation:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        message:
          type: string
    Invite:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          description: "Código completo: só na resposta 201 da emissão, nunca numa\
            \ repetição"
          minLength: 43
        codeSuffix:
          type: string
          description: 4 últimos
          maxLength: 4
          minLength: 4
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        inviteId:
          type: string
          format: uuid
        revokedAt:
          type:
          - string
          - "null"
          format: date-time
        status:
          type: string
          enum:
          - PENDING
          - USED
          - EXPIRED
          - REVOKED
        tenantId:
          type: string
          format: uuid
        usedAt:
          type:
          - string
          - "null"
          format: date-time
      required:
      - codeSuffix
      - createdAt
      - expiresAt
      - inviteId
      - revokedAt
      - status
      - tenantId
      - usedAt
    InvitePage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invite"
        nextCursor:
          type:
          - string
          - "null"
          description: null quando não há próxima página
      required:
      - items
      - nextCursor
    IssueInviteRequest:
      type: object
      additionalProperties: false
      properties:
        expiresAt:
          type: string
          format: date-time
          description: "Entre agora + 1 hora e agora + 30 dias, inclusive (UTC)"
        tenantId:
          type: string
          format: uuid
          description: "Exceção à regra de tenant: o administrador escolhe um tenant\
            \ ativo (ADR-002)"
      required:
      - expiresAt
      - tenantId
    KillSwitch:
      type: object
      additionalProperties: false
      properties:
        activeBotsToPause:
          type: integer
          format: int64
          description: Bots ACTIVE que o acionamento vai pausar; só no GET (AC7.2.1)
        changedAt:
          type: string
          format: date-time
        changedBy:
          type: string
          description: Carteira mascarada (4 + 4) do administrador da última mudança
        pendingBots:
          type: integer
          format: int32
          description: Bots cuja pausa (ou retirada) ainda falhou
        reason:
          type: string
          description: Motivo da última mudança
        reconcileNeeded:
          type: boolean
          description: A última aplicação ainda está sendo confirmada pela reconciliação
        state:
          type: string
          enum:
          - "ON"
          - "OFF"
        version:
          type: integer
          format: int64
      required:
      - pendingBots
      - reconcileNeeded
      - state
      - version
    KillSwitchPart:
      type: object
      additionalProperties: false
      description: "OK com value, ou UNKNOWN com reason (nunca zero no lugar de um\
        \ valor ausente)"
      properties:
        reason:
          type: string
          enum:
          - TIMEOUT
          - UNAVAILABLE
        status:
          type: string
          enum:
          - OK
          - UNKNOWN
        value:
          $ref: "#/components/schemas/KillSwitchSummary"
      required:
      - status
    KillSwitchRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          description: "Motivo, de 1 a 500 caracteres depois de tirar os espaços (BR2.6)"
          maxLength: 500
          minLength: 1
        state:
          type: string
          enum:
          - "ON"
          - "OFF"
      required:
      - reason
      - state
    KillSwitchSummary:
      type: object
      additionalProperties: false
      properties:
        pendingBots:
          type: integer
          format: int32
        reconcileNeeded:
          type: boolean
        state:
          type: string
          enum:
          - "ON"
          - "OFF"
      required:
      - pendingBots
      - reconcileNeeded
      - state
    Problem:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        correlationId:
          type: string
        detail:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldViolation"
        reason:
          type: string
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          format: uri
      required:
      - code
      - correlationId
      - status
      - title
      - type
    SourceState:
      type: object
      additionalProperties: false
      properties:
        lastUpdatedAt:
          type: string
          format: date-time
          description: Última coleta bem-sucedida; ausente antes da primeira
        name:
          type: string
        simulated:
          type: boolean
        sourceId:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - OK
          - DEGRADED
          - FAILED
      required:
      - name
      - simulated
      - sourceId
      - status
    SourcesPart:
      type: object
      additionalProperties: false
      description: "OK com value, ou UNKNOWN com reason (nunca zero no lugar de um\
        \ valor ausente)"
      properties:
        reason:
          type: string
          enum:
          - TIMEOUT
          - UNAVAILABLE
        status:
          type: string
          enum:
          - OK
          - UNKNOWN
        value:
          type: array
          items:
            $ref: "#/components/schemas/SourceState"
      required:
      - status
    SystemStatus:
      type: object
      additionalProperties: false
      properties:
        auditOutboxPending:
          $ref: "#/components/schemas/CountPart"
          description: Eventos de auditoria ainda na tabela de saída
        botCountsByState:
          $ref: "#/components/schemas/CountMapPart"
          description: "Chaves de BotState, com CLOSING_PENDING"
        generatedAt:
          type: string
          format: date-time
        guestCount:
          $ref: "#/components/schemas/CountPart"
        inviteCounts:
          $ref: "#/components/schemas/CountMapPart"
          description: "Chaves PENDING, USED, EXPIRED, REVOKED"
        killSwitch:
          $ref: "#/components/schemas/KillSwitchPart"
        rejectedOrdersToday:
          $ref: "#/components/schemas/CountPart"
          description: Ordens recusadas de todos os tenants desde 00:00 UTC de hoje
            (acréscimo da U8)
        sources:
          $ref: "#/components/schemas/SourcesPart"
      required:
      - auditOutboxPending
      - botCountsByState
      - generatedAt
      - guestCount
      - inviteCounts
      - killSwitch
      - rejectedOrdersToday
      - sources
    TenantOption:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        tenantId:
          type: string
          format: uuid
      required:
      - name
      - tenantId
  securitySchemes:
    accessToken:
      scheme: bearer
      type: http
