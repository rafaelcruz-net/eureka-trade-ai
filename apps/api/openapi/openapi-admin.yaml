openapi: 3.1.0
info:
  title: MemeTrade admin API
  version: 1.0.0
paths:
  /api/v1/admin/audit-events:
    get:
      operationId: listAuditEvents
      parameters:
      - description: Início inclusivo (UTC)
        in: query
        name: from
        required: true
        schema:
          type: string
          format: date-time
      - description: Fim exclusivo (UTC); no máximo 31 dias depois de from
        in: query
        name: to
        required: true
        schema:
          type: string
          format: date-time
      - description: Igualdade exata; maiúsculas com sublinhado
        in: query
        name: action
        schema:
          type: string
          maxLength: 64
          pattern: "^[A-Z][A-Z0-9_]{0,63}$"
      - description: Cursor opaco devolvido em nextCursor
        in: query
        name: cursor
        schema:
          type: string
      - description: Itens por página
        in: query
        name: limit
        schema:
          type: integer
          default: 50
          maximum: 100
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
          description: Página com items e nextCursor; Cache-Control no-store
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: VALIDATION_FAILED com a lista de campos
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: UNAUTHENTICATED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "FORBIDDEN_ROLE para token de convidado, auditado como REQUEST_FORBIDDEN"
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: INTERNAL_ERROR sem dados quando AUDIT_QUERIED não pôde ser
            gravado
      security:
      - accessToken: []
      summary: "Eventos da trilha por período e ação, mais recentes primeiro (US7.3,\
        \ NFR7)"
      tags:
      - admin-audit-controller
  /api/v1/admin/auth/challenge:
    post:
      operationId: issueAdminChallenge
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminChallengeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeResponse"
          description: Desafio com o domínio do app do administrador
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "VALIDATION_FAILED: endereço que não é Base58 ou Idempotency-Key\
            \ ausente"
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "RATE_LIMITED: mais de 5 pedidos por minuto do IP ou do par\
            \ (endereço, IP)"
      summary: "Emite o desafio de entrada do administrador para qualquer endereç\
        o válido, sem revelar a lista"
      tags:
      - admin-auth-controller
  /api/v1/admin/auth/logout:
    post:
      operationId: adminLogout
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Sessão encerrada
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: UNAUTHENTICATED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: FORBIDDEN_ROLE para token de convidado
      security:
      - accessToken: []
      summary: Encerra a sessão do administrador e apaga o cookie; repetir não tem
        efeito
      tags:
      - admin-auth-controller
  /api/v1/admin/auth/refresh:
    post:
      operationId: refreshAdminSession
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
          description: Novo token de acesso; o cookie é trocado; a sessão não é prorrogada
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "UNAUTHENTICATED: cookie ausente, reutilizado, sessão vencida\
            \ ou carteira retirada da lista"
      summary: Troca o cookie de renovação do administrador por um novo token; sem
        Idempotency-Key
      tags:
      - admin-auth-controller
  /api/v1/admin/auth/verify:
    post:
      operationId: verifyAdminLogin
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminVerifyRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
          description: Sessão de administrador aberta
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: VALIDATION_FAILED
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "UNAUTHENTICATED: nonce reutilizado, vencido ou de outro escopo,\
            \ ou assinatura inválida"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "FORBIDDEN_ROLE genérico: carteira fora da lista ou de convidado\
            \ (motivo só na auditoria)"
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: RATE_LIMITED
      summary: Verifica a assinatura e abre a sessão do administrador (15 min / 8
        h); cookie em Set-Cookie
      tags:
      - admin-auth-controller
  /api/v1/admin/feedback:
    get:
      operationId: listFeedback
      parameters:
      - description: Cursor opaco devolvido em nextCursor
        in: query
        name: cursor
        schema:
          type: string
      - description: Itens por página
        in: query
        name: limit
        schema:
          type: integer
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackPage"
          description: Uma página
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: VALIDATION_FAILED em limit ou cursor
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: UNAUTHENTICATED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "FORBIDDEN_ROLE para token de convidado, auditado como REQUEST_FORBIDDEN"
      security:
      - accessToken: []
      summary: "Comentários do mais novo para o mais antigo, como texto puro (AC6.1.4);\
        \ sem pessoa nem carteira"
      tags:
      - admin-feedback-controller
  /api/v1/admin/invites:
    get:
      operationId: listInvites
      parameters:
      - description: Cursor opaco devolvido em nextCursor
        in: query
        name: cursor
        schema:
          type: string
      - description: Itens por página
        in: query
        name: limit
        schema:
          type: integer
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePage"
          description: Página sem o código e sem quem emitiu
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: VALIDATION_FAILED em limit ou cursor
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: UNAUTHENTICATED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "FORBIDDEN_ROLE para token de convidado, auditado como REQUEST_FORBIDDEN"
      security:
      - accessToken: []
      summary: "Convites com estado em texto, validade e final do código, mais recentes\
        \ primeiro (AC7.1.2)"
      tags:
      - admin-invite-controller
    post:
      operationId: issueInvite
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueInviteRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
          description: Convite emitido com o código completo; repetir com a mesma
            chave devolve o mesmo convite sem o código
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "VALIDATION_FAILED: Idempotency-Key ausente ou corpo inválido"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: UNAUTHENTICATED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "FORBIDDEN_ROLE para token de convidado, auditado como REQUEST_FORBIDDEN"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "IDEMPOTENCY_CONFLICT: mesma chave com outro corpo"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: VALIDATION_FAILED nos campos tenantId (tenant inexistente ou
            não ativo) ou expiresAt (fora de 1 hora a 30 dias)
      security:
      - accessToken: []
      summary: Emite convite de uso único para um tenant ativo (AC7.1.1); o código
        só vem nesta resposta
      tags:
      - admin-invite-controller
  /api/v1/admin/invites/{inviteId}/revoke:
    post:
      operationId: revokeInvite
      parameters:
      - in: path
        name: inviteId
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
          description: Convite revogado (sem o código)
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "VALIDATION_FAILED: Idempotency-Key ausente ou inviteId invá\
            lido"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: UNAUTHENTICATED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "FORBIDDEN_ROLE para token de convidado, auditado como REQUEST_FORBIDDEN"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "NOT_FOUND: convite inexistente"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: INVITE_NOT_REVOCABLE com reason USED ou EXPIRED; ou IDEMPOTENCY_CONFLICT
      security:
      - accessToken: []
      summary: Revoga um convite pendente; revogar de novo devolve o mesmo convite
        (BR1.4)
      tags:
      - admin-invite-controller
  /api/v1/admin/kill-switch:
    get:
      operationId: getKillSwitch
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KillSwitch"
          description: Estado atual
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: UNAUTHENTICATED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "FORBIDDEN_ROLE para token de convidado, auditado como REQUEST_FORBIDDEN"
      security:
      - accessToken: []
      summary: "Estado do kill switch, quem, quando, motivo, pendências e bots ativos\
        \ a pausar (AC7.2.1)"
      tags:
      - admin-kill-switch-controller
    put:
      operationId: changeKillSwitch
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KillSwitchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KillSwitch"
          description: "Estado confirmado, com pendingBots e reconcileNeeded depois\
            \ da aplicação"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "VALIDATION_FAILED: Idempotency-Key ausente, state fora de\
            \ ON/OFF ou reason vazio ou com mais de 500 caracteres"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: UNAUTHENTICATED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "FORBIDDEN_ROLE para token de convidado, auditado como REQUEST_FORBIDDEN"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "IDEMPOTENCY_CONFLICT: mesma chave com outro corpo"
      security:
      - accessToken: []
      summary: Aciona ou desliga o kill switch (FR3.2); a mesma Idempotency-Key devolve
        a mesma resposta
      tags:
      - admin-kill-switch-controller
  /api/v1/admin/privacy/requests:
    get:
      operationId: adminListDataRequests
      parameters:
      - in: query
        name: status
        schema:
          type: string
          enum:
          - RECEIVED
          - AWAITING_VERIFICATION
          - IN_PROGRESS
          - DONE
          - REFUSED
      - description: Cursor opaco devolvido em nextCursor
        in: query
        name: cursor
        schema:
          type: string
      - description: Itens por página
        in: query
        name: limit
        schema:
          type: integer
          default: 50
          maximum: 100
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDataRequestPage"
          description: "Uma página, do prazo mais próximo para o mais distante"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "VALIDATION_FAILED em status, limit ou cursor"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "FORBIDDEN_ROLE para token de convidado, auditado como REQUEST_FORBIDDEN"
      security:
      - accessToken: []
      summary: "Pedidos de titular por prazo, com filtro de situação e cursor (FR7.1,\
        \ NFR3.2)"
      tags:
      - admin-data-request-controller
    post:
      operationId: adminRegisterEmailRequest
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterEmailDataRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDataRequest"
          description: "Registrado como EMAIL e RECEIVED, com prazo de 15 dias"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "VALIDATION_FAILED em type, details, contact, receivedAt (futuro),\
            \ userId (conta inexistente) ou campo desconhecido; o erro nomeia o campo,\
            \ nunca o valor"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: FORBIDDEN_ROLE
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "DATA_REQUEST_ALREADY_OPEN (a conta ligada já tem pedido aberto\
            \ do mesmo tipo; aditivo, U4) ou IDEMPOTENCY_CONFLICT"
      security:
      - accessToken: []
      summary: Registra pedido recebido pelo e-mail do encarregado (FR5.2c)
      tags:
      - admin-data-request-controller
  /api/v1/admin/privacy/requests/{requestId}:
    get:
      operationId: adminGetDataRequest
      parameters:
      - in: path
        name: requestId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDataRequest"
          description: O pedido
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: NOT_FOUND
      security:
      - accessToken: []
      summary: "Um pedido com o texto, a verificação e, para Acesso aberto, a pré\
        via do resumo"
      tags:
      - admin-data-request-controller
  /api/v1/admin/privacy/requests/{requestId}/anonymization:
    post:
      operationId: adminAnonymizeAccount
      parameters:
      - in: path
        name: requestId
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnonymizeAccountRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnonymizationResult"
          description: "A conta anonimizada e o pedido DONE, ou a repetição"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: FORBIDDEN_ROLE
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: NOT_FOUND
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: REQUEST_NOT_ELIGIBLE (não é Exclusão IN_PROGRESS) | NO_LINKED_ACCOUNT
            | ADMIN_ACCOUNT_NOT_ANONYMIZABLE | IDENTITY_NOT_VERIFIED (origem EMAIL)
            | IDEMPOTENCY_CONFLICT
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: CONFIRMATION_REQUIRED (confirmação diferente de ANONIMIZAR)
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "LOCK_TIMEOUT com Retry-After: nada mudou; repetir com a mesma\
            \ Idempotency-Key"
      security:
      - accessToken: []
      summary: Anonimiza a conta de um pedido de Exclusão em andamento (FR6); idempotente;
        a repetição numa conta já anonimizada devolve o mesmo resultado com alreadyAnonymized
      tags:
      - admin-anonymization-controller
  /api/v1/admin/privacy/requests/{requestId}/reply-sent:
    post:
      operationId: adminMarkReplySent
      parameters:
      - in: path
        name: requestId
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDataRequest"
          description: O pedido com replySentAt; o primeiro registro é mantido
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: NOT_FOUND
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: INVALID_TRANSITION (origem ACCOUNT ou pedido ainda aberto)
      security:
      - accessToken: []
      summary: Registra a data do envio da resposta ao contato de um pedido por e-mail
        (só EMAIL encerrado)
      tags:
      - admin-data-request-controller
  /api/v1/admin/privacy/requests/{requestId}/transitions:
    post:
      operationId: adminTransitionDataRequest
      parameters:
      - in: path
        name: requestId
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataRequestTransition"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDataRequest"
          description: O pedido depois da transição
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "VALIDATION_FAILED (destino fora do enum, resposta ou motivo\
            \ longos demais)"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: NOT_FOUND
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "INVALID_TRANSITION (inclui AWAITING_VERIFICATION para IN_PROGRESS,\
            \ que só a confirmação faz, e verificação de identidade primeiro) | DATA_REQUEST_CLOSED\
            \ | IDENTITY_NOT_VERIFIED"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: UNPROCESSABLE_FIELDS (recusa sem motivo; liberar resumo fora
            de um Acesso)
      security:
      - accessToken: []
      summary: "Muda a situação do pedido. RECEIVED para IN_PROGRESS é recusado num\
        \ pedido EMAIL de ACCESS ou DELETION ligado a conta ativa: ele passa antes\
        \ pela verificação de identidade"
      tags:
      - admin-data-request-controller
  /api/v1/admin/privacy/requests/{requestId}/verification:
    post:
      operationId: adminStartVerification
      parameters:
      - in: path
        name: requestId
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationView"
          description: "A verificação, com a mensagem a enviar ao contato"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: NOT_FOUND
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "INVALID_TRANSITION (origem Conta, sem conta ligada, conta\
            \ anonimizada, tipo sem verificação ou pedido fora de RECEIVED) | DATA_REQUEST_CLOSED"
      security:
      - accessToken: []
      summary: Gera a mensagem de verificação e leva o pedido a AWAITING_VERIFICATION
        (só origem EMAIL com conta)
      tags:
      - admin-data-request-controller
  /api/v1/admin/privacy/requests/{requestId}/verification/confirm:
    post:
      operationId: adminConfirmVerification
      parameters:
      - in: path
        name: requestId
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmVerification"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDataRequest"
          description: Identidade confirmada; o pedido está IN_PROGRESS
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: NOT_FOUND
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: VERIFICATION_EXPIRED | VERIFICATION_ALREADY_USED | DATA_REQUEST_CLOSED
            (antes de qualquer erro de verificação) | INVALID_TRANSITION (sem verificação
            iniciada)
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: VERIFICATION_INVALID (o pedido continua aguardando)
      security:
      - accessToken: []
      summary: Confere a assinatura da carteira da conta sobre a mensagem; a assinatura
        nunca é guardada
      tags:
      - admin-data-request-controller
  /api/v1/admin/real/divergences:
    get:
      operationId: listRealDivergences
      parameters:
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealAdminDivergencePage"
          description: OK
      security:
      - accessToken: []
      summary: "Divergências abertas ou compensadas, das mais novas para as mais antigas"
      tags:
      - real-admin-controller
  /api/v1/admin/real/divergences/{divergenceId}/compensation:
    post:
      operationId: compensateRealDivergence
      parameters:
      - in: path
        name: divergenceId
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealAdminCompensationRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealAdminDivergence"
          description: OK
      security:
      - accessToken: []
      summary: "Lançamento compensatório por ativo, igual à diferença medida; a nova\
        \ reconciliação decide (BR2.3)"
      tags:
      - real-admin-controller
  /api/v1/admin/real/kill-switch:
    delete:
      operationId: deactivateRealKillSwitch
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealAdminReasonRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealAdminKillSwitch"
          description: OK
      security:
      - accessToken: []
      summary: Desliga o kill switch das carteiras do bot; nenhum bot é religado (BR3.2)
      tags:
      - real-admin-controller
    get:
      operationId: getRealKillSwitch
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealAdminKillSwitch"
          description: OK
      security:
      - accessToken: []
      summary: Estado do kill switch das carteiras do bot
      tags:
      - real-admin-controller
    put:
      operationId: activateRealKillSwitch
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealAdminReasonRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealAdminKillSwitch"
          description: OK
      security:
      - accessToken: []
      summary: "Liga o kill switch das carteiras do bot: ordens novas de todos recusadas\
        \ na hora; as não enviadas são canceladas; o saque continua (BR3.1)"
      tags:
      - real-admin-controller
  /api/v1/admin/real/restore/confirmation:
    post:
      operationId: confirmRealRestore
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealAdminReasonRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealAdminRestore"
          description: OK
      security:
      - accessToken: []
      summary: Confirma a restauração do banco depois que todas as carteiras vieram
        limpas (BR2.5)
      tags:
      - real-admin-controller
  /api/v1/admin/real/token-blocks:
    get:
      operationId: listRealTokenBlocks
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealAdminTokenList"
          description: OK
      security:
      - accessToken: []
      summary: Lista de bloqueio de tokens das carteiras do bot
      tags:
      - real-admin-controller
    post:
      operationId: blockRealToken
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealAdminTokenBlockRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealAdminBlockedToken"
          description: OK
      security:
      - accessToken: []
      summary: Bloqueia um token para todas as carteiras do bot a partir do registro
        (BR4.2)
      tags:
      - real-admin-controller
  /api/v1/admin/real/token-blocks/{mint}:
    delete:
      operationId: unblockRealToken
      parameters:
      - in: path
        name: mint
        required: true
        schema:
          type: string
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealAdminUnblock"
          description: OK
      security:
      - accessToken: []
      summary: Desbloqueia um token (BR4.2)
      tags:
      - real-admin-controller
  /api/v1/admin/real/users:
    get:
      operationId: listRealUsers
      parameters:
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealAdminUserPage"
          description: OK
      security:
      - accessToken: []
      summary: "Pessoas com carteira do bot: modo, teto, saldo, liberação e divergê\
        ncias (BR5.1)"
      tags:
      - real-admin-controller
  /api/v1/admin/real/users/{userId}:
    get:
      operationId: getRealUser
      parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealAdminUser"
          description: OK
      security:
      - accessToken: []
      summary: "A visão de uma pessoa, com as 20 ordens mais recentes; sem chave e\
        \ com a carteira principal abreviada"
      tags:
      - real-admin-controller
  /api/v1/admin/real/users/{userId}/cap:
    put:
      operationId: lowerRealCap
      parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealAdminCapRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealAdminCap"
          description: OK
      security:
      - accessToken: []
      summary: Baixa o teto na hora (nunca sobe); o TxSigner recebe LOWER_CAP até
        confirmar (BR4.1)
      tags:
      - real-admin-controller
  /api/v1/admin/real/users/{userId}/release:
    delete:
      operationId: revokeRealUser
      parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealAdminReasonRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealAdminRevocation"
          description: OK
      security:
      - accessToken: []
      summary: Revoga na hora; as ordens não enviadas são canceladas e o saque continua
        (BR1.6)
      tags:
      - real-admin-controller
    post:
      operationId: releaseRealUser
      parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealAdminReleaseRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealAdminRelease"
          description: OK
      security:
      - accessToken: []
      summary: Registra a liberação; vale depois de 24 h com os portões verdes (BR1.2
        a BR1.4)
      tags:
      - real-admin-controller
  /api/v1/admin/system-status:
    get:
      operationId: getSystemStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
          description: Estado do sistema; uma parte que falha não derruba as outras
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: UNAUTHENTICATED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "FORBIDDEN_ROLE para token de convidado, auditado como REQUEST_FORBIDDEN"
      security:
      - accessToken: []
      summary: Só contagens e estado das fontes (AC7.4.1); cada parte é OK com value
        ou UNKNOWN com reason
      tags:
      - admin-system-controller
  /api/v1/admin/tenants:
    get:
      operationId: listActiveTenants
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TenantOption"
          description: "Tenants ativos, por nome"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: UNAUTHENTICATED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "FORBIDDEN_ROLE para token de convidado, auditado como REQUEST_FORBIDDEN"
      security:
      - accessToken: []
      summary: "Tenants ativos para o formulário de convite (acréscimo da U8, BR5.1)"
      tags:
      - admin-system-controller
  /api/v1/legal/current:
    get:
      operationId: getCurrentLegalDocuments
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalDocuments"
          description: "Versão vigente efetiva; Cache-Control public, max-age=300\
            \ e ETag por hash do conteúdo"
          headers:
            ETag:
              schema:
                type: string
              style: simple
        "304":
          description: "Não modificado (If-None-Match igual ao ETag), sem corpo"
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "RATE_LIMITED: mais de 60 requisições por minuto deste IP"
          headers:
            Retry-After:
              schema:
                type: integer
              style: simple
      summary: "Versão vigente dos termos, da política e do aviso de risco, sem sessã\
        o (FR1.1, FR2.1)"
      tags:
      - legal-documents-controller
  /api/v1/legal/versions:
    get:
      operationId: listLegalVersions
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LegalVersionRef"
          description: Vigente e anteriores; nunca versões futuras ou ignoradas na
            ativação
          headers:
            ETag:
              schema:
                type: string
              style: simple
        "304":
          description: "Não modificado (If-None-Match igual ao ETag), sem corpo"
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "RATE_LIMITED: mais de 60 requisições por minuto deste IP"
          headers:
            Retry-After:
              schema:
                type: integer
              style: simple
      summary: "Histórico das versões publicadas, mais nova primeiro (FR8.1)"
      tags:
      - legal-documents-controller
  /api/v1/legal/versions/{version}:
    get:
      operationId: getLegalVersion
      parameters:
      - description: "Identificador da versão, por exemplo v2"
        in: path
        name: version
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalDocuments"
          description: "A versão pedida, se estiver no histórico"
          headers:
            ETag:
              schema:
                type: string
              style: simple
        "304":
          description: "Não modificado (If-None-Match igual ao ETag), sem corpo"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "NOT_FOUND: versão fora do histórico (futura, ignorada ou desconhecida)"
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "RATE_LIMITED: mais de 60 requisições por minuto deste IP"
          headers:
            Retry-After:
              schema:
                type: integer
              style: simple
      summary: "Uma versão do histórico (FR8.1, BR1.10)"
      tags:
      - legal-documents-controller
components:
  schemas:
    AcceptedVersion:
      type: object
      additionalProperties: false
      properties:
        acceptedAt:
          type: string
          format: date-time
        version:
          type: string
      required:
      - acceptedAt
      - version
    AccessSummary:
      type: object
      additionalProperties: false
      properties:
        acceptedVersions:
          type: array
          items:
            $ref: "#/components/schemas/AcceptedVersion"
        accountCreatedAt:
          type: string
          format: date-time
        botCount:
          type: integer
          format: int64
          minimum: 0
        feedbackCount:
          type: integer
          format: int64
          minimum: 0
        lastLoginAt:
          type:
          - string
          - "null"
          format: date-time
          description: Início da sessão mais recente; null antes do primeiro login
        paperOrderCount:
          type: integer
          format: int64
          minimum: 0
        provider:
          type: string
        requests:
          type: array
          items:
            $ref: "#/components/schemas/AccessSummaryRequest"
        walletMasked:
          type: string
          description: 4 primeiros e 4 últimos caracteres
      required:
      - acceptedVersions
      - accountCreatedAt
      - botCount
      - feedbackCount
      - lastLoginAt
      - paperOrderCount
      - provider
      - requests
      - walletMasked
    AccessSummaryRequest:
      type: object
      additionalProperties: false
      properties:
        receivedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - RECEIVED
          - AWAITING_VERIFICATION
          - IN_PROGRESS
          - DONE
          - REFUSED
        type:
          type: string
          enum:
          - ACCESS
          - CORRECTION
          - DELETION
          - OTHER
      required:
      - receivedAt
      - status
      - type
    AdminChallengeRequest:
      type: object
      additionalProperties: false
      properties:
        walletAddress:
          type: string
          description: Endereço público Solana
          minLength: 1
      required:
      - walletAddress
    AdminDataRequest:
      type: object
      additionalProperties: false
      properties:
        accessSummary:
          description: Foto liberada na conclusão de um Acesso
          oneOf:
          - $ref: "#/components/schemas/AccessSummary"
          - type: "null"
        accessSummaryPreview:
          description: Prévia do resumo de um Acesso aberto ligado a uma conta; null
            na lista
          oneOf:
          - $ref: "#/components/schemas/AccessSummary"
          - type: "null"
        accountAnonymized:
          type: boolean
          description: A conta ligada foi anonimizada (acréscimo da U5); a tela mostra
            'Conta anonimizada'
        contact:
          type:
          - string
          - "null"
          description: E-mail do titular; só em pedidos por e-mail
        details:
          type: string
          description: "Texto do pedido, como foi enviado"
        dueAt:
          type: string
          format: date-time
        dueSoon:
          type: boolean
          description: "Aberto, ainda no prazo e a 3 dias ou menos dele (acréscimo\
            \ da U4, BR4.16)"
        identityVerified:
          type: boolean
        origin:
          type: string
          enum:
          - ACCOUNT
          - EMAIL
        overdue:
          type: boolean
          description: Aberto e com o prazo vencido
        receivedAt:
          type: string
          format: date-time
        refusalReason:
          type:
          - string
          - "null"
        replySentAt:
          type:
          - string
          - "null"
          format: date-time
        requestId:
          type: string
          format: uuid
        response:
          type:
          - string
          - "null"
        status:
          type: string
          enum:
          - RECEIVED
          - AWAITING_VERIFICATION
          - IN_PROGRESS
          - DONE
          - REFUSED
        type:
          type: string
          enum:
          - ACCESS
          - CORRECTION
          - DELETION
          - OTHER
        userId:
          type:
          - string
          - "null"
          format: uuid
        verification:
          description: Verificação por assinatura; null sem verificação ou na lista
          oneOf:
          - $ref: "#/components/schemas/VerificationView"
          - type: "null"
      required:
      - accessSummary
      - accessSummaryPreview
      - accountAnonymized
      - contact
      - details
      - dueAt
      - dueSoon
      - identityVerified
      - origin
      - overdue
      - receivedAt
      - refusalReason
      - replySentAt
      - requestId
      - response
      - status
      - type
      - userId
      - verification
    AdminDataRequestPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminDataRequest"
        nextCursor:
          type: string
          description: Cursor da próxima página; ausente na última
      required:
      - items
    AdminSession:
      type: object
      additionalProperties: false
      properties:
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        role:
          type: string
          enum:
          - ADMIN
        sessionExpiresAt:
          type: string
          format: date-time
        walletMasked:
          type: string
          description: "Carteira mascarada (4 + 4) do administrador, para o cabeç\
            alho do app"
      required:
      - accessToken
      - accessTokenExpiresAt
      - role
      - sessionExpiresAt
    AdminVerifyRequest:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
          minLength: 1
        provider:
          type: string
          enum:
          - PHANTOM
          - SOLFLARE
        signature:
          type: string
          description: Assinatura em base58
          minLength: 1
        walletAddress:
          type: string
          minLength: 1
      required:
      - message
      - provider
      - signature
      - walletAddress
    AnonymizationResult:
      type: object
      additionalProperties: false
      properties:
        alreadyAnonymized:
          type: boolean
          description: A conta já estava anonimizada; nada mudou
        anonymizedAt:
          type: string
          format: date-time
        botsStopped:
          type: integer
          format: int32
          minimum: 0
        feedbackDeleted:
          type: integer
          format: int32
          minimum: 0
        requestId:
          type: string
          format: uuid
        sessionsRevoked:
          type: integer
          format: int32
          minimum: 0
        userId:
          type: string
          format: uuid
      required:
      - alreadyAnonymized
      - anonymizedAt
      - botsStopped
      - feedbackDeleted
      - requestId
      - sessionsRevoked
      - userId
    AnonymizeAccountRequest:
      type: object
      additionalProperties: false
      properties:
        confirmation:
          type: string
          description: Exatamente ANONIMIZAR; qualquer outro texto é 422 CONFIRMATION_REQUIRED
      required:
      - confirmation
    AuditEventPage:
      type: object
      additionalProperties: false
      description: "Página da trilha, mais recentes primeiro (BR2.3)"
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEventView"
        nextCursor:
          type:
          - string
          - "null"
          description: null na última página
      required:
      - items
      - nextCursor
    AuditEventView:
      type: object
      additionalProperties: false
      description: Evento da trilha como gravado (BR2.4)
      properties:
        action:
          type: string
          maxLength: 64
        actor:
          type: string
          description: "userId, adminId, system ou endereço mascarado antes do login"
        actorType:
          type: string
          enum:
          - PERSON
          - ADMIN
          - SYSTEM
          - ANONYMOUS
        correlationId:
          type: string
        details:
          type: object
          additionalProperties:
            type: string
          description: Mapa texto para texto; pode conter o endereço de carteira completo
        eventId:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        recordedAt:
          type:
          - string
          - "null"
          format: date-time
          description: Instante em que o relay gravou o evento na trilha
        targetRef:
          type:
          - string
          - "null"
        tenantId:
          type:
          - string
          - "null"
          format: uuid
          description: null antes do login e em ações globais do administrador ou
            do sistema
      required:
      - action
      - actor
      - actorType
      - correlationId
      - details
      - eventId
      - occurredAt
      - recordedAt
      - targetRef
      - tenantId
    ChallengeResponse:
