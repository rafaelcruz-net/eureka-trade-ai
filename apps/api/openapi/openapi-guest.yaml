openapi: 3.1.0
info:
  title: MemeTrade guest API
  version: 1.0.0
paths:
  /api/v1/account:
    get:
      operationId: getAccount
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
          description: Conta da própria pessoa; Cache-Control no-store
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: UNAUTHENTICATED; o app tenta renovar e depois leva à entrada
            com a tela de origem
      security:
      - accessToken: []
      summary: "Dados da conta: carteira abreviada, provedor, fim da sessão e termos\
        \ aceitos (US1.5)"
      tags:
      - account-controller
  /api/v1/auth/challenge:
    post:
      operationId: issueChallenge
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeResponse"
          description: OK
      summary: "Emite mensagem de login com domínio, nonce de uso único, expiraçã\
        o de 5 minutos e chain (FR1.3)"
      tags:
      - auth-controller
  /api/v1/auth/logout:
    post:
      operationId: logout
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Sessão encerrada
      security:
      - accessToken: []
      summary: Encerra a sessão e revoga o token de renovação; bots continuam rodando
      tags:
      - auth-controller
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestSession"
          description: Novo token de acesso; o cookie de renovação é trocado
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: UNAUTHENTICATED; o app volta à entrada e depois à tela de origem
      summary: Troca o cookie de renovação por um novo token de acesso; sem Idempotency-Key
      tags:
      - auth-controller
  /api/v1/auth/verify:
    post:
      operationId: verifyLogin
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestSession"
          description: Sessão aberta
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: LOGIN_CHALLENGE_REJECTED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: FORBIDDEN_ROLE quando a carteira é a de administrador
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "INVITE_NOT_FOUND: código do convite desconhecido ou mal formado\
            \ (U3)"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "WALLET_ALREADY_LINKED: a carteira já tem conta; o convite\
            \ continua pendente (U3)"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "INVITE_INVALID com reason EXPIRED, REVOKED, USED ou TENANT_INACTIVE;\
            \ ou TERMS_NOT_ACCEPTED (U3)"
      summary: Verifica a assinatura e abre a sessão; o cookie de renovação vem em
        Set-Cookie
      tags:
      - auth-controller
  /api/v1/bots:
    get:
      operationId: listBots
      parameters:
      - in: query
        name: state
        required: false
        schema:
          type: string
          enum:
          - DRAFT
          - VALIDATED
          - ACTIVE
          - PAUSED
          - CLOSING_PENDING
          - STOPPED
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          default: 50
          maximum: 100
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotPage"
          description: Página dos bots
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: VALIDATION_FAILED
      security:
      - accessToken: []
      summary: "Bots da pessoa por estado, inclusive rascunhos, com o contador de\
        \ ativos (FR7.7)"
      tags:
      - bot-controller
    post:
      operationId: createBot
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBotRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotSummary"
          description: Rascunho criado no modo escolhido
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "REAL_NOT_ELIGIBLE: market = REAL e a pessoa não pode criar\
            \ bot REAL; reason traz o motivo mais forte (KILL_SWITCH, REAL_DISABLED,\
            \ WALLET_INACTIVE, NOT_RELEASED ou QUARANTINE). Também IDEMPOTENCY_CONFLICT,\
            \ como hoje"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "VALIDATION_FAILED: nome, templateId ou market inválido"
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "SERVICE_UNAVAILABLE: a elegibilidade do REAL não pôde ser\
            \ lida; falha fechada, nenhum bot é criado"
      security:
      - accessToken: []
      summary: "Cria o rascunho (DRAFT) no modo escolhido (market), a partir de uma\
        \ estratégia modelo (BR1.1)"
      tags:
      - bot-controller
  /api/v1/bots/real-eligibility:
    get:
      operationId: getRealEligibility
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealEligibility"
          description: A elegibilidade
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "SERVICE_UNAVAILABLE: o estado do REAL não pôde ser lido; a\
            \ tela mantém Real desabilitada (falha fechada)"
      security:
      - accessToken: []
      summary: "Se a pessoa pode criar um bot REAL agora, com o motivo mais forte\
        \ quando não pode (FR1.2, ADR-005)"
      tags:
      - bot-controller
  /api/v1/bots/{botId}:
    get:
      operationId: getBot
      parameters:
      - in: path
        name: botId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotDetail"
          description: O bot
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "NOT_FOUND: bot de outra pessoa"
      security:
      - accessToken: []
      summary: "Um bot da pessoa com o rascunho e os limites vigentes (AC4.4.1, BR6.2)"
      tags:
      - bot-controller
  /api/v1/bots/{botId}/commands/{command}:
    post:
      operationId: runBotCommand
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: botId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: command
        required: true
        schema:
          type: string
          enum:
          - start
          - pause
          - resume
          - stop
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotSummary"
          description: Estado confirmado
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "INVALID_TRANSITION, ACTIVE_BOT_LIMIT, PAUSED_BY_SYSTEM ou\
            \ DAILY_LOSS_LIMIT_REACHED"
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "SERVICE_UNAVAILABLE: tentar de novo"
      security:
      - accessToken: []
      summary: "Comandos de ciclo de vida: start, pause, resume e stop (BR2.2 a BR2.7)"
      tags:
      - bot-controller
  /api/v1/bots/{botId}/day-usage:
    get:
      operationId: getBotDayUsage
      parameters:
      - in: path
        name: botId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DayUsage"
          description: Uso do dia
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "NOT_FOUND: bot de outra pessoa"
      security:
      - accessToken: []
      summary: "Uso do dia UTC: exposição pelo custo e perda do dia (AC4.10.1, BR7.5)"
      tags:
      - ledger-controller
  /api/v1/bots/{botId}/decisions:
    get:
      operationId: listBotDecisions
      parameters:
      - in: path
        name: botId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          default: 50
          maximum: 100
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionPage"
          description: Página das decisões
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "NOT_FOUND: bot de outra pessoa"
      security:
      - accessToken: []
      summary: "Decisões explicadas do bot, mais novas primeiro (US4.5)"
      tags:
      - bot-controller
  /api/v1/bots/{botId}/draft:
    put:
      operationId: saveBotDraft
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: botId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftStepRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotSummary"
          description: Etapa salva
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "LIMIT_INCOHERENT, VIRTUAL_BALANCE_ABOVE_CAP ou VALIDATION_FAILED"
      security:
      - accessToken: []
      summary: Salva a etapa do assistente (AC4.1.3)
      tags:
      - bot-controller
  /api/v1/bots/{botId}/limits:
    post:
      operationId: changeBotLimits
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: botId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotLimits"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotSummary"
          description: Nova versão gravada
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "LIMIT_INCOHERENT, ou VALIDATION_FAILED no campo limits num\
            \ bot REAL: um bot REAL usa os limites REAL da conta e não tem limites\
            \ próprios (BR1.9)"
      security:
      - accessToken: []
      summary: "Nova versão dos limites, válida só para operações futuras (US4.9)"
      tags:
      - bot-controller
  /api/v1/bots/{botId}/rejections:
    get:
      operationId: listBotRejections
      parameters:
      - in: path
        name: botId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          default: 50
          maximum: 100
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RejectionPage"
          description: "Página das recusas, vazia quando nenhuma"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: VALIDATION_FAILED
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "NOT_FOUND: nenhuma avaliação desse bot para a pessoa do token"
      security:
      - accessToken: []
      summary: Ordens recusadas com o limite que barrou e o horário (AC4.10.4)
      tags:
      - rejection-controller
  /api/v1/bots/{botId}/trades:
    get:
      operationId: listBotTrades
      parameters:
      - in: path
        name: botId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperTradePage"
          description: Página das operações
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: VALIDATION_FAILED
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "NOT_FOUND: bot de outra pessoa"
      security:
      - accessToken: []
      summary: "Operações simuladas do bot, cada uma uma única vez (AC4.10.3)"
      tags:
      - ledger-controller
  /api/v1/feedback:
    post:
      operationId: sendFeedback
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackReceipt"
          description: Registrado; a mesma chave com o mesmo corpo devolve o mesmo
            201
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "VALIDATION_FAILED em text (vazio ou mais de 2.000 caracteres),\
            \ screen (fora de S1 a S9) ou campo desconhecido; o app preserva o texto\
            \ (AC6.1.3)"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: UNAUTHENTICATED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: FORBIDDEN_ROLE para token de administrador
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "IDEMPOTENCY_CONFLICT: mesma chave com outro corpo"
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "RATE_LIMITED: 10 comentários na última hora; Retry-After diz\
            \ quando tentar de novo (U8)"
      security:
      - accessToken: []
      summary: Registra um comentário com a tela de origem (FR13.1); tenant e pessoa
        vêm do token
      tags:
      - feedback-controller
  /api/v1/invites/{code}:
    get:
      operationId: lookupInvite
      parameters:
      - description: Código do convite recebido no link
        in: path
        name: code
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteLookup"
          description: "Estado derivado, validade, termos e aviso de risco vigentes"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "INVITE_NOT_FOUND, igual para código desconhecido e mal formado"
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "RATE_LIMITED: mais de 10 consultas por minuto deste IP; nã\
            o diz se o código existe"
          headers:
            Retry-After:
              schema:
                type: integer
              style: simple
      summary: "Estado do convite e termos a aceitar, sem sessão (AC1.1.1); o código\
        \ nunca vai para log"
      tags:
      - invite-lookup-controller
  /api/v1/ledger:
    get:
      operationId: listLedgerEntries
      parameters:
      - in: query
        name: botId
        required: false
        schema:
          type: string
          format: uuid
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerEntryPage"
          description: Página dos lançamentos
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: VALIDATION_FAILED
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "NOT_FOUND: bot de outra pessoa"
      security:
      - accessToken: []
      summary: Lançamentos do ledger PAPER da pessoa (AC5.2.1)
      tags:
      - ledger-controller
  /api/v1/legal/current:
    get:
      operationId: getCurrentLegalDocuments
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalDocuments"
          description: "Versão vigente efetiva; Cache-Control public, max-age=300\
            \ e ETag por hash do conteúdo"
          headers:
            ETag:
              schema:
                type: string
              style: simple
        "304":
          description: "Não modificado (If-None-Match igual ao ETag), sem corpo"
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "RATE_LIMITED: mais de 60 requisições por minuto deste IP"
          headers:
            Retry-After:
              schema:
                type: integer
              style: simple
      summary: "Versão vigente dos termos, da política e do aviso de risco, sem sessã\
        o (FR1.1, FR2.1)"
      tags:
      - legal-documents-controller
  /api/v1/legal/versions:
    get:
      operationId: listLegalVersions
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LegalVersionRef"
          description: Vigente e anteriores; nunca versões futuras ou ignoradas na
            ativação
          headers:
            ETag:
              schema:
                type: string
              style: simple
        "304":
          description: "Não modificado (If-None-Match igual ao ETag), sem corpo"
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "RATE_LIMITED: mais de 60 requisições por minuto deste IP"
          headers:
            Retry-After:
              schema:
                type: integer
              style: simple
      summary: "Histórico das versões publicadas, mais nova primeiro (FR8.1)"
      tags:
      - legal-documents-controller
  /api/v1/legal/versions/{version}:
    get:
      operationId: getLegalVersion
      parameters:
      - description: "Identificador da versão, por exemplo v2"
        in: path
        name: version
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalDocuments"
          description: "A versão pedida, se estiver no histórico"
          headers:
            ETag:
              schema:
                type: string
              style: simple
        "304":
          description: "Não modificado (If-None-Match igual ao ETag), sem corpo"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "NOT_FOUND: versão fora do histórico (futura, ignorada ou desconhecida)"
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "RATE_LIMITED: mais de 60 requisições por minuto deste IP"
          headers:
            Retry-After:
              schema:
                type: integer
              style: simple
      summary: "Uma versão do histórico (FR8.1, BR1.10)"
      tags:
      - legal-documents-controller
  /api/v1/pnl:
    get:
      operationId: getPnl
      parameters:
      - in: query
        name: botId
        required: false
        schema:
          type: string
          format: uuid
      - in: query
        name: from
        required: true
        schema:
          type: string
          format: date-time
      - in: query
        name: to
        required: true
        schema:
          type: string
          format: date-time
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PnlReport"
          description: P&L do período
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "VALIDATION_FAILED: from >= to, período acima de 366 dias ou\
            \ campo inválido"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "NOT_FOUND: bot de outra pessoa"
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "SERVICE_UNAVAILABLE: não foi possível calcular agora (BR6.6)"
      security:
      - accessToken: []
      summary: "P&L por token, bot e período [from, to) em UTC (FR10.3)"
      tags:
      - pnl-controller
  /api/v1/pnl/by-mode:
    get:
      operationId: getPnlByMode
      parameters:
      - in: query
        name: period
        required: false
