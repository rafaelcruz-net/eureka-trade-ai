      - holders
      - liquidity
      - mint
      - price
      - risk
      - symbol
      - volume24h
    SourceRef:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        simulated:
          type: boolean
        sourceId:
          type: string
      required:
      - name
      - simulated
      - sourceId
    SourceStatus:
      type: object
      additionalProperties: false
      properties:
        lastUpdatedAt:
          type: string
          format: date-time
          description: Ausente enquanto a fonte nunca coletou (PENDING)
        source:
          $ref: "#/components/schemas/SourceRef"
        status:
          type: string
          enum:
          - PENDING
          - OK
          - DEGRADED
          - FAILED
      required:
      - source
      - status
    SourceUnavailableProblem:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
          - SOURCE_UNAVAILABLE
        correlationId:
          type: string
        detail:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceStatus"
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          format: uri
      required:
      - code
      - correlationId
      - sources
      - status
      - title
      - type
    StrategyParameter:
      type: object
      additionalProperties: false
      properties:
        default:
          type: string
        key:
          type: string
        label:
          type: string
        max:
          type: string
        min:
          type: string
        step:
          type: string
        unit:
          type: string
      required:
      - default
      - key
      - label
      - max
      - min
      - step
      - unit
    StrategyTemplate:
      type: object
      additionalProperties: false
      properties:
        description:
          type: string
        name:
          type: string
        parameters:
          type: array
          items:
            $ref: "#/components/schemas/StrategyParameter"
        templateId:
          type: string
        version:
          type: string
      required:
      - description
      - name
      - parameters
      - templateId
      - version
    TermsStatus:
      type: object
      additionalProperties: false
      properties:
        acceptedAt:
          type: string
          format: date-time
          description: UTC
        acceptedVersion:
          type: string
          description: Versão do aceite mais recente
        currentVersion:
          type: string
          description: Versão vigente efetiva
        upToDate:
          type: boolean
          description: Verdadeiro quando há um aceite da versão vigente (a trava deixa
            passar)
      required:
      - acceptedAt
      - acceptedVersion
      - currentVersion
      - upToDate
    TokenRef:
      type: object
      additionalProperties: false
      properties:
        chain:
          type: string
        mint:
          type: string
      required:
      - chain
      - mint
    TokenRule:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
          enum:
          - LIQUIDITY
          - VOLUME_24H
          - HOLDERS
          - AGE_MINUTES
          - RISK_SCORE
        operator:
          type: string
          enum:
          - GTE
          - LTE
        value:
          type: string
          pattern: ^-?\d+(\.\d+)?$
      required:
      - field
      - operator
      - value
    TokenSelection:
      type: object
      additionalProperties: false
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/TokenRule"
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/TokenRef"
    UnavailableRisk:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          enum:
          - INSUFFICIENT_COVERAGE
          - SOURCE_UNAVAILABLE
        status:
          type: string
          enum:
          - UNAVAILABLE
      required:
      - reason
      - status
    UnknownValue:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          enum:
          - NOT_PROVIDED
          - SOURCE_UNAVAILABLE
          - NOT_YET_OBSERVED
        source:
          $ref: "#/components/schemas/SourceRef"
        status:
          type: string
          enum:
          - UNKNOWN
      required:
      - reason
      - status
    UnownedPnlLine:
      type: object
      additionalProperties: false
      description: Diferente de zero só com pelo menos um motivo (FR5.3)
      properties:
        feesLamports:
          type: string
          pattern: "^-?[0-9]{1,20}$"
        realizedLamports:
          type: string
          pattern: "^-?[0-9]{1,20}$"
        reasons:
          type: array
          enum:
          - SURPLUS_WITHOUT_OWNER
          - ORDER_RECORD_MISSING
          items:
            type: string
        unrealizedLamports:
          $ref: "#/components/schemas/LamportsAmount"
      required:
      - feesLamports
      - realizedLamports
      - reasons
      - unrealizedLamports
    VerifyRequest:
      type: object
      additionalProperties: false
      properties:
        acceptedTermsVersion:
          type: string
          description: Versão vigente dos termos aceita; obrigatória com inviteCode
          maxLength: 32
          minLength: 0
        inviteCode:
          type: string
          description: Código do convite; presente só no primeiro acesso por convite
            (U3)
          maxLength: 128
          minLength: 0
        message:
          type: string
          minLength: 1
        provider:
          type: string
          enum:
          - PHANTOM
          - SOLFLARE
        signature:
          type: string
          description: Assinatura em base58
          minLength: 1
        walletAddress:
          type: string
          minLength: 1
      required:
      - message
      - provider
      - signature
      - walletAddress
