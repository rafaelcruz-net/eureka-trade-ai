  /api/v1/terms/acceptances:
    post:
      operationId: acceptTerms
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptTermsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermsStatus"
          description: "Aceite registrado, ou já existente para a versão (sem nova\
            \ gravação); a mesma chave devolve a mesma resposta"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "VALIDATION_FAILED: versão ausente, vazia ou com mais de 32\
            \ caracteres, campo desconhecido ou Idempotency-Key ausente"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: UNAUTHENTICATED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: FORBIDDEN_ROLE para token de administrador
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: TERMS_VERSION_OUTDATED (o corpo traz a versão vigente em currentVersion)
            ou IDEMPOTENCY_CONFLICT (mesma chave com outra versão)
      security:
      - accessToken: []
      summary: Aceita a versão vigente dos termos (FR4.2); pessoa e tenant vêm do
        token
      tags:
      - terms-acceptance-controller
  /api/v1/tokens/{chain}/{mint}/assessment:
    get:
      operationId: getTokenAssessment
      parameters:
      - in: path
        name: chain
        required: true
        schema:
          type: string
      - in: path
        name: mint
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assessment"
          description: "Avaliação guardada, em validação"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: NOT_FOUND para token sem observação nas últimas 24 horas
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "RATE_LIMITED, com Retry-After"
      security:
      - accessToken: []
      summary: "Avaliação de risco com fatores, pesos e versão (FR6.1 a FR6.3)"
      tags:
      - assessment-controller
components:
  schemas:
    AcceptTermsRequest:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
          maxLength: 32
          minLength: 0
      required:
      - version
    AcceptedTerms:
      type: object
      additionalProperties: false
      properties:
        acceptedAt:
          type: string
          format: date-time
          description: UTC
        riskNoticeText:
          type:
          - string
          - "null"
          description: Texto simples do aviso de risco daquela versão
        termsText:
          type:
          - string
          - "null"
          description: Texto simples dos termos daquela versão
        version:
          type: string
      required:
      - acceptedAt
      - riskNoticeText
      - termsText
      - version
    AcceptedVersion:
      type: object
      additionalProperties: false
      properties:
        acceptedAt:
          type: string
          format: date-time
        version:
          type: string
      required:
      - acceptedAt
      - version
    AccessSummary:
      type: object
      additionalProperties: false
      properties:
        acceptedVersions:
          type: array
          items:
            $ref: "#/components/schemas/AcceptedVersion"
        accountCreatedAt:
          type: string
          format: date-time
        botCount:
          type: integer
          format: int64
          minimum: 0
        feedbackCount:
          type: integer
          format: int64
          minimum: 0
        lastLoginAt:
          type:
          - string
          - "null"
          format: date-time
          description: Início da sessão mais recente; null antes do primeiro login
        paperOrderCount:
          type: integer
          format: int64
          minimum: 0
        provider:
          type: string
        requests:
          type: array
          items:
            $ref: "#/components/schemas/AccessSummaryRequest"
        walletMasked:
          type: string
          description: 4 primeiros e 4 últimos caracteres
      required:
      - acceptedVersions
      - accountCreatedAt
      - botCount
      - feedbackCount
      - lastLoginAt
      - paperOrderCount
      - provider
      - requests
      - walletMasked
    AccessSummaryRequest:
      type: object
      additionalProperties: false
      properties:
        receivedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - RECEIVED
          - AWAITING_VERIFICATION
          - IN_PROGRESS
          - DONE
          - REFUSED
        type:
          type: string
          enum:
          - ACCESS
          - CORRECTION
          - DELETION
          - OTHER
      required:
      - receivedAt
      - status
      - type
    Account:
      type: object
      additionalProperties: false
      properties:
        acceptedTerms:
          $ref: "#/components/schemas/AcceptedTerms"
          description: Ausente só para conta criada sem convite (conta de smoke do
            perfil de teste)
        provider:
          type: string
          enum:
          - PHANTOM
          - SOLFLARE
        realMode:
          type: string
          enum:
          - UNAVAILABLE
        sessionExpiresAt:
          type: string
          format: date-time
          description: "Fim absoluto da sessão atual (UTC); pode terminar antes, depois\
            \ de 8 horas sem uso"
        terms:
          $ref: "#/components/schemas/TermsStatus"
          description: "u3-reacceptance (L2, BR3.10): situação diante da versão vigente;\
            \ ausente só para conta sem nenhum aceite (conta semeada por teste)"
        walletAddressMasked:
          type: string
          description: 4 primeiros e 4 últimos caracteres
      required:
      - provider
      - realMode
      - sessionExpiresAt
      - walletAddressMasked
    Assessment:
      type: object
      additionalProperties: false
      properties:
        bandRaisedByUnknown:
          type: boolean
          description: true quando a faixa Baixo passou a Médio por fator sem dado
            (BR3.4)
        computedAt:
          type: string
          format: date-time
        coverage:
          type: string
          description: Percentual
          pattern: ^-?\d+(\.\d+)?$
        dataSource:
          $ref: "#/components/schemas/DataSource"
          description: Fonte real ou simulada e atribuição (U2)
        decisionHint:
          type: string
          description: NO_TRADE quando indisponível (FR6.2)
          enum:
          - NO_TRADE
          - ELIGIBLE
        factors:
          type: array
          items:
            $ref: "#/components/schemas/AssessmentFactor"
        inValidation:
          type: boolean
          description: "Sempre true: indicador em validação"
        minCoverage:
          type: string
          description: Percentual
          pattern: ^-?\d+(\.\d+)?$
        risk:
          $ref: "#/components/schemas/RiskSummary"
        weightSetVersion:
          type: string
      required:
      - bandRaisedByUnknown
      - computedAt
      - coverage
      - dataSource
      - decisionHint
      - factors
      - inValidation
      - minCoverage
      - risk
      - weightSetVersion
    AssessmentFactor:
      type: object
      additionalProperties: false
      properties:
        contribution:
          description: Pontos do indicador (DecimalString) ou UNKNOWN quando a entrada
            é unknown
          oneOf:
          - type: string
          - $ref: "#/components/schemas/UnknownValue"
        factorId:
          type: string
          enum:
          - LIQUIDITY
          - HOLDERS
          - VOLUME_24H
          - PRICE_CHANGE_1H
        factorRisk:
          type: integer
          format: int32
          maximum: 100
          minimum: 0
        input:
          $ref: "#/components/schemas/MarketValue"
        label:
          type: string
        weight:
          type: string
          pattern: ^-?\d+(\.\d+)?$
      required:
      - contribution
      - factorId
      - factorRisk
      - input
      - label
      - weight
    Attribution:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
          description: "Texto exibido, por exemplo \"Dados: CoinGecko\""
        url:
          type: string
          format: uri
          description: Link HTTPS do fornecedor
      required:
      - text
      - url
    AvailableRisk:
      type: object
      additionalProperties: false
      properties:
        band:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
        score:
          type: integer
          format: int32
          maximum: 100
          minimum: 0
        status:
          type: string
          enum:
          - AVAILABLE
      required:
      - band
      - score
      - status
    BotDetail:
      type: object
      additionalProperties: false
      properties:
        activatedAt:
          type: string
          format: date-time
        botId:
          type: string
          format: uuid
        draftStep:
          type: integer
          format: int32
        limits:
          $ref: "#/components/schemas/BotLimits"
        limitsVersion:
          type: integer
          format: int32
        market:
          type: string
          description: "261113-trading-real-bot U4 (U4-NFR8.5): mercado do bot, fixado\
            \ na criação"
          enum:
          - PAPER
          - REAL
        mode:
          type: string
          deprecated: true
          description: "Obsoleto: sempre igual a market (FR2.4, ADR-009). Leia market"
          enum:
          - PAPER
          - REAL
        name:
          type: string
        parameters:
          type: object
          additionalProperties:
            type: string
        pauseReasons:
          type: array
          items:
            type: string
        resumesAt:
          type: string
          format: date-time
        state:
          type: string
        stoppedAt:
          type: string
          format: date-time
        templateId:
          type: string
        templateVersion:
          type: string
        tokenSelection:
          $ref: "#/components/schemas/TokenSelection"
        updatedAt:
          type: string
          format: date-time
        virtualBalance:
          type: string
      required:
      - botId
      - draftStep
      - market
      - mode
      - name
      - parameters
      - pauseReasons
      - state
      - templateId
      - templateVersion
      - tokenSelection
      - updatedAt
    BotLimits:
      type: object
      additionalProperties: false
      properties:
        maxDailyLoss:
          type: string
        maxDrawdown:
          type: string
          description: Percentual
        maxOrderSize:
          type: string
        maxSlippage:
          type: string
          description: Percentual
        maxTokenExposure:
          type: string
        maxTotalExposure:
          type: string
        minIntervalSeconds:
          type: integer
          format: int64
          minimum: 1
        minLiquidity:
          type: string
      required:
      - maxDailyLoss
      - maxDrawdown
      - maxOrderSize
      - maxSlippage
      - maxTokenExposure
      - maxTotalExposure
      - minIntervalSeconds
      - minLiquidity
    BotPage:
      type: object
      additionalProperties: false
      properties:
        activeCount:
          type: integer
          format: int64
        activeLimit:
          type: integer
          format: int32
        items:
          type: array
          items:
            $ref: "#/components/schemas/BotSummary"
        nextCursor:
          type:
          - string
          - "null"
      required:
      - activeCount
      - activeLimit
      - items
      - nextCursor
    BotSummary:
      type: object
      additionalProperties: false
      properties:
        botId:
          type: string
          format: uuid
        draftStep:
          type: integer
          format: int32
        limitsVersion:
          type: integer
          format: int32
        market:
          type: string
          description: "261113-trading-real-bot U4 (BR1.1): mercado do bot, fixo desde\
            \ a criação"
          enum:
          - PAPER
          - REAL
        mode:
          type: string
          deprecated: true
          description: "Obsoleto: sempre igual a market (FR2.4, ADR-009). Leia market"
          enum:
          - PAPER
          - REAL
        name:
          type: string
        pauseReasons:
          type: array
          items:
            type: string
            enum:
            - PERSON
            - DAILY_LOSS
            - DRAWDOWN
            - SYSTEM
            - ADMIN_RELEASED
            - WAITING_ACTIVE_SLOT
        resumesAt:
          type: string
          format: date-time
        state:
          type: string
          enum:
          - DRAFT
          - VALIDATED
          - ACTIVE
          - PAUSED
          - CLOSING_PENDING
          - STOPPED
        templateId:
          type: string
        updatedAt:
          type: string
          format: date-time
      required:
      - botId
      - market
      - mode
      - name
      - pauseReasons
      - state
    BotWalletView:
      type: object
      additionalProperties: false
      properties:
        address:
          type: string
        balance:
          $ref: "#/components/schemas/RealBalanceView"
        capLamports:
          type: string
        capSetBy:
          type: string
          description: "Quem definiu o teto atual: a pessoa ou o administrador (só\
            \ leitura)"
          enum:
          - USER
          - ADMIN
        mainWalletAddress:
          type: string
        maxCapLamports:
          type: string
        maxSlippageBps:
          type: integer
          format: int32
        mode:
          type: string
        network:
          type: string
        pausedReason:
          type: string
        policyResetRequired:
          type: boolean
        release:
          $ref: "#/components/schemas/RealReleaseStatus"
          description: A liberação do REAL na rede do ambiente
        status:
          type: string
    ChallengeRequest:
      type: object
      additionalProperties: false
      properties:
        walletAddress:
          type: string
          description: Endereço público Solana
          minLength: 1
      required:
      - walletAddress
    ChallengeResponse:
      type: object
      additionalProperties: false
      properties:
        chain:
          type: string
        domain:
          type: string
        expiresAt:
          type: string
          format: date-time
        issuedAt:
          type: string
          format: date-time
        message:
          type: string
          description: Texto exato a assinar
        nonce:
          type: string
      required:
      - chain
      - domain
      - expiresAt
      - issuedAt
      - message
      - nonce
    ConditionalOrder:
      type: object
      additionalProperties: false
      description: "Uma saída automática (stop, alvo ou OCO) de uma posição REAL"
      properties:
        amountBaseUnits:
          type: string
          description: "Quantidade em unidades base, como texto"
        conditionalOrderId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        filledAt:
          type: string
          format: date-time
        filledSide:
          type: string
          enum:
          - STOP
          - TAKE_PROFIT
        kind:
          type: string
          enum:
          - STOP
          - TAKE_PROFIT
          - OCO
        needsUserCancellation:
          type: boolean
          description: Cancelamento automático parado há 15 minutos ou mais (BR6.7)
        positionMint:
          type: string
        state:
          type: string
          enum:
          - PENDING_SIGNATURE
          - OPEN
          - CANCELLING
          - FILLED
          - CANCELLED
          - EXPIRED
          - FAILED
        stopPriceUsd:
          type: string
          description: DecimalString em USD
        takeProfitPriceUsd:
          type: string
          description: DecimalString em USD
        txSignature:
          type: string
          description: "Assinatura do preenchimento ou, antes dele, da criação"
      required:
      - amountBaseUnits
      - conditionalOrderId
      - createdAt
      - kind
      - needsUserCancellation
      - positionMint
      - state
    ConditionalOrderPage:
      type: object
      additionalProperties: false
      description: "Condicionais da pessoa, mais recentes primeiro"
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConditionalOrder"
        nextCursor:
          type: string
        total:
          type: integer
          format: int64
      required:
      - items
      - total
    ConditionalQuote:
      type: object
      additionalProperties: false
      description: "Posição e preço atual em USD para o diálogo \"Definir stop e alvo\"\
        \ (BR8.2, BR2.6)"
      properties:
        maxTakeProfitPriceUsd:
          type: string
          description: "Maior alvo aceito (10 vezes o preço atual), DecimalString"
        minStopPriceUsd:
          type: string
          description: "Menor stop aceito (50% do preço atual), DecimalString"
        observedAt:
          type: string
          format: date-time
        positionBaseUnits:
          type: string
          description: "Posição inteira em unidades base, como texto"
        positionMint:
          type: string
        priceStatus:
          type: string
          enum:
          - KNOWN
          - UNKNOWN
        priceUsd:
          type: string
          description: DecimalString em USD; ausente quando desconhecido
        source:
          type: string
          description: Fonte do preço
      required:
      - positionBaseUnits
      - positionMint
      - priceStatus
    ConditionalSignatureRequest:
      type: object
      additionalProperties: false
      description: "A assinatura da carteira principal: do consentimento (caminho\
        \ simulado) ou da transação"
      properties:
        signature:
          type: string
          description: Assinatura Base58 da mensagem de consentimento (signMessage)
        signedTransactionBase64:
          type: string
          description: Transação assinada pela carteira principal (Base64)
    ConditionalSigningSession:
      type: object
      additionalProperties: false
      description: "O que a carteira principal assina, e até quando"
      properties:
        deadline:
          type: string
          format: date-time
        kind:
          type: string
          enum:
          - MESSAGE
          - TRANSACTION
        message:
          type: string
          description: Mensagem de consentimento montada pelo servidor (kind MESSAGE)
        serverTime:
          type: string
          format: date-time
        transactionBase64:
          type: string
          description: "Transação montada pelo servidor (kind TRANSACTION), em Base64"
      required:
      - deadline
      - kind
      - serverTime
    Coverage:
      type: object
      additionalProperties: false
      properties:
        informed:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
      required:
      - informed
      - total
    CreateBotRequest:
      type: object
      additionalProperties: false
      properties:
        market:
          type: string
          description: "Modo do bot, fixo depois da criação (FR1.4). O app novo sempre\
            \ envia; ausente vale PAPER, para os clientes antigos. REAL só com a elegibilidade\
            \ disponível no comando"
          enum:
          - PAPER
          - REAL
        name:
          type: string
          maxLength: 60
        templateId:
          type: string
      required:
      - name
      - templateId
    CreateConditionalOrderRequest:
      type: object
      additionalProperties: false
      description: "Pedido de stop, alvo ou OCO de uma posição REAL"
      properties:
        kind:
          type: string
          enum:
          - STOP
          - TAKE_PROFIT
          - OCO
        positionMint:
          type: string
          description: Mint da posição (Base58)
        stopPriceUsd:
          type: string
          description: DecimalString em USD; obrigatório em STOP e OCO
          example: "0.00008"
        takeProfitPriceUsd:
          type: string
          description: DecimalString em USD; obrigatório em TAKE_PROFIT e OCO
          example: "0.00015"
      required:
      - kind
      - positionMint
    CreateDataRequest:
      type: object
      additionalProperties: false
      properties:
        details:
          type: string
          description: "Texto do pedido, de 1 a 1.000 caracteres (pontos de código)"
          maxLength: 1000
          minLength: 1
        type:
          type: string
          enum:
          - ACCESS
          - CORRECTION
          - DELETION
          - OTHER
      required:
      - details
      - type
    CreatedConditionalOrder:
      type: object
      additionalProperties: false
      description: A condicional criada e a sessão de assinatura aberta
      properties:
        conditionalOrder:
          $ref: "#/components/schemas/ConditionalOrder"
        conditionalOrderId:
          type: string
          format: uuid
        signingSession:
          $ref: "#/components/schemas/ConditionalSigningSession"
        stopNotGuaranteed:
          type: boolean
          description: "BR3.8: o stop não tem execução garantida (sempre verdadeiro)"
      required:
      - conditionalOrder
      - conditionalOrderId
      - signingSession
      - stopNotGuaranteed
    DashboardAuthExpiredEvent:
      type: object
      additionalProperties: false
      description: data do evento auth.expired
      properties:
        expiredAt:
          type: string
          format: date-time
      required:
      - expiredAt
    DashboardBotStateEvent:
      type: object
      additionalProperties: false
      description: "data do evento bot.state: até 100 bots da pessoa, de qualquer\
        \ estado, mais recentes primeiro; sem activeLimit nem contagens por estado"
      properties:
        activeCount:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: "#/components/schemas/BotSummary"
      required:
      - activeCount
      - items
    DashboardDataStatusEvent:
      type: object
      additionalProperties: false
      description: data do evento data.status
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SourceStatus"
      required:
      - items
    DashboardHeartbeatEvent:
      type: object
      additionalProperties: false
      description: data do evento heartbeat
      properties:
        at:
          type: string
          format: date-time
      required:
      - at
    DashboardPnlUpdatedEvent:
      type: object
      additionalProperties: false
      description: data do evento pnl.updated
      properties:
        ledgerMark:
          type: integer
          format: int64
      required:
      - ledgerMark
    DashboardTradeNotice:
      type: object
      additionalProperties: false
      description: "Ordem simulada nova, sem preços nem notFilledReason"
      properties:
        botId:
          type: string
          format: uuid
        chain:
          type: string
        createdAt:
          type: string
          format: date-time
        orderId:
          type: string
          format: uuid
        side:
          type: string
          enum:
          - BUY
          - SELL
        status:
          type: string
          enum:
          - FILLED
          - PARTIALLY_FILLED
          - NOT_FILLED
          - CLOSE_PENDING
        tokenMint:
          type: string
      required:
      - botId
      - chain
      - createdAt
      - orderId
      - side
      - status
      - tokenMint
    DashboardTradeRecordedEvent:
      type: object
      additionalProperties: false
      description: data do evento trade.recorded
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DashboardTradeNotice"
      required:
      - items
    DataRequestView:
      type: object
      additionalProperties: false
      properties:
        accessSummary:
          description: Foto do resumo de Acesso liberada na conclusão; null nos demais
            casos
          oneOf:
          - $ref: "#/components/schemas/AccessSummary"
          - type: "null"
        dueAt:
          type: string
          format: date-time
          description: receivedAt mais 15 dias corridos
        receivedAt:
          type: string
          format: date-time
        refusalReason:
          type:
          - string
          - "null"
          description: Motivo da recusa; null fora de REFUSED
        requestId:
          type: string
          format: uuid
        response:
          type:
          - string
          - "null"
          description: Resposta; null até o pedido ser concluído ou recusado
        status:
          type: string
          enum:
          - RECEIVED
          - AWAITING_VERIFICATION
          - IN_PROGRESS
          - DONE
          - REFUSED
        type:
          type: string
          enum:
          - ACCESS
          - CORRECTION
          - DELETION
          - OTHER
      required:
      - accessSummary
      - dueAt
      - receivedAt
      - refusalReason
      - requestId
      - response
      - status
      - type
    DataSource:
      type: object
      additionalProperties: false
      properties:
        attribution:
          $ref: "#/components/schemas/Attribution"
          description: Atribuição exigida pelo fornecedor da fonte real; ausente sem
            fonte real
