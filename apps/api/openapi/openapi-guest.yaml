openapi: 3.1.0
info:
  title: MemeTrade guest API
  version: 1.0.0
paths:
  /api/v1/account:
    get:
      operationId: getAccount
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
          description: Conta da própria pessoa; Cache-Control no-store
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: UNAUTHENTICATED; o app tenta renovar e depois leva à entrada
            com a tela de origem
      security:
      - accessToken: []
      summary: "Dados da conta: carteira abreviada, provedor, fim da sessão e termos\
        \ aceitos (US1.5)"
      tags:
      - account-controller
  /api/v1/auth/challenge:
    post:
      operationId: issueChallenge
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeResponse"
          description: OK
      summary: "Emite mensagem de login com domínio, nonce de uso único, expiraçã\
        o de 5 minutos e chain (FR1.3)"
      tags:
      - auth-controller
  /api/v1/auth/logout:
    post:
      operationId: logout
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Sessão encerrada
      security:
      - accessToken: []
      summary: Encerra a sessão e revoga o token de renovação; bots continuam rodando
      tags:
      - auth-controller
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestSession"
          description: Novo token de acesso; o cookie de renovação é trocado
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: UNAUTHENTICATED; o app volta à entrada e depois à tela de origem
      summary: Troca o cookie de renovação por um novo token de acesso; sem Idempotency-Key
      tags:
      - auth-controller
  /api/v1/auth/verify:
    post:
      operationId: verifyLogin
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestSession"
          description: Sessão aberta
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: LOGIN_CHALLENGE_REJECTED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: FORBIDDEN_ROLE quando a carteira é a de administrador
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "INVITE_NOT_FOUND: código do convite desconhecido ou mal formado\
            \ (U3)"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "WALLET_ALREADY_LINKED: a carteira já tem conta; o convite\
            \ continua pendente (U3)"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "INVITE_INVALID com reason EXPIRED, REVOKED, USED ou TENANT_INACTIVE;\
            \ ou TERMS_NOT_ACCEPTED (U3)"
      summary: Verifica a assinatura e abre a sessão; o cookie de renovação vem em
        Set-Cookie
      tags:
      - auth-controller
  /api/v1/bots/{botId}/day-usage:
    get:
      operationId: getBotDayUsage
      parameters:
      - in: path
        name: botId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DayUsage"
          description: Uso do dia
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "NOT_FOUND: bot de outra pessoa"
      security:
      - accessToken: []
      summary: "Uso do dia UTC: exposição pelo custo e perda do dia (AC4.10.1, BR7.5)"
      tags:
      - ledger-controller
  /api/v1/bots/{botId}/rejections:
    get:
      operationId: listBotRejections
      parameters:
      - in: path
        name: botId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          default: 50
          maximum: 100
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RejectionPage"
          description: "Página das recusas, vazia quando nenhuma"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: VALIDATION_FAILED
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "NOT_FOUND: nenhuma avaliação desse bot para a pessoa do token"
      security:
      - accessToken: []
      summary: Ordens recusadas com o limite que barrou e o horário (AC4.10.4)
      tags:
      - rejection-controller
  /api/v1/bots/{botId}/trades:
    get:
      operationId: listBotTrades
      parameters:
      - in: path
        name: botId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperTradePage"
          description: Página das operações
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: VALIDATION_FAILED
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "NOT_FOUND: bot de outra pessoa"
      security:
      - accessToken: []
      summary: "Operações simuladas do bot, cada uma uma única vez (AC4.10.3)"
      tags:
      - ledger-controller
  /api/v1/invites/{code}:
    get:
      operationId: lookupInvite
      parameters:
      - description: Código do convite recebido no link
        in: path
        name: code
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteLookup"
          description: "Estado derivado, validade, termos e aviso de risco vigentes"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "INVITE_NOT_FOUND, igual para código desconhecido e mal formado"
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "RATE_LIMITED: mais de 10 consultas por minuto deste IP; nã\
            o diz se o código existe"
          headers:
            Retry-After:
              schema:
                type: integer
              style: simple
      summary: "Estado do convite e termos a aceitar, sem sessão (AC1.1.1); o código\
        \ nunca vai para log"
      tags:
      - invite-lookup-controller
  /api/v1/ledger:
    get:
      operationId: listLedgerEntries
      parameters:
      - in: query
        name: botId
        required: false
        schema:
          type: string
          format: uuid
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerEntryPage"
          description: Página dos lançamentos
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: VALIDATION_FAILED
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "NOT_FOUND: bot de outra pessoa"
      security:
      - accessToken: []
      summary: Lançamentos do ledger PAPER da pessoa (AC5.2.1)
      tags:
      - ledger-controller
  /api/v1/pnl:
    get:
      operationId: getPnl
      parameters:
      - in: query
        name: botId
        required: false
        schema:
          type: string
          format: uuid
      - in: query
        name: from
        required: true
        schema:
          type: string
          format: date-time
      - in: query
        name: to
        required: true
        schema:
          type: string
          format: date-time
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PnlReport"
          description: P&L do período
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "VALIDATION_FAILED: from >= to, período acima de 366 dias ou\
            \ campo inválido"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "NOT_FOUND: bot de outra pessoa"
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "SERVICE_UNAVAILABLE: não foi possível calcular agora (BR6.6)"
      security:
      - accessToken: []
      summary: "P&L por token, bot e período [from, to) em UTC (FR10.3)"
      tags:
      - pnl-controller
  /api/v1/reconciliation:
    get:
      operationId: getReconciliation
      parameters:
      - in: query
        name: botId
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationResult"
          description: Última conferência
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "NOT_FOUND: bot de outra pessoa"
      security:
      - accessToken: []
      summary: Resultado da última conferência entre operações e ledger (FR10.5)
      tags:
      - pnl-controller
  /api/v1/reconciliation/run:
    post:
      operationId: runReconciliation
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationResult"
          description: "Resultado da conferência, gravada como ON_DEMAND"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "VALIDATION_FAILED: Idempotency-Key ausente"
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "RATE_LIMITED, com Retry-After (6 por minuto por pessoa)"
          headers:
            Retry-After:
              schema:
                type: integer
              style: simple
      security:
      - accessToken: []
      summary: "Verificar agora: confere as contas PAPER da pessoa na hora (BR8.3)"
      tags:
      - pnl-controller
  /api/v1/scanner/tokens:
    get:
      operationId: listScannerTokens
      parameters:
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          default: 50
          maximum: 100
          minimum: 1
      - in: query
        name: sort
        required: false
        schema:
          type: string
          enum:
          - AGE
          - LIQUIDITY
          - VOLUME_24H
          - HOLDERS
          - RISK_SCORE
      - in: query
        name: order
        required: false
        schema:
          type: string
          enum:
          - ASC
          - DESC
      - in: query
        name: minLiquidity
        required: false
        schema:
          type: string
          pattern: ^-?\d+(\.\d+)?$
      - in: query
        name: maxAgeMinutes
        required: false
        schema:
          type: integer
          minimum: 0
      - in: query
        name: minVolume24h
        required: false
        schema:
          type: string
          pattern: ^-?\d+(\.\d+)?$
      - in: query
        name: minHolders
        required: false
        schema:
          type: integer
          minimum: 0
      - in: query
        name: maxRiskScore
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 0
      - in: query
        name: sourceId
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScannerPage"
          description: Página da foto da lista
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: VALIDATION_FAILED com a lista de campos (BR2.7)
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "RATE_LIMITED, com Retry-After"
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SourceUnavailableProblem"
          description: SOURCE_UNAVAILABLE quando todas as fontes falham (AC2.3.3)
      security:
      - accessToken: []
      summary: "Lista paginada com filtros, ordem determinística e desempate está\
        vel (FR5.1, FR5.2)"
      tags:
      - scanner-controller
  /api/v1/tokens/{chain}/{mint}/assessment:
    get:
      operationId: getTokenAssessment
      parameters:
      - in: path
        name: chain
        required: true
        schema:
          type: string
      - in: path
        name: mint
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assessment"
          description: "Avaliação guardada, em validação"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: NOT_FOUND para token sem observação nas últimas 24 horas
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "RATE_LIMITED, com Retry-After"
      security:
      - accessToken: []
      summary: "Avaliação de risco com fatores, pesos e versão (FR6.1 a FR6.3)"
      tags:
      - assessment-controller
components:
  schemas:
    AcceptedTerms:
      type: object
      additionalProperties: false
      properties:
        acceptedAt:
          type: string
          format: date-time
          description: UTC
        riskNoticeText:
          type:
          - string
          - "null"
          description: Texto simples do aviso de risco daquela versão
        termsText:
          type:
          - string
          - "null"
          description: Texto simples dos termos daquela versão
        version:
          type: string
      required:
      - acceptedAt
      - riskNoticeText
      - termsText
      - version
    Account:
      type: object
      additionalProperties: false
      properties:
        acceptedTerms:
          $ref: "#/components/schemas/AcceptedTerms"
          description: Ausente só para conta criada sem convite (conta de smoke do
            perfil de teste)
        provider:
          type: string
          enum:
          - PHANTOM
          - SOLFLARE
        realMode:
          type: string
          enum:
          - UNAVAILABLE
        sessionExpiresAt:
          type: string
          format: date-time
          description: "Fim absoluto da sessão atual (UTC); pode terminar antes, depois\
            \ de 8 horas sem uso"
        walletAddressMasked:
          type: string
          description: 4 primeiros e 4 últimos caracteres
      required:
      - provider
      - realMode
      - sessionExpiresAt
      - walletAddressMasked
    Assessment:
      type: object
      additionalProperties: false
      properties:
        bandRaisedByUnknown:
          type: boolean
          description: true quando a faixa Baixo passou a Médio por fator sem dado
            (BR3.4)
        computedAt:
          type: string
          format: date-time
        coverage:
          type: string
          description: Percentual
          pattern: ^-?\d+(\.\d+)?$
        decisionHint:
          type: string
          description: NO_TRADE quando indisponível (FR6.2)
          enum:
          - NO_TRADE
          - ELIGIBLE
        factors:
          type: array
          items:
            $ref: "#/components/schemas/AssessmentFactor"
        inValidation:
          type: boolean
          description: "Sempre true: indicador em validação"
        minCoverage:
          type: string
          description: Percentual
          pattern: ^-?\d+(\.\d+)?$
        risk:
          $ref: "#/components/schemas/RiskSummary"
        weightSetVersion:
          type: string
      required:
      - bandRaisedByUnknown
      - computedAt
      - coverage
      - decisionHint
      - factors
      - inValidation
      - minCoverage
      - risk
      - weightSetVersion
    AssessmentFactor:
      type: object
      additionalProperties: false
      properties:
        contribution:
          description: Pontos do indicador (DecimalString) ou UNKNOWN quando a entrada
            é unknown
          oneOf:
          - type: string
          - $ref: "#/components/schemas/UnknownValue"
        factorId:
          type: string
          enum:
          - LIQUIDITY
          - HOLDERS
          - VOLUME_24H
          - PRICE_CHANGE_1H
        factorRisk:
          type: integer
          format: int32
          maximum: 100
          minimum: 0
        input:
          $ref: "#/components/schemas/MarketValue"
        label:
          type: string
        weight:
          type: string
          pattern: ^-?\d+(\.\d+)?$
      required:
      - contribution
      - factorId
      - factorRisk
      - input
      - label
      - weight
    AvailableRisk:
      type: object
      additionalProperties: false
      properties:
        band:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
        score:
          type: integer
          format: int32
          maximum: 100
          minimum: 0
        status:
          type: string
          enum:
          - AVAILABLE
      required:
      - band
      - score
      - status
    ChallengeRequest:
      type: object
      additionalProperties: false
      properties:
        walletAddress:
          type: string
          description: Endereço público Solana
          minLength: 1
      required:
      - walletAddress
    ChallengeResponse:
      type: object
      additionalProperties: false
      properties:
        chain:
          type: string
        domain:
          type: string
        expiresAt:
          type: string
          format: date-time
        issuedAt:
          type: string
          format: date-time
        message:
          type: string
          description: Texto exato a assinar
        nonce:
          type: string
      required:
      - chain
      - domain
      - expiresAt
      - issuedAt
      - message
      - nonce
    Coverage:
      type: object
      additionalProperties: false
      properties:
        informed:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
      required:
      - informed
      - total
    DayUsage:
      type: object
      additionalProperties: false
      description: Uso do dia UTC; os limites vêm da U5 na tela (BR7.5)
      properties:
        dayLoss:
          type: string
          pattern: ^-?\d+(\.\d+)?$
        exposure:
          type: string
          pattern: ^-?\d+(\.\d+)?$
        utcDay:
          type: string
          format: date
      required:
      - dayLoss
      - exposure
      - utcDay
    Divergence:
      type: object
      additionalProperties: false
      properties:
        observedAt:
          type: string
          format: date-time
        source:
          $ref: "#/components/schemas/SourceRef"
        value:
          type: string
          pattern: ^-?\d+(\.\d+)?$
      required:
      - observedAt
      - source
      - value
    FieldViolation:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        message:
          type: string
    GuestSession:
      type: object
      additionalProperties: false
      properties:
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        role:
          type: string
          enum:
          - BETA_USER
        sessionExpiresAt:
          type: string
          format: date-time
      required:
      - accessToken
      - accessTokenExpiresAt
      - role
      - sessionExpiresAt
    InviteLookup:
      type: object
      additionalProperties: false
      properties:
        expiresAt:
          type: string
          format: date-time
        riskNoticeText:
          type: string
          description: Texto simples; nunca HTML
        status:
          type: string
          enum:
          - PENDING
          - USED
          - EXPIRED
          - REVOKED
        termsText:
          type: string
          description: Texto simples; nunca HTML
        termsVersion:
          type: string
          description: Versão vigente a aceitar
      required:
      - expiresAt
      - riskNoticeText
      - status
      - termsText
      - termsVersion
    KnownValue:
      type: object
      additionalProperties: false
      properties:
        divergence:
          type: array
          description: Presente só quando outra fonte diverge acima da tolerância
            (FR4.7)
          items:
            $ref: "#/components/schemas/Divergence"
        observedAt:
          type: string
          format: date-time
        source:
          $ref: "#/components/schemas/SourceRef"
        stale:
          type: boolean
          description: true quando a idade passa de 5 minutos
        status:
          type: string
          enum:
          - KNOWN
        value:
          type: string
          description: Decimal exato em texto
          pattern: ^-?\d+(\.\d+)?$
      required:
      - observedAt
      - source
      - stale
      - status
      - value
    LedgerEntry:
      type: object
      additionalProperties: false
      description: Lançamento imutável do ledger PAPER (AC5.2.1)
      properties:
        amount:
          type: string
          pattern: ^-?\d+(\.\d+)?$
        asset:
          type: string
        botId:
          type: string
          format: uuid
        compensatesEntryId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        entryId:
          type: string
          format: uuid
        mode:
          type: string
          enum:
          - PAPER
        orderId:
          type: string
          format: uuid
          description: "Operação do lançamento, para agrupar (BR10.2)"
        referenceId:
          type: string
        simulationPolicyVersion:
          type: string
        type:
          type: string
          enum:
          - FUNDING
          - TRADE_COST
          - TRADE_PROCEEDS
          - SLIPPAGE
          - FEE
          - CLOSE
          - COMPENSATION
      required:
      - amount
      - asset
      - botId
      - createdAt
      - entryId
      - mode
      - referenceId
      - type
    LedgerEntryPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LedgerEntry"
        nextCursor:
          type:
          - string
          - "null"
          description: null quando não há próxima página
        total:
          type: integer
          format: int64
      required:
      - items
      - nextCursor
      - total
    MarketValue:
      discriminator:
        mapping:
          KNOWN: "#/components/schemas/KnownValue"
          UNKNOWN: "#/components/schemas/UnknownValue"
        propertyName: status
      oneOf:
      - $ref: "#/components/schemas/KnownValue"
      - $ref: "#/components/schemas/UnknownValue"
    OrderRejection:
      type: object
      additionalProperties: false
      description: Ordem recusada com o limite que barrou e o horário (AC4.10.4)
      properties:
        decisionId:
          type: string
          format: uuid
        details:
          type: array
          items:
            $ref: "#/components/schemas/RejectionReasonDetail"
        evaluatedAt:
          type: string
          format: date-time
        limitsVersion:
          type: integer
          format: int64
        market:
          $ref: "#/components/schemas/RejectionMarket"
        mode:
          type: string
          enum:
          - PAPER
        pauseTriggers:
          type: array
          description: Vazio quando nenhum
          items:
            type: string
            enum:
            - DAILY_LOSS
            - DRAWDOWN
        reasons:
          type: array
          description: Na ordem fixa; o primeiro é o motivo principal
          items:
            type: string
            enum:
            - ORDER_SIZE
            - TOKEN_EXPOSURE
            - TOTAL_EXPOSURE
            - SLIPPAGE
            - MIN_LIQUIDITY
            - STALE_DATA
            - INTERVAL
            - DUPLICATE
            - INSUFFICIENT_PAPER_BALANCE
            - DAILY_LOSS
            - DRAWDOWN
        rejectionId:
          type: string
          format: uuid
      required:
      - decisionId
      - details
      - evaluatedAt
      - limitsVersion
      - market
      - mode
      - pauseTriggers
      - reasons
      - rejectionId
    PaperTrade:
      type: object
      additionalProperties: false
      description: "Uma operação simulada do bot, cada uma uma única vez (AC4.10.3)"
      properties:
        chain:
          type: string
        createdAt:
          type: string
          format: date-time
        fees:
          type: string
          pattern: ^-?\d+(\.\d+)?$
        fillPrice:
          type: string
          pattern: ^-?\d+(\.\d+)?$
        filledAt:
          type: string
          format: date-time
        filledQuantity:
          type: string
          pattern: ^-?\d+(\.\d+)?$
        grossAmount:
          type: string
          pattern: ^-?\d+(\.\d+)?$
        idempotencyKey:
          type: string
        impactPct:
          type: string
          description: Pontos percentuais
          pattern: ^-?\d+(\.\d+)?$
        kind:
          type: string
          enum:
          - TRADE
          - CLOSE
        limitsVersion:
          type: integer
          format: int64
        liquidityConsumedPct:
          type: string
          description: Pontos percentuais
          pattern: ^-?\d+(\.\d+)?$
        marketObservedAt:
          type: string
          format: date-time
        marketSource:
          type: string
        mode:
          type: string
          enum:
          - PAPER
        notFilledReason:
          type: string
          enum:
          - PRICE_UNAVAILABLE
          - NO_LIQUIDITY
          - QUANTITY_BELOW_MINIMUM
          - NO_POSITION
          - ACCOUNT_CLOSING
          - INSUFFICIENT_BALANCE
          - TENANT_MISMATCH
        orderId:
          type: string
          format: uuid
        quotedPrice:
          type: string
          pattern: ^-?\d+(\.\d+)?$
        realized:
          type: string
          description: Só em venda e fechamento
          pattern: ^-?\d+(\.\d+)?$
        referencePrice:
          type: string
          pattern: ^-?\d+(\.\d+)?$
        requestedQuantity:
          type: string
          pattern: ^-?\d+(\.\d+)?$
        side:
          type: string
          enum:
          - BUY
          - SELL
        simulationPolicyVersion:
          type: string
        slippage:
          type: string
          description: "Pontos percentuais: spread mais impacto"
          pattern: ^-?\d+(\.\d+)?$
        spreadPct:
          type: string
          description: Pontos percentuais
          pattern: ^-?\d+(\.\d+)?$
        status:
          type: string
          enum:
          - FILLED
          - PARTIALLY_FILLED
          - NOT_FILLED
          - CLOSE_PENDING
        tokenMint:
          type: string
      required:
