        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceStatus"
        total:
          type: integer
          format: int64
      required:
      - dataSource
      - excludedByUnknown
      - items
      - nextCursor
      - pendingNewTokens
      - sources
      - total
    ScannerRow:
      type: object
      additionalProperties: false
      properties:
        ageMinutes:
          $ref: "#/components/schemas/MarketValue"
        chain:
          type: string
        coverage:
          $ref: "#/components/schemas/Coverage"
        holders:
          $ref: "#/components/schemas/MarketValue"
        liquidity:
          $ref: "#/components/schemas/MarketValue"
        mint:
          type: string
        name:
          type: string
        price:
          $ref: "#/components/schemas/MarketValue"
        risk:
          $ref: "#/components/schemas/RiskSummary"
        symbol:
          type: string
        volume24h:
          $ref: "#/components/schemas/MarketValue"
      required:
      - ageMinutes
      - chain
