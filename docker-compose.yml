# Local environment of MemeTrade (infrastructure-specification.md). Values come from .env (see .env.example).
#   docker compose up            -> postgres, db-bootstrap, db-migrate, api and web with the DEFAULT profile
#   docker compose up postgres db-bootstrap db-migrate
#                                -> "dev": database with roles and migrations, for api and web outside containers;
#                                   run `docker compose up db-migrate` again to apply a new migration
# Start order: postgres (healthy over TCP) -> db-bootstrap (logins and privileges, superuser) -> db-migrate
# (Liquibase with the schema owner) -> api (application and retention logins only, never the owner) -> web; the
# worker (U5) starts after db-migrate and a healthy api. The only profile this file names is the worker's own.
# This file never enables a test profile, a seeded account or a raised login limit (ComposeFilesTest checks it);
# scripts/verify.sh adds infra/docker-compose.test.yml for the smoke test.
name: memetrade

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  postgres:
    image: postgres:19-alpine@sha256:cac45fb483caee3668946088a1c0532db89d5285c28dbfeac889b4068296e06f
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-memetrade}
    command:
      - postgres
      - -c
      - track_commit_timestamp=on
      - -c
      - log_statement=none
      - -c
      - log_min_duration_statement=-1
      - -c
      - log_min_error_statement=panic
      - -c
      - log_error_verbosity=terse
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      # TCP, not the socket: the temporary init server of a new volume listens only on the socket.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    mem_limit: 1g
    logging: *logging

  db-bootstrap:
    # Same image as postgres (it has psql). Idempotent; runs on every `up`, on new volumes and on U1 volumes alike.
    image: postgres:19-alpine@sha256:cac45fb483caee3668946088a1c0532db89d5285c28dbfeac889b4068296e06f
    entrypoint: ['sh', '/bootstrap/bootstrap.sh']
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-memetrade}
      DB_OWNER_USER: ${DB_OWNER_USER:-memetrade_owner}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD in .env}
      DB_USER: ${DB_USER:-memetrade_app}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_RETENTION_USER: ${DB_RETENTION_USER:-memetrade_retention}
      DB_RETENTION_PASSWORD: ${DB_RETENTION_PASSWORD:?set DB_RETENTION_PASSWORD in .env}
    volumes:
      - ./infra/postgres/bootstrap:/bootstrap:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    logging: *logging

  db-migrate:
    # Same image as the api; MigrationRunner applies Liquibase with the schema OWNER login and exits.
    # The owner credential exists only here (NFR6.3); the api never receives it.
    image: memetrade-api:${IMAGE_TAG:-local}
    entrypoint:
      - java
      - -Dloader.main=com.memetrade.ops.MigrationRunner
      - -cp
      - /app/app.jar
      - org.springframework.boot.loader.launch.PropertiesLauncher
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: ${POSTGRES_DB:-memetrade}
      DB_OWNER_USER: ${DB_OWNER_USER:-memetrade_owner}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD in .env}
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    restart: 'no'
    logging: *logging

  api:
    build:
      context: ./apps/api
      # 261113-trading-real-bot U5 (infrastructure-specification.md "SHA do commit nas imagens"): the CI passes the
      # commit (env BUILD_SHA); a local build leaves it empty and the gates of the REAL block CI_UNREACHABLE.
      args:
        BUILD_SHA: ${BUILD_SHA:-}
    image: memetrade-api:${IMAGE_TAG:-local}
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: ${POSTGRES_DB:-memetrade}
      DB_USER: ${DB_USER:-memetrade_app}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_RETENTION_USER: ${DB_RETENTION_USER:-memetrade_retention}
      DB_RETENTION_PASSWORD: ${DB_RETENTION_PASSWORD:?set DB_RETENTION_PASSWORD in .env}
      # BR3.1: months the trail keeps an event; the api refuses to start below 12.
      AUDIT_RETENTION_MONTHS: ${AUDIT_RETENTION_MONTHS:-12}
      ACCESS_TOKEN_SIGNING_KEY: ${ACCESS_TOKEN_SIGNING_KEY:?set ACCESS_TOKEN_SIGNING_KEY in .env}
      # u2-retention (BR2.4, NFR6.2): key of the HMAC of the wallets in the audit trail; required, at least 32 bytes.
      MEMETRADE_AUDIT_WALLET_HMAC_KEY: ${MEMETRADE_AUDIT_WALLET_HMAC_KEY:?}
      GUEST_APP_ORIGIN: ${GUEST_APP_ORIGIN:-http://localhost:3000}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      ADMIN_WALLET_ADDRESSES: ${ADMIN_WALLET_ADDRESSES:-}
      # U8: the only origin of the administrative CORS policy; the api refuses a wildcard.
      ADMIN_APP_ORIGIN: ${ADMIN_APP_ORIGIN:-http://localhost:3001}
      # U4 (infrastructure-specification.md): none is a secret; the api checks each range at start-up.
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-20}
      SCHEDULER_POOL_SIZE: ${SCHEDULER_POOL_SIZE:-23}
      MARKET_SOURCES: ${MARKET_SOURCES:-sim-a,sim-b}
      MARKET_COLLECTION_INTERVAL: ${MARKET_COLLECTION_INTERVAL:-30s}
      MARKET_SIMULATED_TOKENS_PER_SOURCE: ${MARKET_SIMULATED_TOKENS_PER_SOURCE:-200}
      MARKET_SIMULATED_SEED: ${MARKET_SIMULATED_SEED:-42}
      MARKET_DIVERGENCE_TOLERANCE_PERCENT: ${MARKET_DIVERGENCE_TOLERANCE_PERCENT:-5.0000}
      SCANNER_RATE_LIMIT_PER_MINUTE: ${SCANNER_RATE_LIMIT_PER_MINUTE:-60}
      # u1-legal-documents (infrastructure-specification.md): none is a secret. Empty deployment fields read "a definir"
      # and make the current version not publishable; the publishing requirement is on only in production. The CIDR
      # list exempts ONLY the direct peers of the web and admin sub-range from the limit of /api/v1/legal/**, never the
      # bridge gateway (browser, Playwright and load scripts on the published ports). The per-minute limit is NOT
      # passed here, so the high value of application-loadtest.yml is never hidden by an environment variable.
      MEMETRADE_LEGAL_STORAGE_LOCATION: ${MEMETRADE_LEGAL_STORAGE_LOCATION:-}
      MEMETRADE_LEGAL_INTERNATIONAL_TRANSFER: ${MEMETRADE_LEGAL_INTERNATIONAL_TRANSFER:-}
      MEMETRADE_LEGAL_DPO_EMAIL: ${MEMETRADE_LEGAL_DPO_EMAIL:-}
      MEMETRADE_LEGAL_REQUIRE_PUBLISHABLE: ${MEMETRADE_LEGAL_REQUIRE_PUBLISHABLE:-false}
      MEMETRADE_LEGAL_RATE_LIMIT_INTERNAL_NETWORKS: ${MEMETRADE_LEGAL_RATE_LIMIT_INTERNAL_NETWORKS:-${COMPOSE_APPS_SUBNET:-172.28.1.0/24}}
    ports:
      - '127.0.0.1:8080:8080'
      - '127.0.0.1:8081:8081'
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - java
        - -Dloader.main=com.memetrade.ops.HealthProbe
        - -cp
        - /app/app.jar
        - org.springframework.boot.loader.launch.PropertiesLauncher
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    mem_limit: 1g
    logging: *logging

  worker:
    # U5 (C20, ADR-005, NFR10.9): the same image as the api in the worker process. It runs the bot cycle every 5-minute
    # slot, the midnight job, the closing check and the decision purge; it has no controller and publishes NO port
    # (8081 answers only the actuator, inside the network). It receives only what it uses: never the signing key, the
    # app origin, the trusted proxies, the administrator wallets nor the retention login.
    # Connections of PostgreSQL (max_connections 100 of postgres:17):
    # api 20 + pnl-mismatch-audit 2 + trail retention (U2) 1 + U6 retention 1
    # + U8 apply lock 1 + U8 feedback retention 1 + worker 36
    # + db-bootstrap and db-migrate at start-up 2 + 3 reserved
    # for the superuser = 67 (ComposeFilesTest). 261113-trading-real-bot U5 (U5-NFR3.7): the worker has one connection
    # per scheduled method plus 4 cycles and 4 reserve; U7: 28 scheduled methods (conditional read, conditional cancel
    # and exits gauges added), 36 connections. 261121-paper-real-unico U2 (NFR3.15): the pool pnl-mismatch-audit of the
    # api, 2 fixed connections (memetrade.pnl.mismatch-audit.pool-size). 67 of 100;
    # the REAL overlay (worker 37) adds the TxSigner (up to 10), 78 of 100.
    image: memetrade-api:${IMAGE_TAG:-local}
    environment:
      SPRING_PROFILES_ACTIVE: worker
      MEMETRADE_PROCESS: worker
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: ${POSTGRES_DB:-memetrade}
      DB_USER: ${DB_USER:-memetrade_app}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      # u2-retention (BR2.4, NFR6.1): the worker publishes audit events too and validates the same key.
      MEMETRADE_AUDIT_WALLET_HMAC_KEY: ${MEMETRADE_AUDIT_WALLET_HMAC_KEY:?}
      DB_POOL_MAX_SIZE: '36'
      SCHEDULER_POOL_SIZE: '28'
      MARKET_SOURCES: ${MARKET_SOURCES:-sim-a,sim-b}
      MARKET_COLLECTION_INTERVAL: ${MARKET_COLLECTION_INTERVAL:-30s}
      MARKET_SIMULATED_TOKENS_PER_SOURCE: ${MARKET_SIMULATED_TOKENS_PER_SOURCE:-200}
      MARKET_SIMULATED_SEED: ${MARKET_SIMULATED_SEED:-42}
      MARKET_DIVERGENCE_TOLERANCE_PERCENT: ${MARKET_DIVERGENCE_TOLERANCE_PERCENT:-5.0000}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      api:
        # The api collects the market data the cycle reads (U4 runs only in the api process).
        condition: service_healthy
    healthcheck:
      # Liveness only: the informational botCycles indicator stays out (Q6 of the NFR Requirements).
      test:
        - CMD
        - java
        - -Dloader.main=com.memetrade.ops.HealthProbe
        - -cp
        - /app/app.jar
        - org.springframework.boot.loader.launch.PropertiesLauncher
        - http://127.0.0.1:8081/actuator/health/liveness
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: unless-stopped
    mem_limit: 1g
    logging: *logging

  web:
    build:
      context: ./apps/web
    image: memetrade-web:${IMAGE_TAG:-local}
    environment:
      API_ORIGIN: ${API_ORIGIN:-http://localhost:8080}
      # u1-legal-documents: the origin the Next.js SERVER uses to read /api/v1/legal/** inside the network; never sent
      # to the browser.
      API_INTERNAL_ORIGIN: ${API_INTERNAL_ORIGIN:-http://api:8080}
    networks:
      default:
        # Fixed address inside the apps sub-range, the only range exempt from the legal documents limit.
        ipv4_address: ${COMPOSE_WEB_IPV4:-172.28.1.10}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    mem_limit: 512m
    logging: *logging

  admin:
    # U8 (infrastructure-specification.md Q1): the administrator app, same pattern as web. Published only on loopback
    # 3001, on the same site as the API (localhost) because of the SameSite=Strict refresh cookie; the browser calls the
    # API on localhost:8080 under the administrative CORS policy (ADMIN_APP_ORIGIN of the api). No secret, no database
    # credential, no NEXT_PUBLIC_* variable: API_ORIGIN and GUEST_APP_ORIGIN are read by the server at run time.
    build:
      context: ./apps/admin
    image: memetrade-admin:${IMAGE_TAG:-local}
    environment:
      API_ORIGIN: ${API_ORIGIN:-http://localhost:8080}
      GUEST_APP_ORIGIN: ${GUEST_APP_ORIGIN:-http://localhost:3000}
      API_INTERNAL_ORIGIN: ${API_INTERNAL_ORIGIN:-http://api:8080}
    networks:
      default:
        ipv4_address: ${COMPOSE_ADMIN_IPV4:-172.28.1.11}
    ports:
      - '127.0.0.1:3001:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    mem_limit: 512m
    logging: *logging

networks:
  # u1-legal-documents (infrastructure-specification.md "Rede"): a fixed, parameterised range with an explicit gateway
  # at .1. Containers without a fixed address get one from the dynamic range only, so the apps sub-range holds only
  # web and admin. The first `up` with this block needs a `docker compose down` first; when the default range collides
  # with another Docker network ("Pool overlaps"), change the COMPOSE_* values in .env together.
  default:
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-172.28.0.0/16}
          gateway: ${COMPOSE_GATEWAY:-172.28.0.1}
          ip_range: ${COMPOSE_DYNAMIC_RANGE:-172.28.0.0/24}

volumes:
  pgdata:
