# Versioned register of security-scan exceptions (team.md "Segurança na CI").
# Each entry needs: id, tool (dependency-check | codeql | pnpm-audit | gitleaks), finding, justification,
# approvedBy (project owner), approvedAt and expires ("YYYY-MM-DD" in quotes, so YAML keeps them as text; at most
# 90 days after approvedAt).
# An expired exception blocks the build again (SecurityExceptionsTest).
#
# Example:
#   - id: EX-001
#     tool: dependency-check
#     finding: CVE-2099-0001
#     justification: Not reachable: the vulnerable parser is never called by the API.
#     approvedBy: project-owner
#     approvedAt: "2026-10-28"
#     expires: "2027-01-26"
#
# EX-001 to EX-012: Spring Framework 6.2.19, the last open-source 6.2 release (6.2.20 is commercial only). Approved by
# the project owner in the Build and Test of 261109-termos-lgpd (2026-11-11), each one checked against the code: the
# API is Spring MVC on Tomcat (no WebFlux, RSocket, Jetty, XsltView or functional endpoints), the live channel is the
# annotated SseEmitter, no SpEL is ever built from request input, and every request parameter is read as a String and
# parsed by hand (no implicit data binding). Follow-up before they expire: move to Spring Boot 4 (Spring 7.0.9+).
# EX-013: false positive, the CVE is in the Prometheus server, not in the Micrometer client library.
# EX-014: picomatch <= 4.0.7 ReDoS with no fixed version, dev-only in apps/web and apps/admin. Approved by the project
# owner at the Plan Approval of the Build and Test loop-back 1 of 261113-trading-real-bot (2026-11-18). pnpm audit does
# not read this file, so the GHSA is also in pnpm.auditConfig.ignoreGhsas of both apps. Remove both when a fixed
# picomatch is released (or for good if the advisory stays withdrawn) and update the package.
exceptions:
  - id: EX-001
    tool: dependency-check
    finding: CVE-2026-47884
    justification: XsltView SSRF/RCE. The API renders no views and has no XsltView; every endpoint returns JSON.
    approvedBy: project-owner
    approvedAt: "2026-11-11"
    expires: "2027-02-09"
  - id: EX-002
    tool: dependency-check
    finding: CVE-2026-47885
    justification: PartEventHttpMessageReader of Spring WebFlux. WebFlux is not on the classpath; no multipart endpoint.
    approvedBy: project-owner
    approvedAt: "2026-11-11"
    expires: "2027-02-09"
  - id: EX-003
    tool: dependency-check
    finding: CVE-2026-47886
    justification: DoS through SpEL evaluated from user input. No SpEL expression is ever built from request data.
    approvedBy: project-owner
    approvedAt: "2026-11-11"
    expires: "2027-02-09"
  - id: EX-004
    tool: dependency-check
    finding: CVE-2026-47888
    justification: Spring RSocket SETUP frame memory leak. RSocket is not used nor on the classpath.
    approvedBy: project-owner
    approvedAt: "2026-11-11"
    expires: "2027-02-09"
  - id: EX-005
    tool: dependency-check
    finding: CVE-2026-47889
    justification: WebFlux on the Jetty 12 Core adapter. The API runs Spring MVC on Tomcat; no WebFlux, no Jetty.
    approvedBy: project-owner
    approvedAt: "2026-11-11"
    expires: "2027-02-09"
  - id: EX-006
    tool: dependency-check
    finding: CVE-2026-47890
    justification: SSE with view fragments. The live channel sends JSON data through SseEmitter, never view fragments.
    approvedBy: project-owner
    approvedAt: "2026-11-11"
    expires: "2027-02-09"
  - id: EX-007
    tool: dependency-check
    finding: CVE-2026-47891
    justification: WebFlux with the Aalto XML processor. No WebFlux and no XML input; the API accepts JSON only.
    approvedBy: project-owner
    approvedAt: "2026-11-11"
    expires: "2027-02-09"
  - id: EX-008
    tool: dependency-check
    finding: CVE-2026-47892
    justification: Header predicate bypass of WebFlux functional endpoints. The API has only annotated MVC controllers.
    approvedBy: project-owner
    approvedAt: "2026-11-11"
    expires: "2027-02-09"
  - id: EX-009
    tool: dependency-check
    finding: CVE-2026-47893
    justification: WebFlux WebSocket exception reasons. No WebFlux and no WebSocket endpoint.
    approvedBy: project-owner
    approvedAt: "2026-11-11"
    expires: "2027-02-09"
  - id: EX-010
    tool: dependency-check
    finding: CVE-2026-59282
    justification: DoS through user-supplied property paths in data binding. No controller binds request data onto objects; parameters are Strings parsed by hand and bodies are read by Jackson.
    approvedBy: project-owner
    approvedAt: "2026-11-11"
    expires: "2027-02-09"
  - id: EX-011
    tool: dependency-check
    finding: CVE-2026-59283
    justification: SimpleEvaluationContext guard bypass with the SpEL compiler. No SpEL is evaluated from request data and the compiler mode is not enabled.
    approvedBy: project-owner
    approvedAt: "2026-11-11"
    expires: "2027-02-09"
  - id: EX-012
    tool: dependency-check
    finding: CVE-2026-59313
    justification: SSE stream corruption in the functional web framework. The live channel uses the annotated SseEmitter, not the functional framework.
    approvedBy: project-owner
    approvedAt: "2026-11-11"
    expires: "2027-02-09"
  - id: EX-013
    tool: dependency-check
    finding: CVE-2026-42154
    justification: False positive. The CVE is in the remote read endpoint of the Prometheus server; micrometer-registry-prometheus is only the client that exposes /actuator/prometheus.
    approvedBy: project-owner
    approvedAt: "2026-11-11"
    expires: "2027-02-09"
  - id: EX-014
    tool: pnpm-audit
    finding: GHSA-fc5q-39xc-vjpf
    justification: picomatch <= 4.0.7 ReDoS through crafted extglob patterns, no fixed version. Dev-only (Jest and ESLint tooling) in apps/web and apps/admin; globs come from the repository's own config, never from user input, and picomatch is not in the browser bundle. GitHub withdrew the advisory on 2026-11-18; kept until it is confirmed gone.
    approvedBy: project-owner
    approvedAt: "2026-11-18"
    expires: "2027-02-16"
